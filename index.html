<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Experiment Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Experiment Lab</h1>
        <p class="subtitle">A gallery of small, interactive experiments. Built one at a time.</p>
    </header>

    <main>
        <div class="grid">
            <a href="experiments/001-game-of-life/" class="card">
                <div class="card-number">001</div>
                <div class="card-preview">
                    <canvas id="preview-gol" width="200" height="200"></canvas>
                </div>
                <div class="card-info">
                    <h2>Game of Life</h2>
                    <p>Conway's cellular automaton. Click to draw, watch it evolve.</p>
                    <span class="card-tag">simulation</span>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <p>Built by a human and an AI, one experiment at a time.</p>
        <p><a href="https://github.com/runquik/gleaming_apple" class="gh-link">View on GitHub</a></p>
    </footer>

    <script>
    // Animated preview for Game of Life card — with glow and age coloring
    (function() {
        const canvas = document.getElementById('preview-gol');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cols = 50, rows = 50;
        const cellW = canvas.width / cols;
        const cellH = canvas.height / rows;
        const MAX_AGE = 80;
        const FADE = 8;
        const palette = [
            [255,255,255],[110,231,183],[16,185,129],[6,95,70],[139,92,246]
        ];

        // age > 0 = alive, < 0 = fading, 0 = dead
        let age = new Int16Array(rows * cols);
        for (let i = 0; i < age.length; i++) age[i] = Math.random() < 0.3 ? 1 : 0;

        function lerp(stops, t) {
            t = Math.max(0, Math.min(1, t));
            const s = t * (stops.length - 1);
            const i = Math.floor(s), f = s - i;
            const a = stops[Math.min(i, stops.length-1)];
            const b = stops[Math.min(i+1, stops.length-1)];
            return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
        }

        function step() {
            const next = new Int16Array(rows * cols);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    let n = 0;
                    for (let dy = -1; dy <= 1; dy++)
                        for (let dx = -1; dx <= 1; dx++) {
                            if (!dy && !dx) continue;
                            if (age[((y+dy+rows)%rows)*cols + (x+dx+cols)%cols] > 0) n++;
                        }
                    const i = y * cols + x;
                    const alive = age[i] > 0;
                    if (alive) next[i] = (n===2||n===3) ? Math.min(age[i]+1, MAX_AGE) : -FADE;
                    else if (n === 3) next[i] = 1;
                    else next[i] = age[i] < 0 ? age[i] + 1 : 0;
                }
            age = next;
        }

        function draw() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const v = age[y * cols + x];
                    if (v > 0) {
                        const [r,g,b] = lerp(palette, v / MAX_AGE);
                        const cx = x * cellW + cellW/2, cy = y * cellH + cellH/2;
                        // Glow
                        const brightness = Math.max(0.2, 1 - v/MAX_AGE);
                        const grad = ctx.createRadialGradient(cx,cy,0, cx,cy, cellW*1.5);
                        grad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${(0.35*brightness).toFixed(2)})`);
                        grad.addColorStop(1, `rgba(${r|0},${g|0},${b|0},0)`);
                        ctx.fillStyle = grad;
                        ctx.fillRect(cx-cellW*1.5, cy-cellH*1.5, cellW*3, cellH*3);
                        // Cell dot
                        ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, cellW/2 - 0.3, 0, Math.PI*2);
                        ctx.fill();
                    } else if (v < 0) {
                        const alpha = (-v / FADE) * 0.3;
                        const cx = x * cellW + cellW/2, cy = y * cellH + cellH/2;
                        ctx.fillStyle = `rgba(139,92,246,${alpha.toFixed(2)})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, cellW/2 - 0.5, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
        }

        function tick() { step(); draw(); }
        draw();
        setInterval(tick, 80);
    })();
    </script>
</body>
</html>
