<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Experiment Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Experiment Lab</h1>
        <p class="subtitle">A gallery of small, interactive experiments. Built one at a time.</p>
    </header>

    <main>
        <div class="grid">
            <a href="experiments/001-game-of-life/" class="card">
                <div class="card-number">001</div>
                <div class="card-preview">
                    <canvas id="preview-gol" width="200" height="200"></canvas>
                </div>
                <div class="card-info">
                    <h2>Light Wave</h2>
                    <p>Draw white-hot light to push back an endless tide of virus. No score. No end. Just light.</p>
                    <span class="card-tag tag-light">light</span>
                    <span class="card-tag tag-virus">virus</span>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <p>Built by a human and an AI, one experiment at a time.</p>
        <p><a href="https://github.com/runquik/gleaming_apple" class="gh-link">View on GitHub</a></p>
    </footer>

    <script>
    // Preview: light vs virus battle with matching palettes
    (function() {
        const canvas = document.getElementById('preview-gol');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cols = 50, rows = 50;
        const cw = canvas.width / cols, ch = canvas.height / rows;
        const MAX_AGE = 80, FADE = 8, CONV_L = 2, CONV_V = 4;

        // Matching palettes from main game
        const lPal = [[255,255,255],[255,245,210],[255,215,120],[255,175,55],[210,115,40]];
        const vPal = [[255,95,95],[225,50,50],[185,22,22],[130,12,12],[75,5,5]];

        let cType = new Uint8Array(rows*cols);
        let cAge  = new Int16Array(rows*cols);
        let ghost = new Uint8Array(rows*cols);
        let tick  = 0;

        function seed() {
            cType = new Uint8Array(rows*cols);
            cAge  = new Int16Array(rows*cols);
            ghost = new Uint8Array(rows*cols);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const i = y*cols+x;
                    const edge = y < 3 || y >= rows-3 || x < 3 || x >= cols-3;
                    const center = y > 14 && y < rows-14 && x > 14 && x < cols-14;
                    if (center && Math.random() < 0.35) { cType[i]=1; cAge[i]=1; }
                    else if (edge && Math.random() < 0.4) { cType[i]=2; cAge[i]=1; }
                }
        }
        seed();

        function lerp(stops, t) {
            t = Math.max(0, Math.min(1, t));
            const s = t*(stops.length-1), i = Math.floor(s), f = s-i;
            const a = stops[Math.min(i,stops.length-1)], b = stops[Math.min(i+1,stops.length-1)];
            return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
        }

        function step() {
            const nT = new Uint8Array(rows*cols), nA = new Int16Array(rows*cols);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const i = y*cols+x;
                    let nL=0, nV=0;
                    for (let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
                        if(!dy&&!dx) continue;
                        const ni=((y+dy+rows)%rows)*cols+(x+dx+cols)%cols;
                        if(cType[ni]===1&&cAge[ni]>0) nL++;
                        if(cType[ni]===2&&cAge[ni]>0) nV++;
                    }
                    if(cType[i]===0||cAge[i]<=0){
                        const lB=nL===3, vB=nV===3;
                        if(lB&&vB){nT[i]=1;nA[i]=1;}
                        else if(lB){nT[i]=1;nA[i]=1;}
                        else if(vB){nT[i]=2;nA[i]=1;}
                        else{nT[i]=0;nA[i]=cAge[i]<0?cAge[i]+1:0;}
                    } else if(cType[i]===1){
                        if(nV>=CONV_V){nT[i]=2;nA[i]=1;}
                        else if(nL===2||nL===3){nT[i]=1;nA[i]=Math.min(cAge[i]+1,MAX_AGE);}
                        else{nT[i]=0;nA[i]=-FADE;}
                    } else {
                        if(nL>=CONV_L){nT[i]=1;nA[i]=1;}
                        else if(nV===2||nV===3){nT[i]=2;nA[i]=Math.min(cAge[i]+1,MAX_AGE);}
                        else{nT[i]=0;nA[i]=-FADE;}
                    }
                }
            const prev=cType; cType=nT; cAge=nA; tick++;
            for(let i=0;i<rows*cols;i++){
                if(cType[i]===0&&cAge[i]<0&&prev[i]>0) ghost[i]=prev[i];
                else if(cAge[i]>=0) ghost[i]=0;
            }
            let h=0,v=0;
            for(let i=0;i<rows*cols;i++){if(cType[i]===1&&cAge[i]>0)h++;if(cType[i]===2&&cAge[i]>0)v++;}
            if(h===0||v===0) seed();
        }

        function draw() {
            ctx.fillStyle = '#04040c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const pulse = Math.sin(tick*0.12)*0.15+0.85;
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const i = y*cols+x, t=cType[i], a=cAge[i];
                    if(t>0&&a>0){
                        const pal = t===1?lPal:vPal;
                        const [r,g,b] = lerp(pal, a/MAX_AGE);
                        const cx=x*cw+cw/2, cy=y*ch+ch/2;
                        const br=Math.max(0.15,1-a/MAX_AGE);
                        const gA = t===1 ? 0.35*br : 0.25*br*pulse;
                        const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,cw*1.8);
                        grad.addColorStop(0,`rgba(${r|0},${g|0},${b|0},${gA.toFixed(2)})`);
                        grad.addColorStop(1,`rgba(${r|0},${g|0},${b|0},0)`);
                        ctx.fillStyle=grad;
                        ctx.fillRect(cx-cw*1.8,cy-ch*1.8,cw*3.6,ch*3.6);
                        ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
                        ctx.beginPath(); ctx.arc(cx,cy,cw/2-0.3,0,Math.PI*2); ctx.fill();
                        // White-hot core on young light cells
                        if(t===1 && a < MAX_AGE*0.35) {
                            const ca = (1 - a/(MAX_AGE*0.35))*0.7;
                            ctx.fillStyle=`rgba(255,255,255,${ca.toFixed(2)})`;
                            ctx.beginPath(); ctx.arc(cx,cy,cw*0.2,0,Math.PI*2); ctx.fill();
                        }
                    } else if(a<0){
                        const alpha=(-a/FADE)*0.3;
                        const [r,g,b]=ghost[i]===2?[110,20,20]:[200,160,60];
                        const cx=x*cw+cw/2, cy=y*ch+ch/2;
                        ctx.fillStyle=`rgba(${r},${g},${b},${alpha.toFixed(2)})`;
                        ctx.beginPath(); ctx.arc(cx,cy,cw/2-0.5,0,Math.PI*2); ctx.fill();
                    }
                }
        }

        function frame() { step(); draw(); }
        draw();
        setInterval(frame, 80);
    })();
    </script>
</body>
</html>
