<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Experiment Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Experiment Lab</h1>
        <p class="subtitle">A gallery of small, interactive experiments. Built one at a time.</p>
    </header>

    <main>
        <div class="grid">
            <a href="experiments/001-game-of-life/" class="card">
                <div class="card-number">001</div>
                <div class="card-preview">
                    <canvas id="preview-gol" width="200" height="200"></canvas>
                </div>
                <div class="card-info">
                    <h2>Game of Life: Virus Defense</h2>
                    <p>Build your colony. Survive the infection. How many waves can you hold?</p>
                    <span class="card-tag">game</span>
                    <span class="card-tag tag-virus">virus</span>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <p>Built by a human and an AI, one experiment at a time.</p>
        <p><a href="https://github.com/runquik/gleaming_apple" class="gh-link">View on GitHub</a></p>
    </footer>

    <script>
    // Animated preview: green healthy vs red virus battle
    (function() {
        const canvas = document.getElementById('preview-gol');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cols = 50, rows = 50;
        const cw = canvas.width / cols, ch = canvas.height / rows;
        const MAX_AGE = 60, FADE = 6, INF_THRESH = 3;
        const hPal = [[255,255,255],[110,231,183],[16,185,129],[6,95,70],[139,92,246]];
        const vPal = [[255,255,255],[252,165,165],[239,68,68],[185,28,28],[127,29,29]];

        let cType = new Uint8Array(rows*cols);
        let cAge = new Int16Array(rows*cols);
        let ghost = new Uint8Array(rows*cols);

        // Init: healthy in center, virus on edges
        for (let y = 0; y < rows; y++)
            for (let x = 0; x < cols; x++) {
                const i = y*cols+x;
                const edge = y < 3 || y >= rows-3 || x < 3 || x >= cols-3;
                const center = y > 12 && y < rows-12 && x > 12 && x < cols-12;
                if (center && Math.random() < 0.35) { cType[i]=1; cAge[i]=1; }
                else if (edge && Math.random() < 0.4) { cType[i]=2; cAge[i]=1; }
            }

        function lerp(stops, t) {
            t = Math.max(0, Math.min(1, t));
            const s = t*(stops.length-1), i = Math.floor(s), f = s-i;
            const a = stops[Math.min(i,stops.length-1)], b = stops[Math.min(i+1,stops.length-1)];
            return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
        }

        function step() {
            const nT = new Uint8Array(rows*cols), nA = new Int16Array(rows*cols);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const i = y*cols+x;
                    let nH=0, nV=0;
                    for (let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
                        if(!dy&&!dx) continue;
                        const ni=((y+dy+rows)%rows)*cols+(x+dx+cols)%cols;
                        if(cType[ni]===1&&cAge[ni]>0) nH++;
                        if(cType[ni]===2&&cAge[ni]>0) nV++;
                    }
                    if(cType[i]===0||cAge[i]<=0){
                        const hB=nH===3, vB=nV===3;
                        if(hB&&vB){nT[i]=2;nA[i]=1;}
                        else if(vB){nT[i]=2;nA[i]=1;}
                        else if(hB){nT[i]=1;nA[i]=1;}
                        else{nT[i]=0;nA[i]=cAge[i]<0?cAge[i]+1:0;}
                    } else if(cType[i]===1){
                        if(nV>=INF_THRESH){nT[i]=2;nA[i]=1;}
                        else if(nH===2||nH===3){nT[i]=1;nA[i]=Math.min(cAge[i]+1,MAX_AGE);}
                        else{nT[i]=0;nA[i]=-FADE;}
                    } else {
                        if(nV===2||nV===3){nT[i]=2;nA[i]=Math.min(cAge[i]+1,MAX_AGE);}
                        else{nT[i]=0;nA[i]=-FADE;}
                    }
                }
            const prev=cType; cType=nT; cAge=nA;
            for(let i=0;i<rows*cols;i++){
                if(cType[i]===0&&cAge[i]<0&&prev[i]>0) ghost[i]=prev[i];
                else if(cAge[i]>=0) ghost[i]=0;
            }
            // If one side is extinct, reset
            let h=0,v=0;
            for(let i=0;i<rows*cols;i++){if(cType[i]===1&&cAge[i]>0)h++;if(cType[i]===2&&cAge[i]>0)v++;}
            if(h===0||v===0) reset();
        }

        function reset() {
            cType = new Uint8Array(rows*cols);
            cAge = new Int16Array(rows*cols);
            ghost = new Uint8Array(rows*cols);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const i = y*cols+x;
                    const edge = y < 3 || y >= rows-3 || x < 3 || x >= cols-3;
                    const center = y > 12 && y < rows-12 && x > 12 && x < cols-12;
                    if (center && Math.random() < 0.35) { cType[i]=1; cAge[i]=1; }
                    else if (edge && Math.random() < 0.4) { cType[i]=2; cAge[i]=1; }
                }
        }

        function draw() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < rows; y++)
                for (let x = 0; x < cols; x++) {
                    const i = y*cols+x, t=cType[i], a=cAge[i];
                    if(t>0&&a>0){
                        const pal = t===1?hPal:vPal;
                        const [r,g,b] = lerp(pal, a/MAX_AGE);
                        const cx=x*cw+cw/2, cy=y*ch+ch/2;
                        const br=Math.max(0.2,1-a/MAX_AGE);
                        const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,cw*1.5);
                        grad.addColorStop(0,`rgba(${r|0},${g|0},${b|0},${(0.3*br).toFixed(2)})`);
                        grad.addColorStop(1,`rgba(${r|0},${g|0},${b|0},0)`);
                        ctx.fillStyle=grad;
                        ctx.fillRect(cx-cw*1.5,cy-ch*1.5,cw*3,ch*3);
                        ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
                        ctx.beginPath(); ctx.arc(cx,cy,cw/2-0.3,0,Math.PI*2); ctx.fill();
                    } else if(a<0){
                        const alpha=(-a/FADE)*0.3;
                        const [r,g,b]=ghost[i]===2?[120,30,30]:[80,60,120];
                        const cx=x*cw+cw/2, cy=y*ch+ch/2;
                        ctx.fillStyle=`rgba(${r},${g},${b},${alpha.toFixed(2)})`;
                        ctx.beginPath(); ctx.arc(cx,cy,cw/2-0.5,0,Math.PI*2); ctx.fill();
                    }
                }
        }

        function tick() { step(); draw(); }
        draw();
        setInterval(tick, 80);
    })();
    </script>
</body>
</html>
