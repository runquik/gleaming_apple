<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>001 — Game of Life</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #1e1e2e;
            --text: #e0e0e8;
            --text-dim: #6b6b80;
            --accent: #6ee7b7;
            --accent-dim: #2a4a3e;
            --cell-alive: #6ee7b7;
            --cell-dead: #0f0f18;
            --gridline: #151520;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            padding: 1.5rem 2rem 1rem;
            text-align: center;
            width: 100%;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .back:hover { color: var(--accent); }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0.5rem 0 0.25rem;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 1rem 2rem;
            max-width: 700px;
        }

        button, select {
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        button:hover, select:hover {
            border-color: var(--accent-dim);
        }

        button.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .stats {
            font-size: 0.75rem;
            color: var(--text-dim);
            padding: 0.5rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .stats span { color: var(--accent); }

        .canvas-wrap {
            padding: 0.5rem;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        canvas {
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: crosshair;
            max-width: 100%;
            max-height: 70vh;
        }

        .hint {
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 0.5rem 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="back">&larr; back to lab</a>
        <h1>Game of Life</h1>
        <p>Conway's cellular automaton</p>
    </header>

    <div class="controls">
        <button id="btn-play" class="active">&#9654; Play</button>
        <button id="btn-step">Step</button>
        <button id="btn-clear">Clear</button>
        <button id="btn-random">Random</button>
        <select id="sel-pattern">
            <option value="">Load pattern...</option>
            <option value="glider">Glider</option>
            <option value="pulsar">Pulsar</option>
            <option value="gosper-gun">Gosper Gun</option>
            <option value="lwss">Lightweight Spaceship</option>
            <option value="r-pentomino">R-Pentomino</option>
        </select>
        <select id="sel-speed">
            <option value="200">Normal</option>
            <option value="100">Fast</option>
            <option value="50">Blazing</option>
            <option value="400">Slow</option>
        </select>
    </div>

    <div class="stats">
        <div>Gen: <span id="stat-gen">0</span></div>
        <div>Pop: <span id="stat-pop">0</span></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="grid"></canvas>
    </div>

    <div class="hint">Click or drag to draw. Scroll to zoom (coming soon).</div>

    <script>
    (function() {
        // --- Config ---
        const CELL = 12;
        const COLS = 60;
        const ROWS = 45;

        // --- Patterns ---
        const PATTERNS = {
            glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
            pulsar: [
                [2,4],[2,5],[2,6],[2,10],[2,11],[2,12],
                [4,2],[4,7],[4,9],[4,14],[5,2],[5,7],[5,9],[5,14],
                [6,2],[6,7],[6,9],[6,14],
                [7,4],[7,5],[7,6],[7,10],[7,11],[7,12],
                [9,4],[9,5],[9,6],[9,10],[9,11],[9,12],
                [10,2],[10,7],[10,9],[10,14],[11,2],[11,7],[11,9],[11,14],
                [12,2],[12,7],[12,9],[12,14],
                [14,4],[14,5],[14,6],[14,10],[14,11],[14,12],
            ],
            'gosper-gun': [
                [5,1],[5,2],[6,1],[6,2],
                [5,11],[6,11],[7,11],
                [4,12],[8,12],[3,13],[9,13],[3,14],[9,14],
                [6,15],[4,16],[8,16],
                [5,17],[6,17],[7,17],[6,18],
                [3,21],[4,21],[5,21],[3,22],[4,22],[5,22],
                [2,23],[6,23],[1,25],[2,25],[6,25],[7,25],
                [3,35],[4,35],[3,36],[4,36],
            ],
            lwss: [[0,1],[0,4],[1,0],[2,0],[2,4],[3,0],[3,1],[3,2],[3,3]],
            'r-pentomino': [[0,1],[0,2],[1,0],[1,1],[2,1]],
        };

        // --- State ---
        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');
        canvas.width = COLS * CELL;
        canvas.height = ROWS * CELL;

        let grid = makeGrid();
        let running = true;
        let speed = 200;
        let generation = 0;
        let drawing = false;
        let drawValue = true;
        let timer = null;

        // --- Grid helpers ---
        function makeGrid() {
            return Array.from({length: ROWS}, () => new Uint8Array(COLS));
        }

        function randomize(density) {
            generation = 0;
            grid = Array.from({length: ROWS}, () =>
                Uint8Array.from({length: COLS}, () => Math.random() < (density || 0.3) ? 1 : 0)
            );
        }

        function clear() {
            generation = 0;
            grid = makeGrid();
        }

        function placePattern(name) {
            clear();
            const cells = PATTERNS[name];
            if (!cells) return;
            // Find bounding box and center it
            let maxR = 0, maxC = 0;
            cells.forEach(([r, c]) => { maxR = Math.max(maxR, r); maxC = Math.max(maxC, c); });
            const offR = Math.floor((ROWS - maxR) / 2);
            const offC = Math.floor((COLS - maxC) / 2);
            cells.forEach(([r, c]) => {
                const nr = r + offR, nc = c + offC;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS)
                    grid[nr][nc] = 1;
            });
        }

        // --- Simulation ---
        function step() {
            const next = makeGrid();
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let n = 0;
                    for (let dy = -1; dy <= 1; dy++)
                        for (let dx = -1; dx <= 1; dx++) {
                            if (!dy && !dx) continue;
                            n += grid[(y + dy + ROWS) % ROWS][(x + dx + COLS) % COLS];
                        }
                    next[y][x] = grid[y][x] ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
                }
            }
            grid = next;
            generation++;
        }

        // --- Rendering ---
        function draw() {
            ctx.fillStyle = '#0f0f18';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid lines
            ctx.strokeStyle = '#151520';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL, 0);
                ctx.lineTo(x * CELL, ROWS * CELL);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL);
                ctx.lineTo(COLS * CELL, y * CELL);
                ctx.stroke();
            }

            // Cells
            ctx.fillStyle = '#6ee7b7';
            for (let y = 0; y < ROWS; y++)
                for (let x = 0; x < COLS; x++)
                    if (grid[y][x])
                        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);

            // Stats
            let pop = 0;
            for (let y = 0; y < ROWS; y++)
                for (let x = 0; x < COLS; x++) pop += grid[y][x];
            document.getElementById('stat-gen').textContent = generation;
            document.getElementById('stat-pop').textContent = pop;
        }

        // --- Loop ---
        function startLoop() {
            stopLoop();
            timer = setInterval(() => { step(); draw(); }, speed);
        }

        function stopLoop() {
            if (timer) { clearInterval(timer); timer = null; }
        }

        // --- Mouse drawing ---
        function cellAt(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX / CELL);
            const y = Math.floor((e.clientY - rect.top) * scaleY / CELL);
            return [y, x];
        }

        canvas.addEventListener('mousedown', (e) => {
            const [y, x] = cellAt(e);
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                drawValue = !grid[y][x];
                grid[y][x] = drawValue ? 1 : 0;
                drawing = true;
                draw();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const [y, x] = cellAt(e);
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                grid[y][x] = drawValue ? 1 : 0;
                draw();
            }
        });

        window.addEventListener('mouseup', () => { drawing = false; });

        // --- Touch drawing ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const [y, x] = cellAt(touch);
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                drawValue = !grid[y][x];
                grid[y][x] = drawValue ? 1 : 0;
                drawing = true;
                draw();
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!drawing) return;
            const touch = e.touches[0];
            const [y, x] = cellAt(touch);
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                grid[y][x] = drawValue ? 1 : 0;
                draw();
            }
        }, {passive: false});

        window.addEventListener('touchend', () => { drawing = false; });

        // --- Controls ---
        const btnPlay = document.getElementById('btn-play');
        btnPlay.addEventListener('click', () => {
            running = !running;
            btnPlay.innerHTML = running ? '&#9654; Play' : '&#9646;&#9646; Pause';
            btnPlay.classList.toggle('active', running);
            if (running) startLoop(); else stopLoop();
        });

        document.getElementById('btn-step').addEventListener('click', () => {
            if (running) { running = false; stopLoop(); btnPlay.innerHTML = '&#9646;&#9646; Pause'; btnPlay.classList.remove('active'); }
            step();
            draw();
        });

        document.getElementById('btn-clear').addEventListener('click', () => { clear(); draw(); });
        document.getElementById('btn-random').addEventListener('click', () => { randomize(); draw(); });

        document.getElementById('sel-pattern').addEventListener('change', function() {
            if (this.value) { placePattern(this.value); draw(); }
            this.value = '';
        });

        document.getElementById('sel-speed').addEventListener('change', function() {
            speed = parseInt(this.value);
            if (running) startLoop();
        });

        // --- Init ---
        randomize();
        draw();
        startLoop();
    })();
    </script>
</body>
</html>
