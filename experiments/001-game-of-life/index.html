<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Wave</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #020206;
            --text: #d0d0dd;
            --text-dim: #555568;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem;
            pointer-events: none;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            pointer-events: auto;
            transition: color 0.2s;
        }
        .back:hover { color: #aae8ff; }

        .instruction {
            color: rgba(180, 200, 220, 0.5);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-align: right;
            transition: opacity 0.5s;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="top-bar">
        <a href="../../" class="back">&larr; back to lab</a>
        <div class="instruction">Click &amp; drag to paint light trails. Defeat The Evil.</div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // --- Trail lifecycle constants ---
        const PHASE_GROW  = 0, PHASE_GLEAM = 1, PHASE_FLOW = 2, PHASE_FADE = 3;
        const GROW_DUR  = 400;
        const GLEAM_DUR = 600;
        const FLOW_DUR  = 1200;
        const FADE_DUR  = 400;
        const TOTAL_DUR = GROW_DUR + GLEAM_DUR + FLOW_DUR + FADE_DUR;
        const MAX_TRAIL = 300;

        // --- Data ---
        const trail = [];
        const evilBlobs = [];
        const sparks = [];

        // --- Mouse ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let prevMouseX = 0, prevMouseY = 0;
        let mouseVX = 0, mouseVY = 0;
        let emitTimer = 0;

        // --- Ease-out helper ---
        function easeOut(t) { return 1 - (1 - t) * (1 - t); }

        // --- Emit trail point ---
        function emitTrailPoint(x, y, vx, vy) {
            const speed = Math.sqrt(vx * vx + vy * vy);
            // Perpendicular flow direction (normalized)
            let nx, ny;
            if (speed > 0.5) {
                nx = -vy / speed;
                ny = vx / speed;
            } else {
                const a = Math.random() * Math.PI * 2;
                nx = Math.cos(a);
                ny = Math.sin(a);
            }
            // Randomize flow side
            if (Math.random() < 0.5) { nx = -nx; ny = -ny; }

            const hue = Math.random() < 0.35 ? 45 + Math.random() * 15 :
                        Math.random() < 0.5  ? 185 + Math.random() * 25 :
                        55 + Math.random() * 15;

            trail.push({
                x, y,
                originX: x, originY: y,
                nx, ny,
                age: 0,
                hue,
                sat: 50 + Math.random() * 30,
                lit: 70 + Math.random() * 20,
                radius: 1,
                brightness: 0.1,
                phase: PHASE_GROW,
                sineOffset: Math.random() * Math.PI * 2,
                flowSpeed: 0.8 + Math.random() * 0.6,
                damageRadius: 6,
            });

            if (trail.length > MAX_TRAIL) trail.splice(0, trail.length - MAX_TRAIL);
        }

        // --- Update single trail point ---
        function updateTrailPoint(p, dt) {
            p.age += dt;

            if (p.age < GROW_DUR) {
                // GROW phase
                p.phase = PHASE_GROW;
                const t = p.age / GROW_DUR;
                p.radius = 1 + 5 * easeOut(t);
                p.brightness = 0.1 + 0.7 * easeOut(t);
            } else if (p.age < GROW_DUR + GLEAM_DUR) {
                // GLEAM phase
                p.phase = PHASE_GLEAM;
                const t = (p.age - GROW_DUR) / GLEAM_DUR;
                p.radius = 6 + Math.sin(p.age * 0.015 + p.sineOffset) * 0.6;
                p.brightness = 0.85 + 0.15 * Math.sin(p.age * 0.012 + p.sineOffset);
            } else if (p.age < GROW_DUR + GLEAM_DUR + FLOW_DUR) {
                // FLOW phase — drift perpendicular with sine undulation
                p.phase = PHASE_FLOW;
                const t = (p.age - GROW_DUR - GLEAM_DUR) / FLOW_DUR;
                const drift = t * 40 * p.flowSpeed;
                const sine = Math.sin(t * Math.PI * 3 + p.sineOffset) * 12;
                p.x = p.originX + p.nx * drift + p.ny * sine;
                p.y = p.originY + p.ny * drift - p.nx * sine;
                p.radius = 6 + t * 2;
                p.brightness = 1.0 - t * 0.7;
            } else if (p.age < TOTAL_DUR) {
                // FADE phase
                p.phase = PHASE_FADE;
                const t = (p.age - GROW_DUR - GLEAM_DUR - FLOW_DUR) / FADE_DUR;
                // Decelerate drift
                const prevDrift = 40 * p.flowSpeed;
                const drift = prevDrift + (1 - t) * 5;
                const sine = Math.sin(Math.PI * 3 + p.sineOffset + t * 0.5) * 12 * (1 - t);
                p.x = p.originX + p.nx * drift + p.ny * sine;
                p.y = p.originY + p.ny * drift - p.nx * sine;
                p.radius = 8;
                p.brightness = 0.3 * (1 - t);
            } else {
                p.brightness = 0;
            }
        }

        // --- Catmull-Rom spline helper ---
        function catmullRom(p0, p1, p2, p3, t) {
            const t2 = t * t, t3 = t2 * t;
            return 0.5 * (
                (2 * p1) +
                (-p0 + p2) * t +
                (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
                (-p0 + 3 * p1 - 3 * p2 + p3) * t3
            );
        }

        // --- Evil blob ---
        function spawnEvil() {
            const type = Math.floor(Math.random() * 3);
            const colors = [
                { h: 0, s: 70, l: 25 },
                { h: 95, s: 55, l: 22 },
                { h: 50, s: 65, l: 30 },
            ];
            const col = colors[type];

            let x, y, vx, vy;
            const edge = Math.floor(Math.random() * 4);
            const speed = 0.15 + Math.random() * 0.35;
            if (edge === 0)      { x = -20; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * speed; }
            else if (edge === 1) { x = W + 20; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * speed; }
            else if (edge === 2) { x = Math.random() * W; y = -20; vx = (Math.random() - 0.5) * speed; vy = speed; }
            else                 { x = Math.random() * W; y = H + 20; vx = (Math.random() - 0.5) * speed; vy = -speed; }

            const cells = [];
            const clusterSize = 8 + Math.floor(Math.random() * 12);
            for (let i = 0; i < clusterSize; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 25;
                cells.push({
                    ox: Math.cos(angle) * dist,
                    oy: Math.sin(angle) * dist,
                    radius: 2.5 + Math.random() * 3.5,
                    phase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.03,
                    alive: true,
                });
            }

            evilBlobs.push({
                x, y, vx, vy,
                h: col.h, s: col.s, l: col.l,
                cells,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.005 + Math.random() * 0.01,
            });
        }

        // --- Sparks ---
        function burstSparks(x, y, h, s, l, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 1 + Math.random() * 4;
                const mixLight = Math.random() > 0.4;
                sparks.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    radius: 1 + Math.random() * 2.5,
                    h: mixLight ? 45 + Math.random() * 20 : h,
                    s: mixLight ? 80 : s,
                    l: mixLight ? 85 : l + 30,
                });
            }
        }

        // --- Collision: trail points vs evil cells ---
        function checkCollisions() {
            for (let bi = evilBlobs.length - 1; bi >= 0; bi--) {
                const blob = evilBlobs[bi];

                for (let ci = blob.cells.length - 1; ci >= 0; ci--) {
                    const cell = blob.cells[ci];
                    if (!cell.alive) continue;

                    const cx = blob.x + cell.ox;
                    const cy = blob.y + cell.oy;

                    for (let ti = trail.length - 1; ti >= 0; ti--) {
                        const tp = trail[ti];
                        if (tp.brightness < 0.5) continue;

                        const dx = cx - tp.x;
                        const dy = cy - tp.y;
                        const distSq = dx * dx + dy * dy;
                        const hitDist = tp.damageRadius + cell.radius;

                        if (distSq < hitDist * hitDist) {
                            cell.alive = false;
                            tp.brightness = Math.max(tp.brightness - 0.15, 0);
                            burstSparks(cx, cy, blob.h, blob.s, blob.l, 6);
                            break;
                        }
                    }
                }

                let anyAlive = false;
                for (const c of blob.cells) { if (c.alive) { anyAlive = true; break; } }
                if (!anyAlive) {
                    burstSparks(blob.x, blob.y, blob.h, blob.s, blob.l, 25);
                    evilBlobs.splice(bi, 1);
                }
            }
        }

        // --- Stampede state machine ---
        const CALM_DUR = 10000;
        const STAMPEDE_DUR = 800;
        const STRAGGLER_INTERVAL = 4000;
        const STAMPEDE_COUNT_MIN = 15;
        const STAMPEDE_COUNT_MAX = 25;

        let spawnState = 'calm';
        let spawnClock = 0;
        let stragglerTimer = 0;
        let stampedeCount = 0;
        let stampedeSpawned = 0;
        let stampedeInterval = 0;
        let stampedeSubTimer = 0;

        function updateSpawner(dt) {
            spawnClock += dt;

            if (spawnState === 'calm') {
                // Straggler spawns
                stragglerTimer += dt;
                if (stragglerTimer > STRAGGLER_INTERVAL && evilBlobs.length < 3) {
                    spawnEvil();
                    stragglerTimer = 0;
                }

                if (spawnClock > CALM_DUR) {
                    spawnState = 'stampede';
                    spawnClock = 0;
                    stampedeCount = STAMPEDE_COUNT_MIN + Math.floor(Math.random() * (STAMPEDE_COUNT_MAX - STAMPEDE_COUNT_MIN + 1));
                    stampedeSpawned = 0;
                    stampedeInterval = STAMPEDE_DUR / stampedeCount;
                    stampedeSubTimer = 0;
                }
            } else if (spawnState === 'stampede') {
                stampedeSubTimer += dt;
                while (stampedeSubTimer >= stampedeInterval && stampedeSpawned < stampedeCount) {
                    spawnEvil();
                    stampedeSpawned++;
                    stampedeSubTimer -= stampedeInterval;
                }

                if (stampedeSpawned >= stampedeCount) {
                    spawnState = 'calm';
                    spawnClock = 0;
                    stragglerTimer = 0;
                }
            }
        }

        // --- Update ---
        let lastTime = 0;

        function update(dt) {
            // Emit trail while mouse is down
            if (mouseDown) {
                emitTimer += dt;
                if (emitTimer > 25) {
                    emitTrailPoint(mouseX, mouseY, mouseVX, mouseVY);
                    emitTimer = 0;
                }
            }

            // Update trail points
            for (let i = trail.length - 1; i >= 0; i--) {
                updateTrailPoint(trail[i], dt);
                if (trail[i].brightness <= 0 && trail[i].age >= TOTAL_DUR) {
                    trail.splice(i, 1);
                }
            }

            // Stampede spawner
            updateSpawner(dt);

            // Update evil blobs
            for (let i = evilBlobs.length - 1; i >= 0; i--) {
                const blob = evilBlobs[i];
                blob.wobblePhase += blob.wobbleSpeed * dt;
                blob.x += blob.vx * dt * 0.06;
                blob.y += blob.vy * dt * 0.06;

                const toCenterX = W / 2 - blob.x;
                const toCenterY = H / 2 - blob.y;
                const toCenterDist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
                if (toCenterDist > 50) {
                    blob.vx += (toCenterX / toCenterDist) * 0.002 * dt;
                    blob.vy += (toCenterY / toCenterDist) * 0.002 * dt;
                }

                const spd = Math.sqrt(blob.vx * blob.vx + blob.vy * blob.vy);
                if (spd > 0.8) {
                    blob.vx = (blob.vx / spd) * 0.8;
                    blob.vy = (blob.vy / spd) * 0.8;
                }

                for (const cell of blob.cells) {
                    if (cell.alive) cell.phase += cell.pulseSpeed * dt;
                }

                if (blob.x < -200 || blob.x > W + 200 || blob.y < -200 || blob.y > H + 200) {
                    evilBlobs.splice(i, 1);
                }
            }

            // Update sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy;
                s.vx *= 0.96; s.vy *= 0.96;
                s.life -= s.decay;
                if (s.life <= 0) sparks.splice(i, 1);
            }

            checkCollisions();
        }

        // --- Render ---
        function render() {
            ctx.fillStyle = 'rgba(2, 2, 6, 0.12)';
            ctx.fillRect(0, 0, W, H);

            // --- Draw evil blobs ---
            for (const blob of evilBlobs) {
                for (const cell of blob.cells) {
                    if (!cell.alive) continue;
                    const pulse = 0.6 + 0.4 * Math.sin(cell.phase);
                    const cx = blob.x + cell.ox + Math.sin(blob.wobblePhase + cell.phase) * 3;
                    const cy = blob.y + cell.oy + Math.cos(blob.wobblePhase + cell.phase * 0.7) * 3;
                    const r = cell.radius * (0.8 + 0.3 * pulse);

                    const glowR = r * 3.5;
                    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
                    glow.addColorStop(0, `hsla(${blob.h}, ${blob.s}%, ${blob.l + 15}%, ${0.15 * pulse})`);
                    glow.addColorStop(1, `hsla(${blob.h}, ${blob.s}%, ${blob.l}%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${blob.h}, ${blob.s}%, ${blob.l + 10 * pulse}%, ${0.7 + 0.3 * pulse})`;
                    ctx.fill();
                }
            }

            // --- Separate trail points by phase ---
            const connected = []; // GROW + GLEAM — rendered as connected spline
            const flowing = [];   // FLOW + FADE — rendered as individual dots

            for (const p of trail) {
                if (p.brightness <= 0) continue;
                if (p.phase === PHASE_GROW || p.phase === PHASE_GLEAM) {
                    connected.push(p);
                } else {
                    flowing.push(p);
                }
            }

            // --- Draw connected trail (catmull-rom spline, 3 layered passes) ---
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (connected.length > 1) {
                const saved = ctx.globalCompositeOperation;
                ctx.globalCompositeOperation = 'lighter';

                // 3 passes: wide faint glow, mid glow, bright core
                const passes = [
                    { widthMul: 14, alphaMul: 0.08 },
                    { widthMul: 6,  alphaMul: 0.2 },
                    { widthMul: 2,  alphaMul: 0.7 },
                ];

                for (const pass of passes) {
                    ctx.beginPath();
                    for (let i = 0; i < connected.length; i++) {
                        const p0 = connected[Math.max(i - 1, 0)];
                        const p1 = connected[i];
                        const p2 = connected[Math.min(i + 1, connected.length - 1)];
                        const p3 = connected[Math.min(i + 2, connected.length - 1)];

                        if (i === 0) {
                            ctx.moveTo(p1.x, p1.y);
                        } else {
                            const steps = 4;
                            for (let s = 1; s <= steps; s++) {
                                const t = s / steps;
                                const sx = catmullRom(p0.x, p1.x, p2.x, p3.x, t);
                                const sy = catmullRom(p0.y, p1.y, p2.y, p3.y, t);
                                ctx.lineTo(sx, sy);
                            }
                        }
                    }

                    const avg = connected.reduce((s, p) => s + p.brightness, 0) / connected.length;
                    const avgHue = connected[Math.floor(connected.length / 2)].hue;
                    const avgSat = connected[Math.floor(connected.length / 2)].sat;
                    const avgLit = connected[Math.floor(connected.length / 2)].lit;

                    ctx.strokeStyle = `hsla(${avgHue}, ${avgSat}%, ${Math.min(avgLit + 10, 97)}%, ${avg * pass.alphaMul})`;
                    ctx.lineWidth = pass.widthMul * Math.max(avg, 0.3);
                    ctx.stroke();
                }

                ctx.globalCompositeOperation = saved;
            }

            // --- Draw GLEAM halos (per-point radial gradient) ---
            for (const p of connected) {
                if (p.phase !== PHASE_GLEAM) continue;
                const r = p.radius * 3;
                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
                g.addColorStop(0, `hsla(0, 0%, 100%, ${p.brightness * 0.5})`);
                g.addColorStop(0.3, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, ${p.brightness * 0.2})`);
                g.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, 0)`);
                ctx.fillStyle = g;
                ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
            }

            // --- Draw flowing/fading points (individual glowing dots) ---
            for (const p of flowing) {
                const r = p.radius;
                const gr = r * 3;
                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
                g.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${Math.min(p.lit + 15, 97)}%, ${p.brightness * 0.6})`);
                g.addColorStop(0.4, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, ${p.brightness * 0.2})`);
                g.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, 0)`);
                ctx.fillStyle = g;
                ctx.fillRect(p.x - gr, p.y - gr, gr * 2, gr * 2);

                ctx.beginPath();
                ctx.arc(p.x, p.y, r * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, ${p.sat - 10}%, ${Math.min(p.lit + 20, 97)}%, ${p.brightness * 0.8})`;
                ctx.fill();
            }

            // --- Draw sparks ---
            for (const s of sparks) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * s.life, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${s.h}, ${s.s}%, ${s.l}%, ${s.life})`;
                ctx.fill();
            }
        }

        // --- Main loop ---
        function loop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 50);
            lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // --- Mouse events ---
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX; mouseY = e.clientY;
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseVX = 0; mouseVY = 0;
        });

        canvas.addEventListener('mousemove', (e) => {
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseX = e.clientX; mouseY = e.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        });

        window.addEventListener('mouseup', () => { mouseDown = false; });

        // --- Touch events ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            const t = e.touches[0];
            mouseX = t.clientX; mouseY = t.clientY;
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseVX = 0; mouseVY = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseX = t.clientX; mouseY = t.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        }, { passive: false });

        window.addEventListener('touchend', () => { mouseDown = false; });

        // --- Init ---
        ctx.fillStyle = '#020206';
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 3; i++) spawnEvil();

        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
