<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Wave</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #020206;
            --text: #d0d0dd;
            --text-dim: #555568;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem;
            pointer-events: none;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            pointer-events: auto;
            transition: color 0.2s;
        }
        .back:hover { color: #aae8ff; }

        .instruction {
            color: rgba(180, 200, 220, 0.5);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-align: right;
            transition: opacity 0.5s;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="top-bar">
        <a href="../../" class="back">&larr; back to lab</a>
        <div class="instruction">Create waves of light to defeat The Evil.</div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // --- Data ---
        const trailPts = [];       // light wave trail points
        const evilBlobs = [];
        const sparks = [];
        const edgeFlashes = [];    // surge edge glow effects

        // --- Mouse ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let prevMouseX = 0, prevMouseY = 0;
        let mouseVX = 0, mouseVY = 0;
        let emitTimer = 0;
        let strokeId = 0;          // increments per drag stroke

        // --- Add a trail point while dragging ---
        function addTrailPoint(x, y, vx, vy) {
            const speed = Math.sqrt(vx * vx + vy * vy);
            if (speed < 0.5) return;

            const hue = Math.random() < 0.35 ? 45 + Math.random() * 15 :
                        Math.random() < 0.5  ? 185 + Math.random() * 25 :
                        55 + Math.random() * 15;

            trailPts.push({
                x, y,
                vx: vx * 0.12,     // drift direction (scaled down for smooth motion)
                vy: vy * 0.12,
                hue,
                sat: 55 + Math.random() * 30,
                lit: 75 + Math.random() * 20,
                life: 1.0,
                decay: 0.004 + Math.random() * 0.002,
                thickness: 2.5,     // starts thin at cursor
                released: false,
                age: 0,
                stroke: strokeId,
            });
        }

        // Release all unreleased trail points (on mouseup or auto-shed)
        function releaseTrail() {
            for (const pt of trailPts) {
                if (!pt.released) pt.released = true;
            }
        }

        // Auto-shed: release points older than threshold while still dragging
        const AUTO_SHED_AGE = 18; // frames (~300ms at 60fps)

        // --- Evil blob ---
        function spawnEvil(overrideX, overrideY, overrideVX, overrideVY, overrideCol, large) {
            const type = overrideCol !== undefined ? overrideCol : Math.floor(Math.random() * 3);
            const colors = [
                { h: 0, s: 70, l: 25 },
                { h: 95, s: 55, l: 22 },
                { h: 50, s: 65, l: 30 },
            ];
            const col = colors[type];

            let x, y, vx, vy;
            if (overrideX !== undefined) {
                x = overrideX; y = overrideY; vx = overrideVX; vy = overrideVY;
            } else {
                const edge = Math.floor(Math.random() * 4);
                const speed = 0.15 + Math.random() * 0.35;
                if (edge === 0)      { x = -20; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * speed; }
                else if (edge === 1) { x = W + 20; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * speed; }
                else if (edge === 2) { x = Math.random() * W; y = -20; vx = (Math.random() - 0.5) * speed; vy = speed; }
                else                 { x = Math.random() * W; y = H + 20; vx = (Math.random() - 0.5) * speed; vy = -speed; }
            }

            const cells = [];
            const clusterSize = large ? (15 + Math.floor(Math.random() * 10)) : (8 + Math.floor(Math.random() * 12));
            const spread = large ? 40 : 25;
            for (let i = 0; i < clusterSize; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * spread;
                cells.push({
                    ox: Math.cos(angle) * dist,
                    oy: Math.sin(angle) * dist,
                    radius: large ? (3 + Math.random() * 4.5) : (2.5 + Math.random() * 3.5),
                    phase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.03,
                    alive: true,
                });
            }

            evilBlobs.push({
                x, y, vx, vy,
                h: col.h, s: col.s, l: col.l,
                cells,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.005 + Math.random() * 0.01,
            });
        }

        // --- Evil surge ---
        function spawnEvilSurge() {
            const colorType = Math.floor(Math.random() * 3);
            const colors = [
                { h: 0, s: 70, l: 25 },
                { h: 95, s: 55, l: 22 },
                { h: 50, s: 65, l: 30 },
            ];
            const col = colors[colorType];

            // Pick 1-2 edges
            const allEdges = [0, 1, 2, 3];
            const numEdges = Math.random() < 0.4 ? 2 : 1;
            const edges = [];
            for (let i = 0; i < numEdges; i++) {
                const pick = Math.floor(Math.random() * allEdges.length);
                edges.push(allEdges.splice(pick, 1)[0]);
            }

            for (const edge of edges) {
                const blobCount = 6 + Math.floor(Math.random() * 5);
                const speed = 0.25 + Math.random() * 0.3;

                // Edge flash
                edgeFlashes.push({ edge, h: col.h, s: col.s, l: col.l, life: 1.0 });

                for (let i = 0; i < blobCount; i++) {
                    let x, y, vx, vy;
                    const spread = Math.random();

                    if (edge === 0) {       // left
                        x = -15 - Math.random() * 30;
                        y = spread * H;
                        vx = speed; vy = (Math.random() - 0.5) * speed * 0.5;
                    } else if (edge === 1) { // right
                        x = W + 15 + Math.random() * 30;
                        y = spread * H;
                        vx = -speed; vy = (Math.random() - 0.5) * speed * 0.5;
                    } else if (edge === 2) { // top
                        x = spread * W;
                        y = -15 - Math.random() * 30;
                        vx = (Math.random() - 0.5) * speed * 0.5; vy = speed;
                    } else {                 // bottom
                        x = spread * W;
                        y = H + 15 + Math.random() * 30;
                        vx = (Math.random() - 0.5) * speed * 0.5; vy = -speed;
                    }

                    spawnEvil(x, y, vx, vy, colorType, true);
                }
            }
        }

        // --- Sparks ---
        function burstSparks(x, y, h, s, l, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 1 + Math.random() * 4;
                const mixLight = Math.random() > 0.4;
                sparks.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    radius: 1 + Math.random() * 2.5,
                    h: mixLight ? 45 + Math.random() * 20 : h,
                    s: mixLight ? 80 : s,
                    l: mixLight ? 85 : l + 30,
                });
            }
        }

        // --- Collision: trail segments vs evil cells ---
        function pointToSegDist(px, py, ax, ay, bx, by) {
            const dx = bx - ax, dy = by - ay;
            const len2 = dx * dx + dy * dy;
            if (len2 < 0.01) return Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay));
            let t = ((px - ax) * dx + (py - ay) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const projX = ax + t * dx, projY = ay + t * dy;
            return Math.sqrt((px - projX) * (px - projX) + (py - projY) * (py - projY));
        }

        function checkCollisions() {
            for (let bi = evilBlobs.length - 1; bi >= 0; bi--) {
                const blob = evilBlobs[bi];

                for (let ci = blob.cells.length - 1; ci >= 0; ci--) {
                    const cell = blob.cells[ci];
                    if (!cell.alive) continue;

                    const cx = blob.x + cell.ox;
                    const cy = blob.y + cell.oy;
                    let killed = false;

                    // Check against released trail segments
                    for (let ti = 1; ti < trailPts.length; ti++) {
                        const a = trailPts[ti - 1];
                        const b = trailPts[ti];
                        if (!a.released || !b.released) continue;
                        if (a.stroke !== b.stroke) continue; // don't connect across strokes

                        const avgThickness = (a.thickness + b.thickness) / 2;
                        const hitDist = avgThickness * 0.7 + cell.radius;
                        const dist = pointToSegDist(cx, cy, a.x, a.y, b.x, b.y);

                        if (dist < hitDist) {
                            cell.alive = false;
                            burstSparks(cx, cy, blob.h, blob.s, blob.l, 6);
                            // Consume some wave energy
                            a.life -= 0.03;
                            b.life -= 0.03;
                            killed = true;
                            break;
                        }
                    }
                }

                // Remove blob if all cells dead
                let anyAlive = false;
                for (const c of blob.cells) { if (c.alive) { anyAlive = true; break; } }
                if (!anyAlive) {
                    burstSparks(blob.x, blob.y, blob.h, blob.s, blob.l, 25);
                    evilBlobs.splice(bi, 1);
                }
            }
        }

        // --- Update ---
        let lastTime = 0;
        let evilSpawnTimer = 0;
        let evilSurgeTimer = 0;
        const EVIL_SPAWN_INTERVAL = 2500;
        const EVIL_SURGE_INTERVAL = 13000;

        function update(dt) {
            // Emit trail points while mouse is down
            if (mouseDown) {
                emitTimer += dt;
                if (emitTimer > 20) {
                    addTrailPoint(mouseX, mouseY, mouseVX, mouseVY);
                    emitTimer = 0;
                }
            }

            // Update trail points
            for (let i = trailPts.length - 1; i >= 0; i--) {
                const pt = trailPts[i];
                pt.age++;

                // Auto-shed: release old points even while still dragging
                if (!pt.released && pt.age > AUTO_SHED_AGE) {
                    pt.released = true;
                }

                if (pt.released) {
                    // Drift outward in recorded direction
                    pt.x += pt.vx;
                    pt.y += pt.vy;

                    // Grow thickness as it expands outward
                    pt.thickness += 0.25;

                    // Slight deceleration
                    pt.vx *= 0.995;
                    pt.vy *= 0.995;

                    // Fade
                    pt.life -= pt.decay;

                    // Brightness peaks then fades — handled in render via life
                }

                if (pt.life <= 0 || pt.x < -100 || pt.x > W + 100 || pt.y < -100 || pt.y > H + 100) {
                    trailPts.splice(i, 1);
                }
            }

            // Spawn evil
            evilSpawnTimer += dt;
            if (evilSpawnTimer > EVIL_SPAWN_INTERVAL) {
                spawnEvil();
                evilSpawnTimer = 0;
            }

            // Evil surge
            evilSurgeTimer += dt;
            if (evilSurgeTimer > EVIL_SURGE_INTERVAL) {
                spawnEvilSurge();
                evilSurgeTimer = 0;
            }

            // Update evil blobs
            for (let i = evilBlobs.length - 1; i >= 0; i--) {
                const blob = evilBlobs[i];
                blob.wobblePhase += blob.wobbleSpeed * dt;
                blob.x += blob.vx * dt * 0.06;
                blob.y += blob.vy * dt * 0.06;

                const toCenterX = W / 2 - blob.x;
                const toCenterY = H / 2 - blob.y;
                const toCenterDist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
                if (toCenterDist > 50) {
                    blob.vx += (toCenterX / toCenterDist) * 0.002 * dt;
                    blob.vy += (toCenterY / toCenterDist) * 0.002 * dt;
                }

                const spd = Math.sqrt(blob.vx * blob.vx + blob.vy * blob.vy);
                if (spd > 0.8) {
                    blob.vx = (blob.vx / spd) * 0.8;
                    blob.vy = (blob.vy / spd) * 0.8;
                }

                for (const cell of blob.cells) {
                    if (cell.alive) cell.phase += cell.pulseSpeed * dt;
                }

                if (blob.x < -200 || blob.x > W + 200 || blob.y < -200 || blob.y > H + 200) {
                    evilBlobs.splice(i, 1);
                }
            }

            // Update sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy;
                s.vx *= 0.96; s.vy *= 0.96;
                s.life -= s.decay;
                if (s.life <= 0) sparks.splice(i, 1);
            }

            // Update edge flashes
            for (let i = edgeFlashes.length - 1; i >= 0; i--) {
                edgeFlashes[i].life -= 0.025;
                if (edgeFlashes[i].life <= 0) edgeFlashes.splice(i, 1);
            }

            checkCollisions();
        }

        // --- Render ---
        function render() {
            // Fade for trails
            ctx.fillStyle = 'rgba(2, 2, 6, 0.1)';
            ctx.fillRect(0, 0, W, H);

            // --- Draw edge flashes (surge warning) ---
            for (const f of edgeFlashes) {
                const alpha = f.life * 0.4;
                const grad_size = 80 * f.life;
                let grad;
                if (f.edge === 0) {       // left
                    grad = ctx.createLinearGradient(0, 0, grad_size, 0);
                    grad.addColorStop(0, `hsla(${f.h}, ${f.s}%, ${f.l + 20}%, ${alpha})`);
                    grad.addColorStop(1, `hsla(${f.h}, ${f.s}%, ${f.l}%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, grad_size, H);
                } else if (f.edge === 1) { // right
                    grad = ctx.createLinearGradient(W, 0, W - grad_size, 0);
                    grad.addColorStop(0, `hsla(${f.h}, ${f.s}%, ${f.l + 20}%, ${alpha})`);
                    grad.addColorStop(1, `hsla(${f.h}, ${f.s}%, ${f.l}%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(W - grad_size, 0, grad_size, H);
                } else if (f.edge === 2) { // top
                    grad = ctx.createLinearGradient(0, 0, 0, grad_size);
                    grad.addColorStop(0, `hsla(${f.h}, ${f.s}%, ${f.l + 20}%, ${alpha})`);
                    grad.addColorStop(1, `hsla(${f.h}, ${f.s}%, ${f.l}%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, grad_size);
                } else {                   // bottom
                    grad = ctx.createLinearGradient(0, H, 0, H - grad_size);
                    grad.addColorStop(0, `hsla(${f.h}, ${f.s}%, ${f.l + 20}%, ${alpha})`);
                    grad.addColorStop(1, `hsla(${f.h}, ${f.s}%, ${f.l}%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, H - grad_size, W, grad_size);
                }
            }

            // --- Draw evil blobs ---
            for (const blob of evilBlobs) {
                for (const cell of blob.cells) {
                    if (!cell.alive) continue;
                    const pulse = 0.6 + 0.4 * Math.sin(cell.phase);
                    const cx = blob.x + cell.ox + Math.sin(blob.wobblePhase + cell.phase) * 3;
                    const cy = blob.y + cell.oy + Math.cos(blob.wobblePhase + cell.phase * 0.7) * 3;
                    const r = cell.radius * (0.8 + 0.3 * pulse);

                    const glowR = r * 3.5;
                    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
                    glow.addColorStop(0, `hsla(${blob.h}, ${blob.s}%, ${blob.l + 15}%, ${0.15 * pulse})`);
                    glow.addColorStop(1, `hsla(${blob.h}, ${blob.s}%, ${blob.l}%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${blob.h}, ${blob.s}%, ${blob.l + 10 * pulse}%, ${0.7 + 0.3 * pulse})`;
                    ctx.fill();
                }
            }

            // --- Draw light trail / waves ---
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let i = 1; i < trailPts.length; i++) {
                const a = trailPts[i - 1];
                const b = trailPts[i];

                // Don't connect across different strokes
                if (a.stroke !== b.stroke) continue;

                const alpha = Math.min(a.life, b.life);
                if (alpha <= 0) continue;

                const avgThick = (a.thickness + b.thickness) / 2;

                // Brightness curve: released waves glow brighter initially then fade
                const brightnessBoost = (a.released && a.age < AUTO_SHED_AGE + 30) ?
                    Math.min((a.age - AUTO_SHED_AGE) / 15, 1) * 0.3 : 0;

                // Outer glow (wide, soft)
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `hsla(${b.hue}, ${b.sat}%, ${b.lit}%, ${alpha * (0.1 + brightnessBoost * 0.15)})`;
                ctx.lineWidth = avgThick * 4;
                ctx.stroke();

                // Mid glow
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `hsla(${b.hue}, ${b.sat}%, ${b.lit}%, ${alpha * (0.3 + brightnessBoost * 0.2)})`;
                ctx.lineWidth = avgThick * 1.8;
                ctx.stroke();

                // Bright core
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `hsla(${b.hue}, ${b.sat - 15}%, ${Math.min(b.lit + 15, 97)}%, ${alpha * (0.7 + brightnessBoost)})`;
                ctx.lineWidth = avgThick * 0.6;
                ctx.stroke();

                // Hot white center for fresh released waves
                if (brightnessBoost > 0.1) {
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.strokeStyle = `hsla(${b.hue}, 20%, 95%, ${alpha * brightnessBoost * 0.8})`;
                    ctx.lineWidth = Math.max(avgThick * 0.2, 0.5);
                    ctx.stroke();
                }
            }

            // --- Draw sparks ---
            for (const s of sparks) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * s.life, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${s.h}, ${s.s}%, ${s.l}%, ${s.life})`;
                ctx.fill();
            }
        }

        // --- Main loop ---
        function loop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 50);
            lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // --- Mouse events ---
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            strokeId++;
            mouseX = e.clientX; mouseY = e.clientY;
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseVX = 0; mouseVY = 0;
        });

        canvas.addEventListener('mousemove', (e) => {
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseX = e.clientX; mouseY = e.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        });

        window.addEventListener('mouseup', () => {
            mouseDown = false;
            releaseTrail();
        });

        // --- Touch events ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            strokeId++;
            const t = e.touches[0];
            mouseX = t.clientX; mouseY = t.clientY;
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseVX = 0; mouseVY = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseX = t.clientX; mouseY = t.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        }, { passive: false });

        window.addEventListener('touchend', () => {
            mouseDown = false;
            releaseTrail();
        });

        // --- Init ---
        ctx.fillStyle = '#020206';
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 3; i++) spawnEvil();

        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
