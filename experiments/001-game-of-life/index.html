<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>001 — Light Wave</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #010103;
            overflow: hidden;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        #glow {
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(5px);
            z-index: 1;
        }

        .back {
            position: fixed;
            top: 1rem;
            left: 1.2rem;
            z-index: 100;
            color: rgba(255, 255, 255, 0.15);
            text-decoration: none;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.7rem;
            transition: color 0.4s;
        }
        .back:hover { color: rgba(255, 255, 255, 0.6); }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: none;
            opacity: 1;
            transition: opacity 2s ease;
        }
        .overlay.hidden { opacity: 0; }

        .overlay h1 {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 200;
            letter-spacing: 0.4em;
            color: #fff;
            text-shadow:
                0 0 30px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 220, 140, 0.2),
                0 0 120px rgba(255, 180, 80, 0.1);
            margin-bottom: 1.2rem;
        }

        .overlay p {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.12em;
        }
    </style>
</head>
<body>
    <a href="../../" class="back">&larr; back</a>
    <canvas id="grid"></canvas>
    <canvas id="glow"></canvas>

    <div class="overlay" id="overlay">
        <h1>LIGHT WAVE</h1>
        <p>Draw light waves and eliminate virus waves.</p>
    </div>

    <script>
    (function () {
        /* ── Config ── */
        const CELL           = 6;
        const MAX_AGE        = 120;
        const FADE_FRAMES    = 15;
        const GLOW_RADIUS    = 18;
        const BRUSH_RADIUS   = 3;
        const SIM_INTERVAL   = 50;
        const CONVERT_LIGHT  = 2;   // light converts virus if virus has >= N light neighbors
        const CONVERT_VIRUS  = 4;   // virus converts light if light has >= N virus neighbors
        const MAX_PARTICLES  = 250;

        /* ── Palettes ── */
        // Light: white-hot → warm gold → ember
        const LIGHT_PAL = [
            [255, 255, 255],
            [255, 245, 210],
            [255, 215, 120],
            [255, 175, 55],
            [210, 115, 40],
        ];
        // Virus: bright red → deep crimson
        const VIRUS_PAL = [
            [255, 95, 95],
            [225, 50, 50],
            [185, 22, 22],
            [130, 12, 12],
            [75, 5, 5],
        ];
        const LIGHT_GHOST = [200, 160, 60];
        const VIRUS_GHOST = [110, 20, 20];

        /* ── Canvas setup ── */
        const canvas  = document.getElementById('grid');
        const ctx     = canvas.getContext('2d');
        const glow    = document.getElementById('glow');
        const glCtx   = glow.getContext('2d');

        let COLS, ROWS;
        let cellType, cellAge, ghostType;
        let lastStep    = 0;
        let steps       = 0;
        let vTick       = 0;      // cluster timer
        let wTick       = 0;      // wave timer
        let drawing     = false;
        let interacted  = false;
        let particles   = [];

        /* ── Overlay ── */
        const overlay = document.getElementById('overlay');
        setTimeout(() => overlay.classList.add('hidden'), 4500);
        function hideOverlay() {
            if (!interacted) { interacted = true; overlay.classList.add('hidden'); }
        }

        /* ── Grid helpers ── */
        function resize() {
            COLS = Math.floor(window.innerWidth / CELL);
            ROWS = Math.floor(window.innerHeight / CELL);
            canvas.width  = glow.width  = COLS * CELL;
            canvas.height = glow.height = ROWS * CELL;
        }

        function makeArrays() {
            const n   = ROWS * COLS;
            cellType  = new Uint8Array(n);
            cellAge   = new Int16Array(n);
            ghostType = new Uint8Array(n);
        }

        function I(y, x) { return y * COLS + x; }

        /* ── Color ── */
        function lerp(stops, t) {
            t = Math.max(0, Math.min(1, t));
            const s = t * (stops.length - 1);
            const i = Math.floor(s), f = s - i;
            const a = stops[Math.min(i, stops.length - 1)];
            const b = stops[Math.min(i + 1, stops.length - 1)];
            return [
                a[0] + (b[0] - a[0]) * f | 0,
                a[1] + (b[1] - a[1]) * f | 0,
                a[2] + (b[2] - a[2]) * f | 0,
            ];
        }

        function color(type, age) {
            return lerp(type === 1 ? LIGHT_PAL : VIRUS_PAL, Math.min(age / MAX_AGE, 1));
        }

        /* ── Virus spawning ── */
        function spawnCluster() {
            const edge = Math.random() * 4 | 0;
            let cy, cx;
            if (edge === 0)      { cy = 0;        cx = Math.random() * COLS | 0; }
            else if (edge === 1) { cy = ROWS - 1;  cx = Math.random() * COLS | 0; }
            else if (edge === 2) { cy = Math.random() * ROWS | 0; cx = 0; }
            else                 { cy = Math.random() * ROWS | 0; cx = COLS - 1; }
            const r = 2 + (Math.random() * 3 | 0);
            for (let dy = -r; dy <= r; dy++)
                for (let dx = -r; dx <= r; dx++) {
                    if (dy * dy + dx * dx > r * r) continue;
                    if (Math.random() > 0.6) continue;
                    const y = cy + dy, x = cx + dx;
                    if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                        const i = I(y, x);
                        if (cellType[i] === 0) { cellType[i] = 2; cellAge[i] = 1; }
                    }
                }
        }

        function spawnWave() {
            const edge  = Math.random() * 4 | 0;
            const thick = 2 + (Math.random() * 3 | 0);
            const dens  = 0.3 + Math.random() * 0.25;
            const len   = edge < 2 ? COLS : ROWS;
            for (let t = 0; t < thick; t++)
                for (let i = 0; i < len; i++) {
                    if (Math.random() > dens) continue;
                    let y, x;
                    if (edge === 0)      { y = t;            x = i; }
                    else if (edge === 1) { y = ROWS - 1 - t; x = i; }
                    else if (edge === 2) { y = i;            x = t; }
                    else                 { y = i;            x = COLS - 1 - t; }
                    if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                        const ii = I(y, x);
                        if (cellType[ii] === 0) { cellType[ii] = 2; cellAge[ii] = 1; }
                    }
                }
        }

        /* ── Particles ── */
        function addParticle(px, py) {
            if (particles.length >= MAX_PARTICLES) return;
            const a = Math.random() * Math.PI * 2;
            const v = 0.6 + Math.random() * 2.4;
            particles.push({
                x: px, y: py,
                vx: Math.cos(a) * v,
                vy: Math.sin(a) * v,
                life: 1,
                decay: 0.025 + Math.random() * 0.035,
            });
        }

        function tickParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.97; p.vy *= 0.97;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (const p of particles) {
                const a = p.life * 0.9;
                const s = p.life * 3;
                glCtx.fillStyle = `rgba(255,235,170,${a.toFixed(2)})`;
                glCtx.beginPath();
                glCtx.arc(p.x, p.y, s, 0, Math.PI * 2);
                glCtx.fill();
            }
        }

        /* ── Simulation ── */
        function step() {
            const n = ROWS * COLS;
            const nT = new Uint8Array(n);
            const nA = new Int16Array(n);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = I(y, x);
                    const t = cellType[i], a = cellAge[i];

                    // Neighbor counts
                    let nL = 0, nV = 0;
                    for (let dy = -1; dy <= 1; dy++)
                        for (let dx = -1; dx <= 1; dx++) {
                            if (!dy && !dx) continue;
                            const ni = I((y + dy + ROWS) % ROWS, (x + dx + COLS) % COLS);
                            if (cellType[ni] === 1 && cellAge[ni] > 0) nL++;
                            if (cellType[ni] === 2 && cellAge[ni] > 0) nV++;
                        }

                    if (t === 0 || a <= 0) {
                        // Empty / fading — birth?
                        const lB = nL === 3, vB = nV === 3;
                        if (lB && vB)       { nT[i] = 1; nA[i] = 1; }   // light wins ties
                        else if (lB)        { nT[i] = 1; nA[i] = 1; }
                        else if (vB)        { nT[i] = 2; nA[i] = 1; }
                        else                { nT[i] = 0; nA[i] = a < 0 ? a + 1 : 0; }
                    } else if (t === 1) {
                        // Light cell
                        if (nV >= CONVERT_VIRUS)             { nT[i] = 2; nA[i] = 1; }
                        else if (nL === 2 || nL === 3)       { nT[i] = 1; nA[i] = Math.min(a + 1, MAX_AGE); }
                        else                                 { nT[i] = 0; nA[i] = -FADE_FRAMES; }
                    } else {
                        // Virus cell
                        if (nL >= CONVERT_LIGHT) {
                            nT[i] = 1; nA[i] = 1;  // converted to light
                            if (Math.random() < 0.25) {
                                const px = x * CELL + CELL / 2;
                                const py = y * CELL + CELL / 2;
                                addParticle(px, py);
                                addParticle(px, py);
                            }
                        }
                        else if (nV === 2 || nV === 3)       { nT[i] = 2; nA[i] = Math.min(a + 1, MAX_AGE); }
                        else                                 { nT[i] = 0; nA[i] = -FADE_FRAMES; }
                    }
                }
            }

            // Ghost bookkeeping
            const prev = cellType;
            cellType = nT; cellAge = nA; steps++;
            for (let i = 0; i < n; i++) {
                if (cellType[i] === 0 && cellAge[i] < 0 && prev[i] > 0) ghostType[i] = prev[i];
                else if (cellAge[i] >= 0) ghostType[i] = 0;
            }

            // Virus auto-spawn — escalates gently over time
            vTick++; wTick++;
            const extra = Math.min(Math.floor(steps / 800), 3);   // 0-3 extra clusters

            if (vTick >= 40) {                                     // ~2 s
                for (let c = 0; c < 1 + extra; c++) spawnCluster();
                vTick = 0;
            }
            if (wTick >= 320) {                                    // ~16 s
                spawnWave();
                if (extra >= 2) spawnWave();                       // double wave later
                wTick = 0;
            }
        }

        /* ── Rendering ── */
        function draw() {
            // Background: subtle radial vignette
            const hw = canvas.width / 2, hh = canvas.height / 2;
            const bgGrad = ctx.createRadialGradient(hw, hh, 0, hw, hh, Math.max(hw, hh));
            bgGrad.addColorStop(0, '#06060e');
            bgGrad.addColorStop(1, '#010103');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            glCtx.clearRect(0, 0, glow.width, glow.height);

            const pulse = Math.sin(steps * 0.12) * 0.15 + 0.85;   // virus pulse

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = I(y, x);
                    const t = cellType[i], a = cellAge[i];

                    if (t > 0 && a > 0) {
                        const [r, g, b] = color(t, a);
                        const cx = x * CELL + CELL / 2;
                        const cy = y * CELL + CELL / 2;
                        const rad = CELL / 2 - 0.5;

                        // Cell body
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
                        ctx.fill();

                        // White-hot core on young light cells
                        if (t === 1 && a < MAX_AGE * 0.4) {
                            const ca = (1 - a / (MAX_AGE * 0.4)) * 0.85;
                            ctx.fillStyle = `rgba(255,255,255,${ca.toFixed(2)})`;
                            ctx.beginPath();
                            ctx.arc(cx, cy, rad * 0.4, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        // Glow
                        const bright = Math.max(0.12, 1 - a / MAX_AGE);
                        const gR     = t === 1 ? GLOW_RADIUS * 1.5 : GLOW_RADIUS;
                        const gA     = t === 1 ? 0.50 * bright : 0.30 * bright * pulse;
                        const grad   = glCtx.createRadialGradient(cx, cy, 0, cx, cy, gR);
                        grad.addColorStop(0, `rgba(${r},${g},${b},${gA.toFixed(2)})`);
                        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        glCtx.fillStyle = grad;
                        glCtx.fillRect(cx - gR, cy - gR, gR * 2, gR * 2);

                    } else if (a < 0) {
                        // Fading ghost
                        const alpha = (-a / FADE_FRAMES) * 0.45;
                        const [r, g, b] = ghostType[i] === 2 ? VIRUS_GHOST : LIGHT_GHOST;
                        const cx = x * CELL + CELL / 2;
                        const cy = y * CELL + CELL / 2;

                        ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL / 2 - 1, 0, Math.PI * 2);
                        ctx.fill();

                        // Subtle ghost glow
                        const gA  = alpha * 0.25;
                        const gR2 = GLOW_RADIUS * 0.6;
                        const gg  = glCtx.createRadialGradient(cx, cy, 0, cx, cy, gR2);
                        gg.addColorStop(0, `rgba(${r},${g},${b},${gA.toFixed(2)})`);
                        gg.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        glCtx.fillStyle = gg;
                        glCtx.fillRect(cx - gR2, cy - gR2, gR2 * 2, gR2 * 2);
                    }
                }
            }

            drawParticles();
        }

        /* ── Animation loop ── */
        function loop(ts) {
            if (ts - lastStep >= SIM_INTERVAL) {
                step();
                tickParticles();
                lastStep = ts;
            }
            draw();
            requestAnimationFrame(loop);
        }

        /* ── Drawing (mouse & touch) ── */
        function cellAt(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            return [
                (e.clientY - rect.top) * sy / CELL | 0,
                (e.clientX - rect.left) * sx / CELL | 0,
            ];
        }

        function paintBrush(cy, cx) {
            for (let dy = -BRUSH_RADIUS; dy <= BRUSH_RADIUS; dy++)
                for (let dx = -BRUSH_RADIUS; dx <= BRUSH_RADIUS; dx++) {
                    const d2 = dy * dy + dx * dx;
                    if (d2 > BRUSH_RADIUS * BRUSH_RADIUS) continue;
                    const d = Math.sqrt(d2);
                    if (d > 1 && Math.random() < (d / BRUSH_RADIUS) * 0.45) continue;
                    const y = cy + dy, x = cx + dx;
                    if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                        const i = I(y, x);
                        cellType[i] = 1;
                        cellAge[i] = 1;   // white-hot
                    }
                }
        }

        canvas.addEventListener('mousedown', (e) => {
            hideOverlay();
            const [y, x] = cellAt(e);
            paintBrush(y, x);
            drawing = true;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const [y, x] = cellAt(e);
            paintBrush(y, x);
        });
        window.addEventListener('mouseup', () => { drawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); hideOverlay();
            const [y, x] = cellAt(e.touches[0]);
            paintBrush(y, x);
            drawing = true;
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!drawing) return;
            const [y, x] = cellAt(e.touches[0]);
            paintBrush(y, x);
        }, { passive: false });
        window.addEventListener('touchend', () => { drawing = false; });

        /* ── Resize ── */
        window.addEventListener('resize', () => {
            const oT = cellType, oA = cellAge, oG = ghostType;
            const oC = COLS, oR = ROWS;
            resize(); makeArrays();
            const cr = Math.min(oR, ROWS), cc = Math.min(oC, COLS);
            for (let y = 0; y < cr; y++)
                for (let x = 0; x < cc; x++) {
                    const oi = y * oC + x, ni = I(y, x);
                    cellType[ni] = oT[oi]; cellAge[ni] = oA[oi]; ghostType[ni] = oG[oi];
                }
        });

        /* ── Boot ── */
        resize();
        makeArrays();
        // Seed a few virus clusters so there's something on screen immediately
        for (let c = 0; c < 8; c++) spawnCluster();
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
