<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Wave</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #020206;
            --text: #d0d0dd;
            --text-dim: #555568;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem;
            pointer-events: none;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            pointer-events: auto;
            transition: color 0.2s;
        }
        .back:hover { color: #aae8ff; }

        .instruction {
            color: rgba(180, 200, 220, 0.5);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-align: right;
            transition: opacity 0.5s;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="top-bar">
        <a href="../../" class="back">&larr; back to lab</a>
        <div class="instruction">Create waves of light to defeat The Evil.</div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        // --- Resize ---
        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // --- Particles ---
        const lightParticles = [];
        const evilBlobs = [];
        const sparks = [];

        // --- Mouse tracking ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let prevMouseX = 0, prevMouseY = 0;
        let mouseVX = 0, mouseVY = 0;
        let emitTimer = 0;

        // --- Light particle ---
        function emitLight(x, y, vx, vy) {
            const speed = Math.sqrt(vx * vx + vy * vy);
            if (speed < 0.5) return;

            // Normalize and scale - particles travel in mouse direction
            const scale = Math.min(speed * 0.35, 6);
            const nx = (vx / speed) * scale;
            const ny = (vy / speed) * scale;

            // Emit a small spread of particles for a wave feel
            const count = Math.min(Math.floor(speed * 0.3) + 1, 4);
            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(ny, nx) + (Math.random() - 0.5) * 0.6;
                const mag = scale * (0.7 + Math.random() * 0.6);
                const hue = Math.random() < 0.3 ? 45 + Math.random() * 15 : // warm gold
                            Math.random() < 0.5 ? 185 + Math.random() * 20 : // cyan
                            55 + Math.random() * 10; // pale yellow
                lightParticles.push({
                    x: x + (Math.random() - 0.5) * 4,
                    y: y + (Math.random() - 0.5) * 4,
                    vx: Math.cos(angle) * mag,
                    vy: Math.sin(angle) * mag,
                    life: 1.0,
                    decay: 0.003 + Math.random() * 0.004,
                    radius: 1.5 + Math.random() * 2,
                    hue: hue,
                    sat: 60 + Math.random() * 30,
                    lit: 75 + Math.random() * 20,
                });
            }
        }

        // --- Evil blob ---
        function spawnEvil() {
            // Pick type: 0 = dark red, 1 = sickly green, 2 = devious yellow
            const type = Math.floor(Math.random() * 3);
            const colors = [
                { h: 0, s: 70, l: 25, name: 'red' },       // dark red
                { h: 95, s: 55, l: 22, name: 'green' },     // sickly green
                { h: 50, s: 65, l: 30, name: 'yellow' },    // devious yellow
            ];
            const col = colors[type];

            // Spawn from edges
            let x, y, vx, vy;
            const edge = Math.floor(Math.random() * 4);
            const speed = 0.15 + Math.random() * 0.35;
            if (edge === 0) { x = -20; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * speed; }
            else if (edge === 1) { x = W + 20; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * speed; }
            else if (edge === 2) { x = Math.random() * W; y = -20; vx = (Math.random() - 0.5) * speed; vy = speed; }
            else { x = Math.random() * W; y = H + 20; vx = (Math.random() - 0.5) * speed; vy = -speed; }

            // Each blob is a cluster of cells
            const cells = [];
            const clusterSize = 8 + Math.floor(Math.random() * 12);
            for (let i = 0; i < clusterSize; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 25;
                cells.push({
                    ox: Math.cos(angle) * dist,
                    oy: Math.sin(angle) * dist,
                    radius: 2.5 + Math.random() * 3.5,
                    phase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.03,
                    alive: true,
                });
            }

            evilBlobs.push({
                x, y, vx, vy,
                h: col.h, s: col.s, l: col.l,
                cells,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.005 + Math.random() * 0.01,
                life: 1.0,
            });
        }

        // --- Spark burst (when evil dies) ---
        function burstSparks(x, y, h, s, l, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                // Mix evil color with light (white/gold)
                const mixLight = Math.random() > 0.4;
                sparks.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    radius: 1 + Math.random() * 2.5,
                    h: mixLight ? 45 + Math.random() * 20 : h,
                    s: mixLight ? 80 : s,
                    l: mixLight ? 85 : l + 30,
                });
            }
        }

        // --- Collision detection ---
        function checkCollisions() {
            for (let bi = evilBlobs.length - 1; bi >= 0; bi--) {
                const blob = evilBlobs[bi];
                if (blob.life <= 0) continue;

                for (let ci = blob.cells.length - 1; ci >= 0; ci--) {
                    const cell = blob.cells[ci];
                    if (!cell.alive) continue;

                    const cx = blob.x + cell.ox;
                    const cy = blob.y + cell.oy;
                    const cr = cell.radius * 1.5;

                    for (let li = lightParticles.length - 1; li >= 0; li--) {
                        const lp = lightParticles[li];
                        const dx = lp.x - cx;
                        const dy = lp.y - cy;
                        const dist = dx * dx + dy * dy;
                        const hitDist = (cr + lp.radius * 2);

                        if (dist < hitDist * hitDist) {
                            // Kill this evil cell
                            cell.alive = false;
                            // Small spark burst at cell location
                            burstSparks(cx, cy, blob.h, blob.s, blob.l, 5);
                            // Consume the light particle partially
                            lp.life -= 0.15;
                            break;
                        }
                    }
                }

                // Check if all cells dead
                const aliveCells = blob.cells.filter(c => c.alive);
                if (aliveCells.length === 0) {
                    // Big burst
                    burstSparks(blob.x, blob.y, blob.h, blob.s, blob.l, 20);
                    evilBlobs.splice(bi, 1);
                }
            }
        }

        // --- Update ---
        let lastTime = 0;
        let evilSpawnTimer = 0;
        const EVIL_SPAWN_INTERVAL = 2500; // ms between spawns
        let time = 0;

        function update(dt) {
            time += dt;

            // Emit light particles while mouse is down
            if (mouseDown) {
                emitTimer += dt;
                if (emitTimer > 16) { // ~60fps emission
                    emitLight(mouseX, mouseY, mouseVX, mouseVY);
                    emitTimer = 0;
                }
            }

            // Update light particles
            for (let i = lightParticles.length - 1; i >= 0; i--) {
                const p = lightParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                // Slight deceleration for graceful trails
                p.vx *= 0.998;
                p.vy *= 0.998;
                p.life -= p.decay;
                if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
                    lightParticles.splice(i, 1);
                }
            }

            // Spawn evil
            evilSpawnTimer += dt;
            if (evilSpawnTimer > EVIL_SPAWN_INTERVAL) {
                spawnEvil();
                evilSpawnTimer = 0;
            }

            // Update evil blobs
            for (let i = evilBlobs.length - 1; i >= 0; i--) {
                const blob = evilBlobs[i];
                blob.wobblePhase += blob.wobbleSpeed * dt;
                blob.x += blob.vx * dt * 0.06;
                blob.y += blob.vy * dt * 0.06;

                // Gentle drift toward center
                const toCenterX = W / 2 - blob.x;
                const toCenterY = H / 2 - blob.y;
                const toCenterDist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
                if (toCenterDist > 50) {
                    blob.vx += (toCenterX / toCenterDist) * 0.002 * dt;
                    blob.vy += (toCenterY / toCenterDist) * 0.002 * dt;
                }

                // Clamp velocity
                const spd = Math.sqrt(blob.vx * blob.vx + blob.vy * blob.vy);
                if (spd > 0.8) {
                    blob.vx = (blob.vx / spd) * 0.8;
                    blob.vy = (blob.vy / spd) * 0.8;
                }

                // Pulse cells
                for (const cell of blob.cells) {
                    if (cell.alive) {
                        cell.phase += cell.pulseSpeed * dt;
                    }
                }

                // Remove if way off screen
                if (blob.x < -200 || blob.x > W + 200 || blob.y < -200 || blob.y > H + 200) {
                    evilBlobs.splice(i, 1);
                }
            }

            // Update sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vx *= 0.96;
                s.vy *= 0.96;
                s.life -= s.decay;
                if (s.life <= 0) {
                    sparks.splice(i, 1);
                }
            }

            checkCollisions();
        }

        // --- Render ---
        function render() {
            // Fade trails - dark overlay for afterglow
            ctx.fillStyle = 'rgba(2, 2, 6, 0.12)';
            ctx.fillRect(0, 0, W, H);

            // Draw evil blobs
            for (const blob of evilBlobs) {
                for (const cell of blob.cells) {
                    if (!cell.alive) continue;
                    const pulse = 0.6 + 0.4 * Math.sin(cell.phase);
                    const cx = blob.x + cell.ox + Math.sin(blob.wobblePhase + cell.phase) * 3;
                    const cy = blob.y + cell.oy + Math.cos(blob.wobblePhase + cell.phase * 0.7) * 3;
                    const r = cell.radius * (0.8 + 0.3 * pulse);

                    // Outer glow
                    const glowR = r * 3.5;
                    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
                    const alpha = 0.15 * pulse;
                    glow.addColorStop(0, `hsla(${blob.h}, ${blob.s}%, ${blob.l + 15}%, ${alpha})`);
                    glow.addColorStop(1, `hsla(${blob.h}, ${blob.s}%, ${blob.l}%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

                    // Core
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${blob.h}, ${blob.s}%, ${blob.l + 10 * pulse}%, ${0.7 + 0.3 * pulse})`;
                    ctx.fill();
                }
            }

            // Draw light particles
            for (const p of lightParticles) {
                const alpha = p.life * 0.9;
                const r = p.radius * (0.5 + p.life * 0.5);

                // Glow
                const glowR = r * 5;
                const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                glow.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, ${alpha * 0.4})`);
                glow.addColorStop(0.4, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, ${alpha * 0.1})`);
                glow.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${p.lit}%, 0)`);
                ctx.fillStyle = glow;
                ctx.fillRect(p.x - glowR, p.y - glowR, glowR * 2, glowR * 2);

                // Bright core
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, ${p.sat - 20}%, ${Math.min(p.lit + 20, 98)}%, ${alpha})`;
                ctx.fill();
            }

            // Draw sparks
            for (const s of sparks) {
                const alpha = s.life;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * s.life, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${s.h}, ${s.s}%, ${s.l}%, ${alpha})`;
                ctx.fill();
            }
        }

        // --- Main loop ---
        function loop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 50); // cap delta
            lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // --- Mouse events ---
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
            prevMouseX = mouseX;
            prevMouseY = mouseY;
            mouseVX = 0;
            mouseVY = 0;
        });

        canvas.addEventListener('mousemove', (e) => {
            prevMouseX = mouseX;
            prevMouseY = mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        });

        window.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        // --- Touch events ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            const t = e.touches[0];
            mouseX = t.clientX;
            mouseY = t.clientY;
            prevMouseX = mouseX;
            prevMouseY = mouseY;
            mouseVX = 0;
            mouseVY = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            prevMouseX = mouseX;
            prevMouseY = mouseY;
            mouseX = t.clientX;
            mouseY = t.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        }, { passive: false });

        window.addEventListener('touchend', () => {
            mouseDown = false;
        });

        // --- Init ---
        // Clear to black
        ctx.fillStyle = '#020206';
        ctx.fillRect(0, 0, W, H);

        // Spawn a few initial evil blobs so there's something to see
        for (let i = 0; i < 3; i++) {
            spawnEvil();
        }

        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
