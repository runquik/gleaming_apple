<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Wave</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #020206;
            --text: #d0d0dd;
            --text-dim: #555568;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem;
            pointer-events: none;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            pointer-events: auto;
            transition: color 0.2s;
        }
        .back:hover { color: #aae8ff; }

        .instruction {
            color: rgba(180, 200, 220, 0.5);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-align: right;
            transition: opacity 0.5s;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="top-bar">
        <a href="../../" class="back">&larr; back to lab</a>
        <div class="instruction">Create waves of light to defeat The Evil.</div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // --- Data ---
        const waveArcs = [];    // expanding arc wavefronts
        const trailPts = [];    // glowing mouse trail
        const evilBlobs = [];
        const sparks = [];

        // --- Mouse ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let prevMouseX = 0, prevMouseY = 0;
        let mouseVX = 0, mouseVY = 0;
        let emitTimer = 0;

        // --- Emit a wave arc from mouse position ---
        function emitWave(x, y, vx, vy) {
            const speed = Math.sqrt(vx * vx + vy * vy);
            if (speed < 1) return;

            const dirAngle = Math.atan2(vy, vx);
            const intensity = Math.min(speed / 8, 1);

            // Primary wave arc
            const hue = Math.random() < 0.35 ? 45 + Math.random() * 15 :
                        Math.random() < 0.5  ? 185 + Math.random() * 25 :
                        55 + Math.random() * 15;

            waveArcs.push({
                x, y,
                dirAngle,
                radius: 3,
                speed: 1.5 + intensity * 3,
                arcSpan: Math.PI * (0.5 + intensity * 0.6),
                life: 1.0,
                decay: 0.006 + Math.random() * 0.003,
                hue,
                sat: 50 + Math.random() * 30,
                lit: 70 + Math.random() * 20,
                thickness: 2 + intensity * 4,
            });

            // Add trail point
            trailPts.push({
                x, y, life: 1.0,
                decay: 0.012 + Math.random() * 0.005,
                hue, sat: 60, lit: 85,
            });

            // Keep trail manageable
            if (trailPts.length > 120) trailPts.splice(0, trailPts.length - 120);
        }

        // --- Evil blob ---
        function spawnEvil() {
            const type = Math.floor(Math.random() * 3);
            const colors = [
                { h: 0, s: 70, l: 25 },
                { h: 95, s: 55, l: 22 },
                { h: 50, s: 65, l: 30 },
            ];
            const col = colors[type];

            let x, y, vx, vy;
            const edge = Math.floor(Math.random() * 4);
            const speed = 0.15 + Math.random() * 0.35;
            if (edge === 0)      { x = -20; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * speed; }
            else if (edge === 1) { x = W + 20; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * speed; }
            else if (edge === 2) { x = Math.random() * W; y = -20; vx = (Math.random() - 0.5) * speed; vy = speed; }
            else                 { x = Math.random() * W; y = H + 20; vx = (Math.random() - 0.5) * speed; vy = -speed; }

            const cells = [];
            const clusterSize = 8 + Math.floor(Math.random() * 12);
            for (let i = 0; i < clusterSize; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 25;
                cells.push({
                    ox: Math.cos(angle) * dist,
                    oy: Math.sin(angle) * dist,
                    radius: 2.5 + Math.random() * 3.5,
                    phase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.03,
                    alive: true,
                });
            }

            evilBlobs.push({
                x, y, vx, vy,
                h: col.h, s: col.s, l: col.l,
                cells,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.005 + Math.random() * 0.01,
            });
        }

        // --- Sparks ---
        function burstSparks(x, y, h, s, l, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 1 + Math.random() * 4;
                const mixLight = Math.random() > 0.4;
                sparks.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    radius: 1 + Math.random() * 2.5,
                    h: mixLight ? 45 + Math.random() * 20 : h,
                    s: mixLight ? 80 : s,
                    l: mixLight ? 85 : l + 30,
                });
            }
        }

        // --- Collision: arc wavefronts vs evil cells ---
        function checkCollisions() {
            for (let bi = evilBlobs.length - 1; bi >= 0; bi--) {
                const blob = evilBlobs[bi];

                for (let ci = blob.cells.length - 1; ci >= 0; ci--) {
                    const cell = blob.cells[ci];
                    if (!cell.alive) continue;

                    const cx = blob.x + cell.ox;
                    const cy = blob.y + cell.oy;

                    for (let wi = waveArcs.length - 1; wi >= 0; wi--) {
                        const w = waveArcs[wi];

                        // Distance from arc origin to evil cell
                        const dx = cx - w.x;
                        const dy = cy - w.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        // Check if cell is near the arc ring
                        const ringDist = Math.abs(dist - w.radius);
                        const hitThresh = w.thickness * 1.5 + cell.radius;

                        if (ringDist < hitThresh) {
                            // Check if within the arc's angular span
                            const angleToPt = Math.atan2(dy, dx);
                            let angleDiff = angleToPt - w.dirAngle;
                            // Normalize to [-PI, PI]
                            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                            if (Math.abs(angleDiff) < w.arcSpan / 2) {
                                cell.alive = false;
                                burstSparks(cx, cy, blob.h, blob.s, blob.l, 6);
                                w.life -= 0.04;
                                break;
                            }
                        }
                    }
                }

                // Remove blob if all cells dead
                let anyAlive = false;
                for (const c of blob.cells) { if (c.alive) { anyAlive = true; break; } }
                if (!anyAlive) {
                    burstSparks(blob.x, blob.y, blob.h, blob.s, blob.l, 25);
                    evilBlobs.splice(bi, 1);
                }
            }
        }

        // --- Update ---
        let lastTime = 0;
        let evilSpawnTimer = 0;
        const EVIL_SPAWN_INTERVAL = 2500;

        function update(dt) {
            // Emit waves while mouse is down
            if (mouseDown) {
                emitTimer += dt;
                if (emitTimer > 25) {
                    emitWave(mouseX, mouseY, mouseVX, mouseVY);
                    emitTimer = 0;
                }
            }

            // Update wave arcs - expand outward
            for (let i = waveArcs.length - 1; i >= 0; i--) {
                const w = waveArcs[i];
                w.radius += w.speed;
                w.life -= w.decay;
                // Thickness thins as it expands
                w.thickness *= 0.995;
                if (w.life <= 0 || w.radius > Math.max(W, H)) {
                    waveArcs.splice(i, 1);
                }
            }

            // Update trail
            for (let i = trailPts.length - 1; i >= 0; i--) {
                trailPts[i].life -= trailPts[i].decay;
                if (trailPts[i].life <= 0) trailPts.splice(i, 1);
            }

            // Spawn evil
            evilSpawnTimer += dt;
            if (evilSpawnTimer > EVIL_SPAWN_INTERVAL) {
                spawnEvil();
                evilSpawnTimer = 0;
            }

            // Update evil blobs
            for (let i = evilBlobs.length - 1; i >= 0; i--) {
                const blob = evilBlobs[i];
                blob.wobblePhase += blob.wobbleSpeed * dt;
                blob.x += blob.vx * dt * 0.06;
                blob.y += blob.vy * dt * 0.06;

                const toCenterX = W / 2 - blob.x;
                const toCenterY = H / 2 - blob.y;
                const toCenterDist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
                if (toCenterDist > 50) {
                    blob.vx += (toCenterX / toCenterDist) * 0.002 * dt;
                    blob.vy += (toCenterY / toCenterDist) * 0.002 * dt;
                }

                const spd = Math.sqrt(blob.vx * blob.vx + blob.vy * blob.vy);
                if (spd > 0.8) {
                    blob.vx = (blob.vx / spd) * 0.8;
                    blob.vy = (blob.vy / spd) * 0.8;
                }

                for (const cell of blob.cells) {
                    if (cell.alive) cell.phase += cell.pulseSpeed * dt;
                }

                if (blob.x < -200 || blob.x > W + 200 || blob.y < -200 || blob.y > H + 200) {
                    evilBlobs.splice(i, 1);
                }
            }

            // Update sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy;
                s.vx *= 0.96; s.vy *= 0.96;
                s.life -= s.decay;
                if (s.life <= 0) sparks.splice(i, 1);
            }

            checkCollisions();
        }

        // --- Render ---
        function render() {
            // Fade for trails
            ctx.fillStyle = 'rgba(2, 2, 6, 0.1)';
            ctx.fillRect(0, 0, W, H);

            // --- Draw evil blobs ---
            for (const blob of evilBlobs) {
                for (const cell of blob.cells) {
                    if (!cell.alive) continue;
                    const pulse = 0.6 + 0.4 * Math.sin(cell.phase);
                    const cx = blob.x + cell.ox + Math.sin(blob.wobblePhase + cell.phase) * 3;
                    const cy = blob.y + cell.oy + Math.cos(blob.wobblePhase + cell.phase * 0.7) * 3;
                    const r = cell.radius * (0.8 + 0.3 * pulse);

                    // Glow
                    const glowR = r * 3.5;
                    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
                    glow.addColorStop(0, `hsla(${blob.h}, ${blob.s}%, ${blob.l + 15}%, ${0.15 * pulse})`);
                    glow.addColorStop(1, `hsla(${blob.h}, ${blob.s}%, ${blob.l}%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

                    // Core
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${blob.h}, ${blob.s}%, ${blob.l + 10 * pulse}%, ${0.7 + 0.3 * pulse})`;
                    ctx.fill();
                }
            }

            // --- Draw wave arcs ---
            ctx.lineCap = 'round';
            for (const w of waveArcs) {
                const alpha = w.life;
                const startAngle = w.dirAngle - w.arcSpan / 2;
                const endAngle = w.dirAngle + w.arcSpan / 2;

                // Outer glow layer (wide, faint)
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius, startAngle, endAngle);
                ctx.strokeStyle = `hsla(${w.hue}, ${w.sat}%, ${w.lit}%, ${alpha * 0.12})`;
                ctx.lineWidth = w.thickness * 6;
                ctx.stroke();

                // Mid glow layer
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius, startAngle, endAngle);
                ctx.strokeStyle = `hsla(${w.hue}, ${w.sat}%, ${w.lit}%, ${alpha * 0.3})`;
                ctx.lineWidth = w.thickness * 2.5;
                ctx.stroke();

                // Bright core
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius, startAngle, endAngle);
                ctx.strokeStyle = `hsla(${w.hue}, ${w.sat - 15}%, ${Math.min(w.lit + 15, 97)}%, ${alpha * 0.85})`;
                ctx.lineWidth = w.thickness;
                ctx.stroke();

                // Hot white center
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius, startAngle, endAngle);
                ctx.strokeStyle = `hsla(${w.hue}, 20%, 95%, ${alpha * 0.5})`;
                ctx.lineWidth = Math.max(w.thickness * 0.3, 0.5);
                ctx.stroke();
            }

            // --- Draw mouse trail (source glow) ---
            if (trailPts.length > 1) {
                for (let i = 1; i < trailPts.length; i++) {
                    const a = trailPts[i - 1];
                    const b = trailPts[i];
                    const alpha = Math.min(a.life, b.life);
                    if (alpha <= 0) continue;

                    // Soft glow trail
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.strokeStyle = `hsla(${b.hue}, ${b.sat}%, ${b.lit}%, ${alpha * 0.15})`;
                    ctx.lineWidth = 18 * alpha;
                    ctx.stroke();

                    // Core trail
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.strokeStyle = `hsla(${b.hue}, ${b.sat}%, ${b.lit}%, ${alpha * 0.6})`;
                    ctx.lineWidth = 3 * alpha;
                    ctx.stroke();
                }
            }

            // --- Draw sparks ---
            for (const s of sparks) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * s.life, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${s.h}, ${s.s}%, ${s.l}%, ${s.life})`;
                ctx.fill();
            }
        }

        // --- Main loop ---
        function loop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 50);
            lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // --- Mouse events ---
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX; mouseY = e.clientY;
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseVX = 0; mouseVY = 0;
        });

        canvas.addEventListener('mousemove', (e) => {
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseX = e.clientX; mouseY = e.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        });

        window.addEventListener('mouseup', () => { mouseDown = false; });

        // --- Touch events ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            const t = e.touches[0];
            mouseX = t.clientX; mouseY = t.clientY;
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseVX = 0; mouseVY = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            prevMouseX = mouseX; prevMouseY = mouseY;
            mouseX = t.clientX; mouseY = t.clientY;
            mouseVX = mouseX - prevMouseX;
            mouseVY = mouseY - prevMouseY;
        }, { passive: false });

        window.addEventListener('touchend', () => { mouseDown = false; });

        // --- Init ---
        ctx.fillStyle = '#020206';
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 3; i++) spawnEvil();

        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
