<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>001 — Game of Life</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #05050a;
            --surface: #0c0c14;
            --border: #1a1a2a;
            --text: #d0d0dd;
            --text-dim: #555568;
            --accent: #6ee7b7;
            --accent-dim: #2a4a3e;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem 0.5rem;
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
        }
        .back:hover { color: var(--accent); }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0.3rem 0 0.15rem;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            padding: 0.6rem 1rem;
            position: relative;
            z-index: 10;
        }

        button, select {
            font-family: inherit;
            font-size: 0.75rem;
            padding: 0.35rem 0.7rem;
            background: rgba(12, 12, 20, 0.8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.15s;
            backdrop-filter: blur(8px);
        }
        button:hover, select:hover { border-color: var(--accent-dim); }
        button.active { border-color: var(--accent); color: var(--accent); }

        .stats {
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 0.3rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        .stats span { color: var(--accent); }

        .canvas-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        canvas {
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        #glow-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .hint {
            font-size: 0.65rem;
            color: var(--text-dim);
            padding: 0.4rem 2rem 0.8rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="back">&larr; back to lab</a>
        <h1>Game of Life</h1>
        <p>Conway's cellular automaton</p>
    </header>

    <div class="controls">
        <button id="btn-play" class="active">&#9654; Play</button>
        <button id="btn-step">Step</button>
        <button id="btn-clear">Clear</button>
        <button id="btn-random">Random</button>
        <select id="sel-pattern">
            <option value="">Load pattern...</option>
            <option value="glider">Glider</option>
            <option value="pulsar">Pulsar</option>
            <option value="gosper-gun">Gosper Gun</option>
            <option value="lwss">Lightweight Spaceship</option>
            <option value="r-pentomino">R-Pentomino</option>
        </select>
        <select id="sel-speed">
            <option value="60">Normal</option>
            <option value="30">Fast</option>
            <option value="15">Blazing</option>
            <option value="120">Slow</option>
        </select>
        <select id="sel-palette">
            <option value="emerald">Emerald</option>
            <option value="plasma">Plasma</option>
            <option value="ocean">Ocean</option>
            <option value="fire">Fire</option>
            <option value="mono">Mono</option>
        </select>
    </div>

    <div class="stats">
        <div>Gen: <span id="stat-gen">0</span></div>
        <div>Pop: <span id="stat-pop">0</span></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="grid"></canvas>
        <canvas id="glow-canvas"></canvas>
    </div>

    <div class="hint">Click or drag to draw cells. Pick a pattern or just randomize and watch.</div>

    <script>
    (function() {
        // --- Config ---
        const CELL = 8;
        const MAX_AGE = 120;      // max age for color cycling
        const FADE_FRAMES = 12;   // how many frames a dead cell takes to fade
        const GLOW_RADIUS = 14;   // px radius of glow around alive cells

        // --- Color palettes ---
        // Each palette: array of [r,g,b] stops that we interpolate through by cell age
        const PALETTES = {
            emerald: [
                [255, 255, 255],  // newborn: white
                [110, 231, 183],  // young: mint
                [16, 185, 129],   // mid: emerald
                [6, 95, 70],      // old: deep green
                [139, 92, 246],   // ancient: purple
            ],
            plasma: [
                [255, 255, 255],
                [236, 72, 153],   // pink
                [168, 85, 247],   // purple
                [59, 130, 246],   // blue
                [14, 165, 233],   // sky
            ],
            ocean: [
                [255, 255, 255],
                [125, 211, 252],  // light blue
                [56, 189, 248],   // sky
                [14, 116, 144],   // teal
                [21, 94, 117],    // deep
            ],
            fire: [
                [255, 255, 255],
                [253, 224, 71],   // yellow
                [251, 146, 60],   // orange
                [239, 68, 68],    // red
                [127, 29, 29],    // deep red
            ],
            mono: [
                [255, 255, 255],
                [200, 200, 210],
                [140, 140, 155],
                [80, 80, 95],
                [50, 50, 65],
            ],
        };

        // --- Patterns ---
        const PATTERNS = {
            glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
            pulsar: [
                [2,4],[2,5],[2,6],[2,10],[2,11],[2,12],
                [4,2],[4,7],[4,9],[4,14],[5,2],[5,7],[5,9],[5,14],
                [6,2],[6,7],[6,9],[6,14],
                [7,4],[7,5],[7,6],[7,10],[7,11],[7,12],
                [9,4],[9,5],[9,6],[9,10],[9,11],[9,12],
                [10,2],[10,7],[10,9],[10,14],[11,2],[11,7],[11,9],[11,14],
                [12,2],[12,7],[12,9],[12,14],
                [14,4],[14,5],[14,6],[14,10],[14,11],[14,12],
            ],
            'gosper-gun': [
                [5,1],[5,2],[6,1],[6,2],
                [5,11],[6,11],[7,11],
                [4,12],[8,12],[3,13],[9,13],[3,14],[9,14],
                [6,15],[4,16],[8,16],
                [5,17],[6,17],[7,17],[6,18],
                [3,21],[4,21],[5,21],[3,22],[4,22],[5,22],
                [2,23],[6,23],[1,25],[2,25],[6,25],[7,25],
                [3,35],[4,35],[3,36],[4,36],
            ],
            lwss: [[0,1],[0,4],[1,0],[2,0],[2,4],[3,0],[3,1],[3,2],[3,3]],
            'r-pentomino': [[0,1],[0,2],[1,0],[1,1],[2,1]],
        };

        // --- State ---
        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');
        const glowCanvas = document.getElementById('glow-canvas');
        const glowCtx = glowCanvas.getContext('2d');

        let COLS, ROWS;
        let age;       // Int16Array grid: >0 = alive (age in frames), <0 = dead (negative = fade countdown)
        let running = true;
        let simInterval = 60;  // ms between simulation steps
        let generation = 0;
        let drawing = false;
        let drawValue = true;
        let palette = 'emerald';
        let lastStepTime = 0;

        function resize() {
            const wrap = canvas.parentElement;
            const w = wrap.clientWidth;
            const h = wrap.clientHeight;
            COLS = Math.floor(w / CELL);
            ROWS = Math.floor(h / CELL);
            canvas.width = COLS * CELL;
            canvas.height = ROWS * CELL;
            glowCanvas.width = COLS * CELL;
            glowCanvas.height = ROWS * CELL;
        }

        function makeAge() {
            return new Int16Array(ROWS * COLS);
        }

        function idx(y, x) { return y * COLS + x; }

        function isAlive(y, x) { return age[idx(y, x)] > 0; }

        function randomize(density) {
            generation = 0;
            age = makeAge();
            for (let i = 0; i < ROWS * COLS; i++) {
                age[i] = Math.random() < (density || 0.3) ? 1 : 0;
            }
        }

        function clearGrid() {
            generation = 0;
            age = makeAge();
        }

        function placePattern(name) {
            clearGrid();
            const cells = PATTERNS[name];
            if (!cells) return;
            let maxR = 0, maxC = 0;
            cells.forEach(([r, c]) => { maxR = Math.max(maxR, r); maxC = Math.max(maxC, c); });
            const offR = Math.floor((ROWS - maxR) / 2);
            const offC = Math.floor((COLS - maxC) / 2);
            cells.forEach(([r, c]) => {
                const nr = r + offR, nc = c + offC;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS)
                    age[idx(nr, nc)] = 1;
            });
        }

        // --- Color interpolation ---
        function lerpColor(stops, t) {
            // t in [0, 1] — interpolate through palette stops
            t = Math.max(0, Math.min(1, t));
            const seg = t * (stops.length - 1);
            const i = Math.floor(seg);
            const f = seg - i;
            const a = stops[Math.min(i, stops.length - 1)];
            const b = stops[Math.min(i + 1, stops.length - 1)];
            return [
                Math.round(a[0] + (b[0] - a[0]) * f),
                Math.round(a[1] + (b[1] - a[1]) * f),
                Math.round(a[2] + (b[2] - a[2]) * f),
            ];
        }

        function cellColor(cellAge) {
            const stops = PALETTES[palette] || PALETTES.emerald;
            const t = Math.min(cellAge / MAX_AGE, 1);
            return lerpColor(stops, t);
        }

        // --- Simulation ---
        function step() {
            const newAge = makeAge();
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let n = 0;
                    for (let dy = -1; dy <= 1; dy++)
                        for (let dx = -1; dx <= 1; dx++) {
                            if (!dy && !dx) continue;
                            const ny = (y + dy + ROWS) % ROWS;
                            const nx = (x + dx + COLS) % COLS;
                            if (age[idx(ny, nx)] > 0) n++;
                        }
                    const i = idx(y, x);
                    const alive = age[i] > 0;
                    if (alive) {
                        // Survive?
                        newAge[i] = (n === 2 || n === 3)
                            ? Math.min(age[i] + 1, MAX_AGE)
                            : -FADE_FRAMES;  // just died — start fade
                    } else {
                        // Birth?
                        if (n === 3) {
                            newAge[i] = 1;
                        } else {
                            // Continue fading or stay dead
                            newAge[i] = age[i] < 0 ? age[i] + 1 : 0;
                        }
                    }
                }
            }
            age = newAge;
            generation++;
        }

        // --- Rendering ---
        function draw() {
            // Main canvas: dark background
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Glow canvas: clear
            glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);

            let pop = 0;

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = idx(y, x);
                    const v = age[i];

                    if (v > 0) {
                        // Alive cell
                        pop++;
                        const [r, g, b] = cellColor(v);
                        const cx = x * CELL + CELL / 2;
                        const cy = y * CELL + CELL / 2;
                        const radius = CELL / 2 - 0.5;

                        // Cell body — rounded
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.fill();

                        // Glow — soft radial gradient on glow layer
                        const brightness = Math.max(0.15, 1 - v / MAX_AGE);
                        const grad = glowCtx.createRadialGradient(cx, cy, 0, cx, cy, GLOW_RADIUS);
                        grad.addColorStop(0, `rgba(${r},${g},${b},${(0.5 * brightness).toFixed(2)})`);
                        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        glowCtx.fillStyle = grad;
                        glowCtx.fillRect(cx - GLOW_RADIUS, cy - GLOW_RADIUS, GLOW_RADIUS * 2, GLOW_RADIUS * 2);

                    } else if (v < 0) {
                        // Fading dead cell
                        const fadeProgress = 1 - (-v / FADE_FRAMES);  // 0 = just died, 1 = fully faded
                        const alpha = (1 - fadeProgress) * 0.5;
                        const stops = PALETTES[palette] || PALETTES.emerald;
                        const [r, g, b] = stops[stops.length - 1];  // use oldest color for ghosts
                        const cx = x * CELL + CELL / 2;
                        const cy = y * CELL + CELL / 2;

                        ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL / 2 - 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            document.getElementById('stat-gen').textContent = generation;
            document.getElementById('stat-pop').textContent = pop;
        }

        // --- Animation loop ---
        function loop(timestamp) {
            if (running && timestamp - lastStepTime >= simInterval) {
                step();
                lastStepTime = timestamp;
            }
            draw();
            requestAnimationFrame(loop);
        }

        // --- Mouse drawing ---
        function cellAt(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX / CELL);
            const y = Math.floor((e.clientY - rect.top) * scaleY / CELL);
            return [y, x];
        }

        function paint(y, x) {
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                age[idx(y, x)] = drawValue ? 1 : 0;
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            const [y, x] = cellAt(e);
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                drawValue = age[idx(y, x)] <= 0;
                paint(y, x);
                drawing = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const [y, x] = cellAt(e);
            paint(y, x);
        });

        window.addEventListener('mouseup', () => { drawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const [y, x] = cellAt(e.touches[0]);
            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                drawValue = age[idx(y, x)] <= 0;
                paint(y, x);
                drawing = true;
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!drawing) return;
            const [y, x] = cellAt(e.touches[0]);
            paint(y, x);
        }, {passive: false});

        window.addEventListener('touchend', () => { drawing = false; });

        // --- Controls ---
        const btnPlay = document.getElementById('btn-play');
        btnPlay.addEventListener('click', () => {
            running = !running;
            btnPlay.innerHTML = running ? '&#9654; Play' : '&#9646;&#9646; Pause';
            btnPlay.classList.toggle('active', running);
        });

        document.getElementById('btn-step').addEventListener('click', () => {
            if (running) {
                running = false;
                btnPlay.innerHTML = '&#9646;&#9646; Pause';
                btnPlay.classList.remove('active');
            }
            step();
        });

        document.getElementById('btn-clear').addEventListener('click', () => { clearGrid(); });
        document.getElementById('btn-random').addEventListener('click', () => { randomize(); });

        document.getElementById('sel-pattern').addEventListener('change', function() {
            if (this.value) placePattern(this.value);
            this.value = '';
        });

        document.getElementById('sel-speed').addEventListener('change', function() {
            simInterval = parseInt(this.value);
        });

        document.getElementById('sel-palette').addEventListener('change', function() {
            palette = this.value;
        });

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            const oldAge = age;
            const oldCols = COLS;
            const oldRows = ROWS;
            resize();
            age = makeAge();
            // Copy old state into new grid
            const copyRows = Math.min(oldRows, ROWS);
            const copyCols = Math.min(oldCols, COLS);
            for (let y = 0; y < copyRows; y++)
                for (let x = 0; x < copyCols; x++)
                    age[idx(y, x)] = oldAge[y * oldCols + x];
        });

        // --- Init ---
        resize();
        randomize();
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
