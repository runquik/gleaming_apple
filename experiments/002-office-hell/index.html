<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Hell</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #08080c;
            --surface: #0e0e14;
            --border: #1a1a28;
            --text: #c8c8d0;
            --text-dim: #5a5a6e;
            --item: #fbbf24;
            --npc: #38bdf8;
            --exit: #4ade80;
            --command: #a78bfa;
            --danger: #f87171;
            --glow: rgba(167, 139, 250, 0.15);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(167, 139, 250, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(248, 113, 113, 0.02) 0%, transparent 50%);
        }

        .game-frame {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow:
                0 0 60px var(--glow),
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        header {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .back:hover { opacity: 1; color: var(--command); }

        header h1 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--danger);
            letter-spacing: 0.05em;
        }

        .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        .stats span { color: var(--text); }
        .stats .class-label { color: var(--command); }

        .commands-bar {
            padding: 0.4rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--text-dim);
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
        }
        .commands-bar code {
            color: var(--command);
        }

        #output {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            line-height: 1.75;
            font-size: 0.82rem;
            scroll-behavior: smooth;
        }

        #output::-webkit-scrollbar { width: 6px; }
        #output::-webkit-scrollbar-track { background: transparent; }
        #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        #output p { margin-bottom: 0.6rem; }
        #output hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

        .room-title {
            color: var(--exit);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.15rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .system { color: var(--text-dim); font-style: italic; }
        .error { color: var(--danger); }
        .magic { color: var(--command); text-shadow: 0 0 10px var(--command); }
        .item { color: var(--item); }
        .npc { color: var(--npc); }
        .exit { color: var(--exit); }
        .cmd { color: var(--command); }

        .input-area {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .input-area .prompt {
            color: var(--command);
            font-size: 0.85rem;
            user-select: none;
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 0.82rem;
            outline: none;
            caret-color: var(--command);
        }

        #input::placeholder { color: var(--text-dim); opacity: 0.5; }

        .ending-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 12, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        .ending-overlay.visible { opacity: 1; pointer-events: auto; }
        .ending-overlay h2 {
            font-size: 1.3rem;
            color: var(--item);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        .ending-overlay .ending-text {
            max-width: 50ch;
            line-height: 1.7;
            color: var(--text-dim);
        }
        .ending-overlay .ending-text p { margin-bottom: 0.75rem; }
        .ending-overlay .ending-type {
            color: var(--exit);
            font-size: 0.75rem;
            margin-top: 1.5rem;
            letter-spacing: 0.15em;
        }
        .ending-overlay button {
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .ending-overlay button:hover { border-color: var(--command); }

        .credits {
            position: fixed;
            bottom: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: var(--text-dim);
            opacity: 0.4;
        }

        .stats-bar {
            padding: 0.3rem 1rem;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.8rem;
            font-size: 0.62rem;
            color: var(--text-dim);
        }
        .stats-bar .stat-group { display: flex; gap: 0.15rem; align-items: center; }
        .stats-bar .stat-label { color: var(--text-dim); }
        .stats-bar .stat-val { color: var(--text); font-weight: 600; }
        .stats-bar .stat-morale { color: var(--danger); }
        .stats-bar .stat-coffee { color: var(--item); }
        .stats-bar .stat-pp { color: var(--exit); }
        .stat-bar-fill {
            display: inline-block;
            height: 4px;
            border-radius: 2px;
            margin-left: 2px;
            vertical-align: middle;
        }

        .combat-box {
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            margin: 0.4rem 0;
            background: rgba(248, 113, 113, 0.04);
        }
        .combat-box .enemy-name { color: var(--danger); font-weight: 600; }
        .combat-box .combat-options { color: var(--command); font-size: 0.75rem; margin-top: 0.3rem; }
        .combat-damage { color: var(--danger); font-weight: 600; }
        .combat-heal { color: var(--exit); font-weight: 600; }
        .combat-info { color: var(--npc); }

        .quest-update { color: var(--item); font-style: italic; }
        .levelup { color: var(--item); font-weight: 600; text-shadow: 0 0 8px var(--item); }
        .status-effect { color: var(--command); font-size: 0.7rem; font-style: italic; }
    </style>
</head>
<body>
    <div class="game-frame">
        <header>
            <div class="title-area">
                <a href="../../" class="back">← exit</a>
                <h1>OFFICE HELL</h1>
            </div>
            <div class="stats">
                <span id="stat-class"></span>
                <span>☕ <span id="stat-coffee">0</span></span>
            </div>
        </header>

        <div id="stats-bar" class="stats-bar" style="display:none;">
            <div class="stat-group"><span class="stat-label">MRL</span> <span class="stat-val stat-morale" id="sb-morale">100</span></div>
            <div class="stat-group"><span class="stat-label">COF</span> <span class="stat-val stat-coffee" id="sb-coffee">0/3</span></div>
            <div class="stat-group"><span class="stat-label">HUS</span> <span class="stat-val" id="sb-hustle">1</span></div>
            <div class="stat-group"><span class="stat-label">OPT</span> <span class="stat-val" id="sb-optics">1</span></div>
            <div class="stat-group"><span class="stat-label">SYN</span> <span class="stat-val" id="sb-synergy">1</span></div>
            <div class="stat-group"><span class="stat-label">NET</span> <span class="stat-val" id="sb-networking">1</span></div>
            <div class="stat-group"><span class="stat-label">EFF</span> <span class="stat-val" id="sb-efficiency">1</span></div>
            <div class="stat-group"><span class="stat-label">LV</span> <span class="stat-val stat-pp" id="sb-level">Q0</span></div>
        </div>

        <div class="commands-bar">
            <code>/look</code>
            <code>/go</code>
            <code>/take</code>
            <code>/use</code>
            <code>/talk</code>
            <code>/open</code>
            <code>/read</code>
            <code>/inv</code>
            <code>/stats</code>
            <code>/equip</code>
            <code>/cast</code>
            <code>/quests</code>
            <code>/help</code>
        </div>

        <div id="output"></div>

        <div class="input-area">
            <span class="prompt">&gt;</span>
            <input type="text" id="input" placeholder="What do you do?" autocomplete="off" autofocus>
        </div>
    </div>

    <div class="ending-overlay" id="ending-overlay">
        <h2 id="ending-title">ENDING UNLOCKED</h2>
        <div class="ending-text" id="ending-text"></div>
        <p class="ending-type" id="ending-type"></p>
        <button id="btn-restart">Play Again</button>
    </div>

    <div class="credits">a human + ai experiment</div>

    <script>
    (function() {
        // =====================================================
        // ROOMS
        // =====================================================
        const ROOMS = {
            'elevator-lobby': {
                name: 'Elevator Lobby',
                description: `The elevator doors wheeze shut behind you with the enthusiasm of a dying accordion. You're on <span class="exit">FLOOR 7</span>. The <span class="item">FLUORESCENT LIGHTS</span> flicker in what you've come to recognize as their standard passive-aggressive greeting.

A <span class="item">MOTIVATIONAL POSTER</span> on the wall says "HANG IN THERE" with a picture of a cat. The cat has given up.

<span class="npc">MARGE</span> sits at the reception desk, aggressively not making eye contact. A <span class="item">SIGN-IN SHEET</span> sits in front of her. The <span class="item">ELEVATOR</span> behind you has a keyhole.`,
                exits: { south: 'cubicle-farm' },
                items: ['poster', 'lights', 'sign-in-sheet', 'elevator', 'floor', 'ceiling', 'walls'],
                npcs: ['marge'],
            },
            'cubicle-farm': {
                name: 'Cubicle Farm',
                description: `Rows upon rows of identical gray <span class="item">CUBICLES</span> stretch before you like a fabric-walled purgatory. The sound of <span class="item">KEYBOARDS</span> clicking mingles with passive-aggressive sighing. Someone is microwaving <span class="item">FISH</span> again.

A <span class="item">PRINTER</span> blinks menacingly in the corner, forever claiming it's out of toner. <span class="npc">KAREN</span> from HR patrols with her <span class="item">CLIPBOARD</span>. <span class="npc">DAVE</span> from IT shuffles past, muttering about tickets.

A <span class="item">WATER COOLER</span> gurgles near the <span class="exit">BREAK ROOM</span> to the east. A <span class="exit">CONFERENCE ROOM</span> is to the northeast. The <span class="exit">BATHROOM</span> is southeast.`,
                exits: { north: 'elevator-lobby', south: 'your-cubicle', east: 'break-room', west: 'supply-closet', northeast: 'conference-room', southeast: 'bathroom' },
                items: ['printer', 'cubicles', 'keyboards', 'fish-smell', 'water-cooler', 'carpet', 'ceiling-tiles'],
                npcs: ['karen', 'dave'],
            },
            'your-cubicle': {
                name: 'Your Cubicle',
                description: `Ah, your kingdom. A 6x6 foot empire of beige. The <span class="item">WALLS</span> are covered in passive-aggressive notes and a <span class="item">CALENDAR</span> from 2019.

A <span class="item">DEAD PLANT</span> sits on your <span class="item">DESK</span>. Your <span class="item">COMPUTER</span> hums with 347 unread emails. A <span class="item">DRAWER</span> is slightly ajar. Your <span class="item">CHAIR</span> squeaks ominously.

A <span class="item">STICKY NOTE</span> peeks out from under the plant. A <span class="item">FAMILY PHOTO</span> faces the wall — you turned it around months ago. The <span class="item">BROOM CLOSET</span> is to the east.`,
                exits: { north: 'cubicle-farm', east: 'broom-closet', south: 'boss-hallway' },
                items: ['plant', 'computer', 'drawer', 'sticky-note', 'desk', 'chair', 'walls', 'calendar', 'photo', 'monitor', 'keyboard', 'mouse', 'pen-cup', 'stapler-normal'],
                npcs: [],
            },
            'break-room': {
                name: 'Break Room',
                description: `The break room smells of burnt <span class="item">POPCORN</span> and broken dreams. A <span class="item">MICROWAVE</span> hums with the souls of a thousand reheated lunches.

A <span class="item">FRIDGE</span> contains mysteries best left unexplored. Someone's <span class="item">LUNCH</span> has a passive-aggressive note. The <span class="item">COFFEE MACHINE</span> gurgles with dark promise.

<span class="npc">THE JANITOR</span> mops the same spot he's been mopping for three years. A <span class="item">VENDING MACHINE</span> offers <span class="item">SNACKS</span> at predatory prices. The <span class="item">BULLETIN BOARD</span> advertises a "Mandatory Fun Day."`,
                exits: { west: 'cubicle-farm', south: 'broom-closet' },
                items: ['coffee-machine', 'fridge', 'lunch', 'microwave', 'popcorn', 'vending-machine', 'snacks', 'bulletin-board', 'table', 'chairs', 'sink', 'mugs'],
                npcs: ['janitor'],
            },
            'supply-closet': {
                name: 'Supply Closet',
                description: `A cramped closet full of <span class="item">OFFICE SUPPLIES</span> that nobody is allowed to take without Form 27B-Stroke-6 in triplicate.

<span class="item">BOXES</span> of paperclips tower precariously. <span class="item">REAMS</span> of paper gather dust. Wait — in the back, behind the boxes... is that a <span class="item">GLOWING STAPLER</span>? No. Staplers don't glow.

A <span class="item">PEN</span> and some <span class="item">PAPER</span> sit within easy reach. A <span class="item">HOLE PUNCH</span> looks surprisingly threatening.`,
                exits: { east: 'cubicle-farm' },
                items: ['stapler', 'pen', 'paper', 'boxes', 'paperclips', 'tape', 'scissors', 'hole-punch', 'binders', 'post-its', 'rubber-bands', 'shelves'],
                npcs: [],
            },
            'broom-closet': {
                name: 'Broom Closet',
                get description() {
                    if (!state.flags.closetOpened) {
                        return `A door labeled "MAINTENANCE - AUTHORIZED PERSONNEL ONLY." It's slightly ajar. You smell cleaning products and... something else. Ozone? Old books?

The <span class="item">DOOR</span> beckons. A <span class="item">MOP BUCKET</span> sits outside, filled with gray water and existential despair.`;
                    }
                    if (!state.flags.magicDiscovered) {
                        return `The closet is... bigger on the inside. Much bigger. This is fine.

<span class="item">CANDLES</span> float in the air (fire code violation). <span class="item">BOOKSHELVES</span> line the walls. A <span class="item">DESK</span> holds a glowing <span class="item">SPELLBOOK</span>. <span class="item">RUNES</span> are carved into the floor.

A <span class="item">CRYSTAL BALL</span> shows your quarterly review. It's not going well.`;
                    }
                    return `The wizard's study. <span class="item">CANDLES</span> float lazily. The <span class="item">SPELLBOOK</span> pulses on the <span class="item">DESK</span>.

A shelf holds <span class="item">POTIONS</span> with labels like "LIQUID COURAGE" and "MEETINGS-B-GONE." An <span class="item">OWL</span> watches you. It works in Accounts Receivable.

<span class="item">ARCANE NOTES</span> cover the desk, mixed with tax forms.`;
                },
                exits: { west: 'your-cubicle', north: 'break-room' },
                get items() {
                    if (!state.flags.closetOpened) return ['door', 'mop-bucket'];
                    if (!state.flags.magicDiscovered) return ['spellbook', 'candles', 'desk-wizard', 'bookshelves', 'runes', 'crystal-ball'];
                    return ['spellbook', 'candles', 'desk-wizard', 'bookshelves', 'courage-potion', 'potions', 'owl', 'arcane-notes'];
                },
                npcs: [],
                onEnter() {
                    if (!state.flags.closetOpened) {
                        state.flags.closetOpened = true;
                        return `<p class="magic">You push open the door expecting mops. Cleaning supplies. Maybe that weird smell explained.</p>
<p class="magic">Instead, the closet is... bigger on the inside?</p>
<p>There's a desk. There are bookshelves. Candles float in the air, which is absolutely a fire code violation.</p>
<p><em>"What,"</em> you say aloud, to no one, <em>"the actual hell."</em></p>`;
                    }
                    return null;
                }
            },
            'boss-hallway': {
                name: 'Executive Hallway',
                description: `The carpet is noticeably nicer here. The <span class="item">WALLS</span> display <span class="item">MOTIVATIONAL ARTWORK</span> worth more than your salary. A <span class="item">FERN</span> thrives in conditions identical to where your desk plant died.

<span class="npc">THE INTERN</span> sits at a desk outside the corner office, looking terrified. A <span class="item">PLAQUE</span> on the wall lists "Employee of the Month" — the same person for 47 consecutive months.

The door to <span class="exit">GREG'S OFFICE</span> looms ahead. A <span class="item">SECURITY CAMERA</span> watches your every move.`,
                exits: { north: 'your-cubicle', south: 'boss-office' },
                items: ['walls', 'artwork', 'fern', 'plaque', 'camera', 'nice-carpet', 'fancy-lights'],
                npcs: ['intern'],
                get locked() { return !state.flags.bossOfficeUnlocked; },
                onEnter() {
                    if (this.locked) {
                        state.currentRoom = 'your-cubicle';
                        return `<p class="error">You take a step toward the executive hallway. <span class="npc">KAREN</span> materializes from nowhere.</p>
<p>"Do you have an <em>appointment</em>?" Her smile is a blade. You retreat to your cubicle.</p>`;
                    }
                    return null;
                }
            },
            'boss-office': {
                name: "Greg's Corner Office",
                description: `The corner office. Windows on two sides. <span class="npc">GREG</span> sits behind a <span class="item">DESK</span> roughly the size of a small aircraft carrier.

The <span class="item">WINDOW</span> offers a view of the city below. Very far below. It's the kind that opens, which seems like an OSHA violation.

<span class="item">MOTIVATIONAL POSTERS</span> line the walls — but these ones are framed. Fancy. A <span class="item">GOLF BAG</span> leans in the corner. A <span class="item">WORLD'S OKAYEST BOSS</span> mug sits on the desk.

Greg's <span class="item">NAMEPLATE</span> reads "GREG HENDERSON - REGIONAL MANAGER OF SYNERGY." Wait. Henderson?`,
                exits: { north: 'boss-hallway' },
                items: ['window', 'nameplate', 'greg-desk', 'golf-bag', 'mug', 'posters', 'view', 'chair-fancy', 'computer-greg', 'phone'],
                npcs: ['greg'],
                onEnter() {
                    if (!state.flags.metGreg) {
                        state.flags.metGreg = true;
                        return `<p>Greg looks up from his computer. "Ah! You! The Henderson Report. Very important. To synergy."</p>
<p>He has no idea what that means. Neither do you. Neither does anyone.</p>`;
                    }
                    return null;
                }
            },
            'server-room': {
                name: 'Server Room',
                get description() {
                    const base = `The server room hums with eldritch energy (or maybe that's just the cooling system). Rows of <span class="item">SERVER RACKS</span> blink with status lights like a thousand unblinking eyes.

One rack is labeled <span class="item">"DRAGON"</span>. It runs hot. Very hot. The <span class="item">CABLES</span> on the floor are a trip hazard and possibly sentient.`;
                    if (state.flags.magicDiscovered) {
                        return base + `\n\n<span class="magic">Now that you've seen real magic, DRAGON seems... different. It pulses. It breathes. Is that... a scale?</span>`;
                    }
                    return base + `\n\nA <span class="item">WHITEBOARD</span> shows the network topology. It's wrong. Everyone knows it's wrong. Nobody updates it.`;
                },
                exits: { north: 'cubicle-farm' },
                items: ['servers', 'dragon-server', 'cables', 'whiteboard', 'cooling', 'blinking-lights', 'fire-extinguisher'],
                npcs: [],
            },

            // =====================================================
            // FLOOR 7 ADDITIONS
            // =====================================================
            'conference-room': {
                name: 'Conference Room B',
                description: `A glass-walled room where dreams go to die in 30-minute increments. The <span class="item">WHITEBOARD</span> is covered in diagrams nobody understands. A <span class="item">SPEAKERPHONE</span> sits in the center of the table like a spider.

The <span class="item">CHAIRS</span> are the nice kind — the kind that say "this meeting could have been an email, but at least you'll be comfortable."

<span class="npc">TODD</span> might be here, looking for his lunch. A <span class="item">PROJECTOR</span> displays last quarter's numbers. They're not good.`,
                exits: { south: 'cubicle-farm' },
                items: ['conf-whiteboard', 'speakerphone', 'conf-chairs', 'projector', 'dry-erase-markers'],
                get npcs() { return state.flags.toddLocation === 'conference-room' ? ['todd'] : []; },
                onEnter() {
                    if (!state.flags.visitedConference) {
                        state.flags.visitedConference = true;
                        return `<p>You enter Conference Room B. A calendar on the wall shows it's booked solid for the next 47 years.</p>`;
                    }
                    return null;
                }
            },
            'bathroom': {
                name: 'Floor 7 Bathroom',
                description: `The one sanctuary. The only place in the building where nobody can schedule a meeting with you. The <span class="item">MIRROR</span> shows someone you barely recognize.

A <span class="item">HAND DRYER</span> that sounds like a jet engine. <span class="item">STALLS</span> with motivational graffiti. Someone has written "THE HENDERSON REPORT IS A LIE" on the wall in Sharpie.

A <span class="item">WINDOW</span> is cracked open. Fresh air. Remember fresh air?`,
                exits: { west: 'cubicle-farm' },
                items: ['bathroom-mirror', 'hand-dryer', 'stalls', 'bathroom-graffiti', 'bathroom-window', 'soap-dispenser'],
                npcs: [],
                onEnter() {
                    // Bathroom is a rest area — restore some morale
                    if (state.morale < state.moraleMax) {
                        const heal = Math.min(5, state.moraleMax - state.morale);
                        state.morale += heal;
                        return `<p class="system">The brief solitude restores you. +${heal} Morale. This is what passes for self-care.</p>`;
                    }
                    return null;
                }
            },

            // =====================================================
            // FLOOR 6 — ABANDONED FLOOR
            // =====================================================
            'f6-hallway': {
                name: 'Dark Hallway (Floor 6)',
                description: `The elevator opens to darkness. Floor 6 has been abandoned since "the incident" in 2019. <span class="item">EMERGENCY LIGHTS</span> cast red shadows. The <span class="item">CARPET</span> is torn.

        function initStats() {
            if (!state.class) return;
            const base = CLASS_BASES[state.class];
            if (!base) return;
            state.hustle = base.hustle;
            state.optics = base.optics;
            state.synergy = base.synergy;
            state.networking = base.networking;
            state.efficiency = base.efficiency;
            state.morale = 100;
            state.moraleMax = 100;
            // Mage passive: +2 max coffee
            if (state.class === 'mage') state.coffeeMax = 5;
            else state.coffeeMax = 3;
        }

        function getEffectiveStats() {
            const s = {
                hustle: state.hustle,
                optics: state.optics,
                synergy: state.synergy,
                networking: state.networking,
                efficiency: state.efficiency,
            };
            // Add equipment bonuses
            for (const slot of Object.values(state.equipment)) {
                if (!slot) continue;
                const eqData = EQUIPMENT[slot];
                if (!eqData) continue;
                for (const [stat, val] of Object.entries(eqData.stats || {})) {
                    if (s[stat] !== undefined) s[stat] += val;
                }
                if (eqData.stats?.coffeeMax) state.coffeeMax += 0; // handled elsewhere
            }
            // Add status effect bonuses
            for (const eff of state.statusEffects) {
                const def = STATUS_EFFECTS[eff.id];
                if (!def) continue;
                for (const [stat, val] of Object.entries(def.stats || {})) {
                    if (s[stat] !== undefined) s[stat] += val;
                }
            }
            // Clamp to 1-20
            for (const k of Object.keys(s)) {
                s[k] = Math.max(1, Math.min(20, s[k]));
            }
            return s;
        }

        function getEffectiveCoffeeMax() {
            let max = state.coffeeMax;
            for (const slot of Object.values(state.equipment)) {
                if (!slot) continue;
                const eqData = EQUIPMENT[slot];
                if (eqData?.stats?.coffeeMax) max += eqData.stats.coffeeMax;
            }
            // Each level adds +1 max coffee
            max += state.level;
            return Math.min(10, max);
        }

        function tickStatusEffects() {
            const expired = [];
            state.statusEffects = state.statusEffects.filter(eff => {
                eff.turnsLeft--;
                if (eff.turnsLeft <= 0) {
                    expired.push(eff.id);
                    return false;
                }
                return true;
            });
            return expired.map(id => {
                const def = STATUS_EFFECTS[id];
                return `<span class="status-effect">${def?.name || id} has worn off.</span>`;
            }).join(' ');
        }

        function addStatusEffect(id, extraDuration) {
            const def = STATUS_EFFECTS[id];
            if (!def) return '';
            // Remove existing of same type
            state.statusEffects = state.statusEffects.filter(e => e.id !== id);
            state.statusEffects.push({ id, turnsLeft: def.duration + (extraDuration || 0) });
            return `<span class="status-effect">${def.name}: ${def.desc}</span>`;
        }

        function hasStatusEffect(id) {
            return state.statusEffects.some(e => e.id === id);
        }

        function assignClass() {
            const a = state.actions;
            if (a.includes('stole-lunch') || a.includes('took-stapler')) state.class = 'rogue';
            else if (a.includes('printer-violence')) state.class = 'fighter';
            else if (a.filter(x => x.startsWith('talked-')).length >= 3) state.class = 'bard';
            else if (a.includes('drank-coffee')) state.class = 'mage';
            else state.class = 'accountant';
            initStats();
        }

        // =====================================================
        // LEVELING / PP SYSTEM
        // =====================================================
        function gainPP(amount) {
            let mult = 1;
            if (state.class === 'accountant') mult = 1.15;
            if (state.class === 'rogue' && amount > 0) mult = 1.0; // rogue bonus handled per-source
            state.pp += Math.floor(amount * mult);
            const reviewUp = checkReview();
            return reviewUp;
        }

        function checkReview() {
            const nextLevel = state.level + 1;
            if (nextLevel > 12) return '';
            if (state.pp >= REVIEW_THRESHOLDS[nextLevel]) {
                state.level = nextLevel;
                state.moraleMax += 5;
                state.morale = Math.min(state.morale + 5, state.moraleMax);
                state.statPoints += 2;
                state.coffeeMax = Math.min(10, state.coffeeMax + 1);
                return `<p class="levelup">PERFORMANCE REVIEW Q${state.level}! +5 Max Morale, +1 Max Coffee, +2 stat points to distribute. Type "/levelup" to assign points.</p>`;
            }
            return '';
        }

        function doLevelUp(args) {
            if (state.statPoints <= 0) return '<p>No stat points to distribute. Work harder. Or smarter. Preferably both.</p>';
            if (!args) {
                return `<p>You have <span class="levelup">${state.statPoints}</span> stat points. Assign with: <span class="cmd">/levelup hustle</span>, <span class="cmd">/levelup optics</span>, <span class="cmd">/levelup synergy</span>, <span class="cmd">/levelup networking</span>, or <span class="cmd">/levelup efficiency</span>.</p>`;
            }
            const stat = args.toLowerCase().trim();
            const validStats = ['hustle', 'optics', 'synergy', 'networking', 'efficiency'];
            if (!validStats.includes(stat)) return `<p>Unknown stat "${stat}". Valid: ${validStats.join(', ')}.</p>`;
            if (state[stat] >= 20) return `<p>${stat} is already at maximum (20). You've peaked. Congratulations?</p>`;
            state[stat]++;
            state.statPoints--;
            return `<p class="levelup">+1 ${stat.charAt(0).toUpperCase() + stat.slice(1)}! Now ${state[stat]}. ${state.statPoints > 0 ? `${state.statPoints} points remaining.` : 'All points assigned.'}</p>`;
        }

        // =====================================================
        // COMBAT ENGINE
        // =====================================================
        function startCombat(enemyId) {
            const enemy = ENEMIES[enemyId];
            if (!enemy) return '<p class="error">Unknown enemy.</p>';
            state.mode = 'combat';
            state.combat = {
                enemyId,
                enemyHp: enemy.hp,
                enemyMaxHp: enemy.hp,
                turn: 0,
                fled: false,
                resolved: false,
                enemyEffects: [], // status effects on enemy
                playerFirst: getEffectiveStats().efficiency >= (enemy.spd || 5),
            };
            let text = `<div class="combat-box">`;
            text += `<p><span class="enemy-name">${enemy.name}</span> appears!</p>`;
            text += `<p>${enemy.desc}</p>`;
            text += `<p>HP: ${enemy.hp}/${enemy.hp} | ATK: ${enemy.atk} | DEF: ${enemy.def}</p>`;
            text += `<div class="combat-options">Commands: <span class="cmd">attack</span>, <span class="cmd">skill [name]</span>, <span class="cmd">cast [spell]</span>, <span class="cmd">use [item]</span>, <span class="cmd">talk</span>, <span class="cmd">flee</span></div>`;
            text += `</div>`;
            return text;
        }

        function combatRound(action, args) {
            if (!state.combat) { state.mode = 'explore'; return '<p>No combat active.</p>'; }
            const c = state.combat;
            const enemy = ENEMIES[c.enemyId];
            if (!enemy) { state.mode = 'explore'; return '<p class="error">Enemy data missing.</p>'; }
            const stats = getEffectiveStats();
            let text = '';
            c.turn++;

            // Player action
            let playerDamage = 0;
            let skipEnemyTurn = false;

            if (action === 'attack') {
                const weaponBonus = state.equipment.weapon ? (EQUIPMENT[state.equipment.weapon]?.stats?.hustle || 0) : 0;
                const base = 3 + stats.hustle + weaponBonus;
                const dmg = Math.max(1, Math.floor(base * (0.8 + Math.random() * 0.4) - (enemy.def * 0.5)));
                c.enemyHp -= dmg;
                text += `<p>You attack! <span class="combat-damage">${dmg} damage</span> to ${enemy.name}.</p>`;
            } else if (action === 'talk') {
                const dc = enemy.talkDC || 15;
                const roll = stats.networking + Math.floor(Math.random() * 10) + 1;
                const bardBonus = state.class === 'bard' ? 2 : 0;
                if (roll + bardBonus >= dc) {
                    c.resolved = true;
                    text += `<p class="combat-info">${enemy.talkSuccess}</p>`;
                    text += endCombat(true);
                    return text;
                } else {
                    text += `<p>You try to reason with ${enemy.name}. Networking check: ${roll + bardBonus} vs ${dc}. Failed.</p>`;
                    text += `<p>"${['No.', 'That\'s not going to work.', 'Nice try.', 'Per my previous attack...'][Math.floor(Math.random() * 4)]}"</p>`;
                }
            } else if (action === 'flee') {
                const dc = 8 + (enemy.spd || 5);
                const roll = stats.efficiency + Math.floor(Math.random() * 10) + 1;
                if (roll >= dc) {
                    c.fled = true;
                    text += `<p>You flee! Efficiency check: ${roll} vs ${dc}. You escape like a promoted coward.</p>`;
                    state.mode = 'explore';
                    state.combat = null;
                    return text;
                } else {
                    text += `<p>You try to flee! Efficiency check: ${roll} vs ${dc}. Blocked! ${enemy.name} won't let you leave the meeting.</p>`;
                }
            } else if (action === 'use') {
                if (args === 'coffee' || args === 'coffee-machine') {
                    if (state.coffee > 0) {
                        state.coffee--;
                        const heal = 15 + stats.synergy;
                        state.morale = Math.min(state.moraleMax, state.morale + heal);
                        text += `<p>You chug coffee. <span class="combat-heal">+${heal} Morale</span>. ${state.coffee} coffee remaining.</p>`;
                    } else {
                        text += `<p>No coffee left. You're running on empty. Like always.</p>`;
                    }
                } else {
                    text += `<p>You can't use that in combat. Try: attack, talk, flee, use coffee, skill [name], cast [spell].</p>`;
                    c.turn--;
                    return text;
                }
            } else if (action === 'skill') {
                const result = useClassAbility(args, enemy, c, stats);
                if (result.error) { c.turn--; return result.text; }
                text += result.text;
                playerDamage = result.damage || 0;
                if (result.skipEnemy) skipEnemyTurn = true;
                if (result.endCombat) { text += endCombat(true); return text; }
                c.enemyHp -= playerDamage;
            } else if (action === 'cast') {
                const result = combatCast(args, enemy, c, stats);
                if (result.error) { c.turn--; return result.text; }
                text += result.text;
                c.enemyHp -= (result.damage || 0);
                if (result.endCombat) { text += endCombat(true); return text; }
            } else {
                text += `<p>Unknown combat action. Try: <span class="cmd">attack</span>, <span class="cmd">talk</span>, <span class="cmd">flee</span>, <span class="cmd">use [item]</span>, <span class="cmd">skill [name]</span>, <span class="cmd">cast [spell]</span>.</p>`;
                c.turn--;
                return text;
            }

            // Check enemy death
            if (c.enemyHp <= 0) {
                text += `<p><span class="combat-damage">${enemy.name} is defeated!</span></p>`;
                text += endCombat(true);
                return text;
            }

            // Enemy turn
            if (!skipEnemyTurn) {
                const atkNames = enemy.attacks || ['Attack'];
                const atkName = atkNames[Math.floor(Math.random() * atkNames.length)];
                const eDmg = Math.max(1, Math.floor((enemy.atk + Math.random() * 4) * (0.8 + Math.random() * 0.4) - stats.optics * 0.3));
                state.morale -= eDmg;
                text += `<p>${enemy.name} uses <span class="combat-damage">${atkName}</span>! <span class="combat-damage">${eDmg} damage</span> to you.</p>`;
            }

            // Check player death
            if (state.morale <= 0) {
                state.morale = 0;
                text += endCombat(false);
                return text;
            }

            // Status display
            text += `<p class="combat-info">You: ${state.morale}/${state.moraleMax} MRL | ${enemy.name}: ${c.enemyHp}/${c.enemyMaxHp} HP</p>`;
            return text;
        }

        function endCombat(won) {
            const c = state.combat;
            const enemy = ENEMIES[c?.enemyId];
            let text = '';

            if (won) {
                const pp = enemy?.pp || 10;
                const reviewText = gainPP(pp);
                text += `<p class="combat-info">+${pp} Performance Points!</p>`;
                if (reviewText) text += reviewText;
                // Loot
                if (enemy?.loot) {
                    for (const lootId of enemy.loot) {
                        if (!state.inventory.includes(lootId) && EQUIPMENT[lootId]) {
                            state.inventory.push(lootId);
                            text += `<p class="item">Loot: ${EQUIPMENT[lootId].name}!</p>`;
                        }
                    }
                }
                // Mark boss as defeated
                if (enemy?.boss) {
                    state.flags[`boss_${c.enemyId}_defeated`] = true;
                }
            } else {
                text += `<p class="error">Your Morale hits 0. You have a breakdown.</p>`;
                text += `<p>You come to in the break room. Someone made you coffee. The fluorescent lights hum a lullaby.</p>`;
                state.morale = Math.floor(state.moraleMax * 0.5);
                state.coffee = Math.min(state.coffee + 1, getEffectiveCoffeeMax());
                const ppLoss = Math.floor(state.pp * 0.2);
                state.pp = Math.max(0, state.pp - ppLoss);
                if (ppLoss > 0) text += `<p class="error">-${ppLoss} Performance Points lost.</p>`;
                state.currentRoom = 'break-room';
            }

            state.mode = 'explore';
            state.combat = null;
            return text;
        }

        function useClassAbility(abilityName, enemy, combat, stats) {
            if (!state.class) return { error: true, text: '<p>You have no class. Literally. Find the spellbook first.</p>' };
            const abilities = CLASS_ABILITIES[state.class] || [];
            const ability = abilities.find(a => a.name.toLowerCase() === (abilityName || '').toLowerCase());
            if (!ability) {
                const available = abilities.filter(a => state.level >= a.level).map(a => a.name).join(', ');
                return { error: true, text: `<p>Unknown skill. Available: ${available || 'none yet (level up!)'}</p>` };
            }
            if (state.level < ability.level) return { error: true, text: `<p>${ability.name} unlocks at Q${ability.level}. You're Q${state.level}.</p>` };
            if (state.coffee < ability.cost) return { error: true, text: `<p>${ability.name} costs ${ability.cost} coffee. You have ${state.coffee}.</p>` };
            state.coffee -= ability.cost;

            let text = '', damage = 0, skipEnemy = false, endCombat = false;

            // Class-specific ability effects
            switch (ability.name) {
                case 'Pilfer':
                    text = `<p class="magic">You pilfer from ${enemy.name}!</p>`;
                    if (enemy.loot?.length) {
                        const stolen = enemy.loot[0];
                        if (!state.inventory.includes(stolen)) { state.inventory.push(stolen); text += `<p class="item">Stole: ${EQUIPMENT[stolen]?.name || stolen}!</p>`; }
                        else text += `<p>Nothing worth stealing.</p>`;
                    } else text += `<p>Nothing to steal. What did you expect from a ${enemy.name}?</p>`;
                    break;
                case 'Sneak Attack':
                    damage = Math.floor((3 + stats.hustle + stats.efficiency) * (combat.turn <= 1 ? 3 : 2));
                    text = `<p class="magic">Sneak Attack! <span class="combat-damage">${damage} damage</span>!</p>`;
                    break;
                case 'Embezzle':
                    damage = Math.floor(combat.enemyHp * 0.2);
                    const ppGain = Math.floor(damage * 0.5);
                    state.pp += ppGain;
                    text = `<p class="magic">Embezzle! Siphon <span class="combat-damage">${damage} HP</span> into <span class="levelup">${ppGain} PP</span>!</p>`;
                    break;
                case 'Percussive Maintenance':
                    damage = Math.floor((3 + stats.hustle) * 1.5);
                    text = `<p class="magic">Percussive Maintenance! You hit it really hard. <span class="combat-damage">${damage} damage</span>!</p>`;
                    break;
                case 'Intimidate':
                    combat.enemyEffects.push({ name: 'intimidated', turnsLeft: 3 });
                    text = `<p class="magic">You stare down ${enemy.name}. It flinches. Attack halved for 3 turns.</p>`;
                    break;
                case 'Rage Quit':
                    damage = Math.floor((3 + stats.hustle) * 2.5);
                    state.optics = Math.max(1, state.optics - 2);
                    text = `<p class="magic">RAGE QUIT! <span class="combat-damage">${damage} damage</span>! (-2 Optics for this fight. Worth it.)</p>`;
                    break;
                case 'Water Cooler Talk':
                    const heal = 15 + Math.floor(stats.networking * 0.5);
                    state.morale = Math.min(state.moraleMax, state.morale + heal);
                    text = `<p class="magic">You complain about the weather. <span class="combat-heal">+${heal} Morale</span>. Therapeutic.</p>`;
                    break;
                case 'Passive-Aggressive Note':
                    combat.enemyEffects.push({ name: 'micromanaged', turnsLeft: 3 });
                    text = `<p class="magic">You leave a note. "As per my previous request..." ${enemy.name}'s stats drop for 3 turns.</p>`;
                    break;
                case 'Motivational Speech':
                    addStatusEffect('synergized');
                    text = `<p class="magic">"Team, we've got this!" +2 all stats for 3 turns. You almost believe it.</p>`;
                    break;
                case 'Overcaffeinate':
                    if (state.coffee < 1) { state.coffee += ability.cost; return { error: true, text: '<p>Need at least 1 extra coffee to overcaffeinate.</p>' }; }
                    state.coffee--;
                    damage = Math.floor((3 + stats.synergy) * 1.8);
                    text = `<p class="magic">Overcaffeinated blast! <span class="combat-damage">${damage} damage</span>! Your hands won't stop shaking.</p>`;
                    break;
                case 'Mana Brew':
                    state.morale -= 10;
                    state.coffee = Math.min(getEffectiveCoffeeMax(), state.coffee + 2);
                    text = `<p class="magic">You convert life force into caffeine. -10 Morale, +2 Coffee. The exchange rate is terrible.</p>`;
                    break;
                case 'Arcane Spreadsheet':
                    damage = stats.synergy * 3;
                    text = `<p class="magic">The spreadsheet unfolds in the air. Numbers become weapons. <span class="combat-damage">${damage} damage</span>!</p>`;
                    break;
                case 'Depreciate':
                    combat.enemyEffects.push({ name: 'depreciating', turnsLeft: 99 });
                    text = `<p class="magic">You begin depreciating ${enemy.name}'s assets. It will get worse. Every. Single. Turn.</p>`;
                    break;
                case 'Itemize Deductions':
                    const healAmt = state.inventory.length * 5;
                    state.morale = Math.min(state.moraleMax, state.morale + healAmt);
                    text = `<p class="magic">You itemize ${state.inventory.length} items. <span class="combat-heal">+${healAmt} Morale</span>. Hoarding pays off.</p>`;
                    break;
                case 'Audit of Doom':
                    if (combat.enemyHp <= combat.enemyMaxHp * 0.33) {
                        combat.enemyHp = 0;
                        text = `<p class="magic">AUDIT OF DOOM! The paperwork is lethal. ${enemy.name} is instantly filed away.</p>`;
                    } else {
                        text = `<p class="magic">Audit of Doom fizzles — enemy must be below 33% HP. Currently at ${Math.floor(combat.enemyHp / combat.enemyMaxHp * 100)}%.</p>`;
                        state.coffee += ability.cost; // refund
                    }
                    break;
                default:
                    return { error: true, text: `<p>Ability "${ability.name}" not yet implemented.</p>` };
            }
            return { text, damage, skipEnemy, endCombat: combat.enemyHp - damage <= 0 && damage > 0 };
        }

        function combatCast(spellName, enemy, combat, stats) {
            if (!state.flags.magicDiscovered) return { error: true, text: '<p>You don\'t know any spells yet.</p>' };
            if (!state.inventory.includes('spellbook')) return { error: true, text: '<p>You need the spellbook.</p>' };
            const spell = (spellName || '').toLowerCase();

            switch (spell) {
                case 'synergize':
                    if (state.coffee < 1) return { error: true, text: '<p>Synergize costs 1 coffee.</p>' };
                    state.coffee--;
                    addStatusEffect('synergized');
                    return { text: `<p class="magic">SYNERGIZE! +2 to all stats for 3 turns. Nobody knows why this works.</p>`, damage: 0 };
                case 'reply-all':
                    if (state.coffee < 2) return { error: true, text: '<p>Reply-All costs 2 coffee.</p>' };
                    state.coffee -= 2;
                    const dmg = Math.floor(stats.synergy * 1.5 + 5);
                    return { text: `<p class="magic">REPLY-ALL! A devastating wave of unnecessary emails. <span class="combat-damage">${dmg} damage</span>!</p>`, damage: dmg };
                case 'audit':
                    if (state.coffee < 1) return { error: true, text: '<p>Audit costs 1 coffee.</p>' };
                    state.coffee--;
                    return { text: `<p class="magic">AUDIT reveals: ${enemy.name} — HP: ${combat.enemyHp}/${combat.enemyMaxHp}, ATK: ${enemy.atk}, DEF: ${enemy.def}, SPD: ${enemy.spd}. Talk DC: ${enemy.talkDC}.</p>`, damage: 0 };
                case 'downsizing':
                    if (state.coffee < 2) return { error: true, text: '<p>Downsizing costs 2 coffee.</p>' };
                    if (combat.enemyHp > combat.enemyMaxHp * 0.25) {
                        state.coffee -= 2;
                        return { text: `<p class="magic">DOWNSIZING fizzles. Target must be below 25% HP.</p>`, damage: 0 };
                    }
                    state.coffee -= 2;
                    combat.enemyHp = 0;
                    return { text: `<p class="magic">DOWNSIZING! "Your position has been eliminated." ${enemy.name} ceases to exist.</p>`, damage: 0, endCombat: true };
                case 'mandatory-fun':
                    if (state.coffee < 2) return { error: true, text: '<p>Mandatory Fun costs 2 coffee.</p>' };
                    state.coffee -= 2;
                    combat.enemyEffects.push({ name: 'stunned', turnsLeft: 2 });
                    return { text: `<p class="magic">MANDATORY FUN! ${enemy.name} is forced to attend a team-building exercise. Stunned for 2 turns!</p>`, damage: 0 };
                case 'expedite':
                    if (state.coffee < 1) return { error: true, text: '<p>Expedite costs 1 coffee.</p>' };
                    state.coffee--;
                    return { text: `<p class="magic">EXPEDITE! You act with supernatural speed.</p>`, damage: 0, skipEnemy: true };
                case 'restructure':
                    if (state.coffee < 2) return { error: true, text: '<p>Restructure costs 2 coffee.</p>' };
                    state.coffee -= 2;
                    const origHp = combat.enemyHp;
                    combat.enemyHp = Math.floor(Math.random() * combat.enemyMaxHp);
                    return { text: `<p class="magic">RESTRUCTURE! Reality reshuffles. ${enemy.name}'s HP: ${origHp} → ${combat.enemyHp}. Chaotic.</p>`, damage: 0 };
                case 'golden-parachute':
                    if (state.coffee < 3) return { error: true, text: '<p>Golden Parachute costs 3 coffee.</p>' };
                    state.coffee -= 3;
                    state.morale = state.moraleMax;
                    state.hustle = Math.max(1, Math.floor(state.hustle / 2));
                    return { text: `<p class="magic">GOLDEN PARACHUTE! Full Morale restore. But your Hustle is halved — you've gotten comfortable.</p>`, damage: 0 };
                default:
                    return { error: true, text: `<p>Unknown combat spell. Try: synergize, reply-all, audit, downsizing, mandatory-fun, expedite, restructure, golden-parachute.</p>` };
            }
        }

        // =====================================================
        // QUEST ENGINE
        // =====================================================
        function startQuest(questId) {
            if (state.quests[questId]) return '';
            const q = QUESTS[questId];
            if (!q) return '';
            state.quests[questId] = { active: true, step: 0, completed: false, failed: false };
            return `<p class="quest-update">Quest started: ${q.name}</p><p class="system">${q.desc}</p>`;
        }

        function advanceQuest(questId) {
            const qs = state.quests[questId];
            if (!qs || qs.completed) return '';
            const q = QUESTS[questId];
            qs.step++;
            if (qs.step >= q.steps.length) {
                return completeQuest(questId);
            }
            return `<p class="quest-update">Quest updated: ${q.name} — ${q.steps[qs.step]}</p>`;
        }

        function completeQuest(questId) {
            const qs = state.quests[questId];
            if (!qs) return '';
            const q = QUESTS[questId];
            qs.completed = true;
            qs.active = false;
            let text = `<p class="quest-update">Quest completed: ${q.name}!</p>`;
            if (q.rewards) {
                if (q.rewards.pp) text += gainPP(q.rewards.pp);
                if (q.rewards.item && !state.inventory.includes(q.rewards.item)) {
                    state.inventory.push(q.rewards.item);
                    const eq = EQUIPMENT[q.rewards.item];
                    const it = ITEMS[q.rewards.item];
                    text += `<p class="item">Reward: ${eq?.name || it?.name || q.rewards.item}!</p>`;
                }
            }
            return text;
        }

        function getQuestStep(questId) {
            return state.quests[questId]?.step || 0;
        }

        function isQuestActive(questId) {
            const qs = state.quests[questId];
            return qs?.active && !qs?.completed;
        }

        function isQuestComplete(questId) {
            return state.quests[questId]?.completed || false;
        }

        function doQuests() {
            const active = Object.entries(state.quests).filter(([_, qs]) => qs.active && !qs.completed);
            const completed = Object.entries(state.quests).filter(([_, qs]) => qs.completed);
            if (!active.length && !completed.length) return '<p>No quests yet. Talk to people. They\'re suffering too. They need help.</p>';
            let text = '<p class="room-title">QUEST JOURNAL</p>';
            if (active.length) {
                text += '<p><strong>Active:</strong></p>';
                for (const [id, qs] of active) {
                    const q = QUESTS[id];
                    text += `<p>• <span class="item">${q.name}</span>${q.main ? ' [MAIN]' : ''} — ${q.steps[qs.step] || 'In progress'}</p>`;
                }
            }
            if (completed.length) {
                text += '<p><strong>Completed:</strong></p>';
                for (const [id] of completed) {
                    const q = QUESTS[id];
                    text += `<p class="system">• ${q.name} ✓</p>`;
                }
            }
            return text;
        }

        // =====================================================
        // EQUIP / STATS COMMANDS
        // =====================================================
        function doEquip(args) {
            if (!args) return '<p>Equip what? Check <span class="cmd">/inv</span> for equipment, or <span class="cmd">/stats</span> to see current gear.</p>';
            const q = args.toLowerCase().replace(/^(the|a|an)\s+/, '').trim();
            // Find in inventory
            let foundId = null;
            for (const id of state.inventory) {
                const eq = EQUIPMENT[id];
                if (eq && (id.includes(q) || eq.name.toLowerCase().includes(q))) { foundId = id; break; }
            }
            if (!foundId) return `<p>You don't have "${args}" to equip, or it's not equipment.</p>`;
            const eq = EQUIPMENT[foundId];
            const slot = eq.slot;
            // Unequip current
            let text = '';
            if (state.equipment[slot]) {
                text += `<p>Unequipped ${EQUIPMENT[state.equipment[slot]]?.name || state.equipment[slot]}.</p>`;
            }
            state.equipment[slot] = foundId;
            text += `<p>Equipped <span class="item">${eq.name}</span> (${slot}). ${eq.desc}</p>`;
            return text;
        }

        function doUnequip(args) {
            if (!args) return '<p>Unequip what slot? weapon, armor, accessory, badge.</p>';
            const slot = args.toLowerCase().trim();
            if (!['weapon', 'armor', 'accessory', 'badge'].includes(slot)) {
                // Try to match by item name
                for (const [s, id] of Object.entries(state.equipment)) {
                    if (id && (id.includes(slot) || (EQUIPMENT[id]?.name || '').toLowerCase().includes(slot))) {
                        const eq = EQUIPMENT[id];
                        state.equipment[s] = null;
                        return `<p>Unequipped ${eq?.name || id} from ${s}.</p>`;
                    }
                }
                return `<p>Unknown slot or item. Slots: weapon, armor, accessory, badge.</p>`;
            }
            if (!state.equipment[slot]) return `<p>Nothing equipped in ${slot}.</p>`;
            const eq = EQUIPMENT[state.equipment[slot]];
            state.equipment[slot] = null;
            return `<p>Unequipped ${eq?.name || 'item'} from ${slot}.</p>`;
        }

        function doStats() {
            const s = getEffectiveStats();
            const maxCof = getEffectiveCoffeeMax();
            let text = `<p class="room-title">CHARACTER SHEET</p>`;
            if (state.class) {
                text += `<p>Class: <span class="magic">${state.class.toUpperCase()}</span> | Level: Q${state.level} | PP: ${state.pp}/${REVIEW_THRESHOLDS[Math.min(state.level + 1, 12)] || 'MAX'}</p>`;
                const passive = CLASS_PASSIVES[state.class];
                if (passive) text += `<p class="system">Passive: ${passive.name} — ${passive.desc}</p>`;
            } else {
                text += `<p>Class: Unassigned (find the spellbook)</p>`;
            }
            text += `<p>Morale: <span class="combat-damage">${state.morale}/${state.moraleMax}</span> | Coffee: <span class="item">${state.coffee}/${maxCof}</span></p>`;
            text += `<p>Hustle: ${s.hustle} | Optics: ${s.optics} | Synergy: ${s.synergy} | Networking: ${s.networking} | Efficiency: ${s.efficiency}</p>`;
            if (state.statPoints > 0) text += `<p class="levelup">${state.statPoints} unspent stat points! Use /levelup [stat]</p>`;
            // Equipment
            text += `<p><strong>Equipment:</strong></p>`;
            for (const [slot, id] of Object.entries(state.equipment)) {
                const eq = id ? EQUIPMENT[id] : null;
                text += `<p>  ${slot.charAt(0).toUpperCase() + slot.slice(1)}: ${eq ? `<span class="item">${eq.name}</span>` : '<span class="system">empty</span>'}</p>`;
            }
            // Status effects
            if (state.statusEffects.length) {
                text += `<p><strong>Status:</strong> ${state.statusEffects.map(e => {
                    const def = STATUS_EFFECTS[e.id];
                    return `<span class="status-effect">${def?.name || e.id} (${e.turnsLeft}t)</span>`;
                }).join(', ')}</p>`;
            }
            // Abilities
            if (state.class) {
                const abilities = CLASS_ABILITIES[state.class] || [];
                const available = abilities.filter(a => state.level >= a.level);
                const locked = abilities.filter(a => state.level < a.level);
                if (available.length) {
                    text += `<p><strong>Abilities:</strong></p>`;
                    for (const a of available) text += `<p>  <span class="cmd">${a.name}</span> (${a.cost} coffee) — ${a.desc}</p>`;
                }
                if (locked.length) {
                    text += `<p class="system">Locked: ${locked.map(a => `${a.name} (Q${a.level})`).join(', ')}</p>`;
                }
            }
            return text;
        }

        // =====================================================
        // SAVE SYSTEM
        // =====================================================
        function saveGame() {
            try {
                const saveData = JSON.parse(JSON.stringify(state));
                localStorage.setItem('officeHell_save', JSON.stringify(saveData));
                // Save discovered endings separately (persists across playthroughs)
                localStorage.setItem('officeHell_endings', JSON.stringify(state.discoveredEndings));
                return true;
            } catch (e) { return false; }
        }

        function loadGame() {
            try {
                const data = localStorage.getItem('officeHell_save');
                if (!data) return false;
                const saved = JSON.parse(data);
                // Merge with defaults to handle new fields
                const defaults = makeDefaultState();
                state = { ...defaults, ...saved };
                // Restore discovered endings from separate storage
                const endings = localStorage.getItem('officeHell_endings');
                if (endings) state.discoveredEndings = JSON.parse(endings);
                return true;
            } catch (e) { return false; }
        }

        function clearSave() {
            localStorage.removeItem('officeHell_save');
            // Don't clear endings — they persist
        }

        // Auto-save on room change
        function autoSave() {
            saveGame();
        }

        // =====================================================
        // PARSER
        // =====================================================
        const ALIASES = {
            'l': 'look', 'look': 'look', 'examine': 'look', 'x': 'look', 'ex': 'look', 'inspect': 'look', 'check': 'look', 'describe': 'look',
            'go': 'go', 'move': 'go', 'walk': 'go', 'enter': 'go', 'head': 'go',
            'n': 'go north', 's': 'go south', 'e': 'go east', 'w': 'go west',
            'north': 'go north', 'south': 'go south', 'east': 'go east', 'west': 'go west',

            'use': 'use', 'activate': 'use', 'open': 'use', 'operate': 'use',
            'talk': 'talk', 'speak': 'talk', 'chat': 'talk', 'greet': 'talk', 'say': 'talk',
            'ask': 'ask',
            'inv': 'inventory', 'inventory': 'inventory', 'i': 'inventory', 'items': 'inventory',
            'help': 'help', 'commands': 'help', '?': 'help',
            'cast': 'cast', 'magic': 'cast', 'spell': 'cast',

            'read': 'read', 'peruse': 'read',
            'write': 'write', 'compose': 'write',
            'drop': 'drop', 'discard': 'drop',

        };

        function parse(input) {
            input = input.trim().toLowerCase();
            if (input.startsWith('/')) input = input.slice(1);

            // Combat mode: intercept all input
            if (state.mode === 'combat') {
                let parts = input.split(/\s+/);
                let cmd = parts[0];
                let args = parts.slice(1).join(' ');
                // Map combat aliases
                if (['hit', 'strike', 'punch', 'kick', 'attack', 'a'].includes(cmd)) return { cmd: 'combat', action: 'attack', args };
                if (['talk', 'negotiate', 'reason', 'persuade', 'diplomacy'].includes(cmd)) return { cmd: 'combat', action: 'talk', args };
                if (['flee', 'run', 'escape', 'retreat'].includes(cmd)) return { cmd: 'combat', action: 'flee', args };
                if (['use', 'drink'].includes(cmd)) return { cmd: 'combat', action: 'use', args };
                if (['skill', 'ability'].includes(cmd)) return { cmd: 'combat', action: 'skill', args };
                if (['cast', 'spell', 'magic'].includes(cmd)) return { cmd: 'combat', action: 'cast', args };
                if (['look', 'l', 'x', 'examine'].includes(cmd)) return { cmd: 'combat', action: 'look', args };
                if (['inv', 'inventory', 'i'].includes(cmd)) return { cmd: 'inventory', args: '' };
                if (['stats'].includes(cmd)) return { cmd: 'stats', args: '' };
                // Default: treat as attack
                return { cmd: 'combat', action: 'attack', args: input };
            }

            // Elevator mode: floor selection
            if (state.mode === 'elevator') {
                return { cmd: 'elevator-select', args: input };
            }

            // Level up mode
            if (state.mode === 'levelup') {
                return { cmd: 'levelup', args: input };
            }

            let parts = input.split(/\s+/);
            let cmd = parts[0];
            let args = parts.slice(1).join(' ');

            // Handle "ask [npc] about [topic]"
            if (cmd === 'ask' && args.includes(' about ')) {
                const [npcPart, ...topicParts] = args.split(' about ');
                return { cmd: 'ask', args: npcPart.trim(), topic: topicParts.join(' about ').trim() };
            }

            // Check snarky handlers first
            if (SNARKY[cmd]) return { cmd: 'snarky', verb: cmd, args };

            // Check aliases
            if (ALIASES[cmd]) {
                let expanded = ALIASES[cmd];
                if (expanded.includes(' ')) {
                    let [newCmd, ...rest] = expanded.split(' ');
                    cmd = newCmd;
                    args = rest.join(' ') + (args ? ' ' + args : '');
                } else {
                    cmd = expanded;
                }
            }
            return { cmd, args };
        }

        // =====================================================
        // COMMAND HANDLERS
        // =====================================================
        function findItem(query, room) {
            const q = query.toLowerCase().replace(/^(the|a|an)\s+/, '').trim();
            const roomData = ROOMS[room || state.currentRoom];
            const roomItems = typeof roomData.items === 'function' ? roomData.items() : roomData.items;

            // Check room items
            for (const id of roomItems || []) {
                const item = ITEMS[id];
                if (item && (id.includes(q) || item.name.toLowerCase().includes(q))) return { id, item };
            }
            // Check inventory
            for (const id of state.inventory) {
                const item = ITEMS[id];
                if (item && (id.includes(q) || item.name.toLowerCase().includes(q))) return { id, item };
            }
            return null;
        }

        function findNpc(query, room) {
            const q = query.toLowerCase().replace(/^(the|a|an|to)\s+/, '').trim();
            const roomData = ROOMS[room || state.currentRoom];
            for (const id of roomData.npcs || []) {
                const npc = NPCS[id];
                if (npc && (id.includes(q) || npc.name.toLowerCase().includes(q))) return { id, npc };
            }
            return null;
        }

        function doLook(args) {
            const room = ROOMS[state.currentRoom];
            if (!args) {
                let text = `<p class="room-title">${room.name}</p>`;
                text += `<p>${typeof room.description === 'function' ? room.description() : room.description}</p>`;
                const exits = Object.keys(room.exits || {});
                if (exits.length) text += `<p>Exits: ${exits.map(e => `<span class="exit">${e.toUpperCase()}</span>`).join(', ')}</p>`;
                return text;
            }
            const found = findItem(args) || findNpc(args);
            if (found) {
                const desc = typeof (found.item || found.npc).description === 'function'
                    ? (found.item || found.npc).description()
                    : (found.item || found.npc).description;
                return `<p>${desc}</p>`;
            }
            return `<p>You don't see "${args}" here. Not everything is interactive. But you tried, and that's what counts. (It's not. But still.)</p>`;
        }

        function doGo(args) {
            if (!args) return `<p>Go where? Be specific. Unlike your career path.</p>`;
            const room = ROOMS[state.currentRoom];
            const dir = args.toLowerCase();
            const exitDir = Object.keys(room.exits || {}).find(e => e.startsWith(dir) || dir.includes(e));

            if (dir === 'server' || dir === 'dragon') {
                if (state.flags.serverRoomHinted) {
                    state.currentRoom = 'server-room';
                    autoSave();
                    let text = doLook('');
                    const enc = checkRandomEncounter();
                    if (enc) text += '<hr>' + enc;

                return `<p>You don't know where the server room is. Maybe someone in IT could help.</p>`;

            if (!exitDir) return `<p>You can't go "${args}" from here. Walls are real. More real than synergy, anyway.</p>`;

            const nextId = room.exits[exitDir];
            const nextRoom = ROOMS[nextId];
            if (nextRoom.locked) {
                const enterText = nextRoom.onEnter?.();
                if (enterText) return enterText;
                return `<p>That way is blocked. Probably by bureaucracy.</p>`;
            }
            state.currentRoom = nextId;
            autoSave();
            let text = '';
            const enterText = nextRoom.onEnter?.();
            if (enterText) text += enterText;
            text += doLook('');
            // Random encounters on dangerous floors
            const enc = checkRandomEncounter();
            if (enc) text += '<hr>' + enc;

You sit down at your desk. The fluorescent lights hum their lullaby. The carpet remembers every step.

You're still here. You'll always be here. The building has won. Not through malice, but through inertia. The most powerful force in corporate America.

You open your email. 347 unread. You start typing a reply.

This is fine.`);

        function doTake(args) {
