"DEFENESTRATE."

Greg exits through the window. Wilhelm scream. Distant splash into the dumpster full of shredded TPS reports.

You are now Regional Manager of Synergy. You still don't know what that means. But you're free from Greg.`);
            }
            if (spell === 'synergize') {
                if (state.coffee < 1) return `<p class="magic">Synergize costs 1 coffee. You have ${state.coffee}.</p>`;
                state.coffee--;
                const eff = addStatusEffect('synergized');
                return `<p class="magic">You cast SYNERGIZE! +2 to all stats for 3 turns. ${eff}</p>`;
            }
            if (spell === 'expedite') {
                if (state.coffee < 1) return `<p class="magic">Expedite costs 1 coffee.</p>`;
                state.coffee--;
                return `<p class="magic">EXPEDITE! Bureaucratic processes accelerate around you. Time bends. The next interaction goes faster.</p>`;
            }
            if (spell === 'reply-all') {
                if (state.coffee < 2) return `<p class="magic">Reply-All costs 2 coffee.</p>`;
                state.coffee -= 2;
                return `<p class="magic">REPLY-ALL! A wave of unnecessary emails blasts outward. Everyone in a 30-foot radius checks their phone. Use in combat for damage.</p>`;
            }
            if (spell === 'audit') {
                if (state.coffee < 1) return `<p class="magic">Audit costs 1 coffee.</p>`;
                state.coffee--;
                const room = ROOMS[state.currentRoom];
                return `<p class="magic">AUDIT reveals: Room "${room.name}" — ${(room.items?.length || 0)} items, ${(room.npcs?.length || 0)} NPCs, exits: ${Object.keys(room.exits || {}).join(', ')}. Best used in combat to reveal enemy stats.</p>`;
            }
            if (spell === 'golden-parachute') {
                if (state.coffee < 3) return `<p class="magic">Golden Parachute costs 3 coffee.</p>`;
                state.coffee -= 3;
                state.morale = state.moraleMax;
                state.hustle = Math.max(1, Math.floor(state.hustle / 2));
                return `<p class="magic">GOLDEN PARACHUTE! Full Morale restore. But Hustle halved — you've gotten too comfortable.</p>`;
            }
            if (!spell) {
                return `<p>Available spells: <span class="cmd">TELEPORT</span> (3☕ — escape the building), <span class="cmd">DEFENESTRATE</span> (window+target), <span class="cmd">SYNERGIZE</span> (1☕ — +2 all stats), <span class="cmd">EXPEDITE</span> (1☕ — speed), <span class="cmd">REPLY-ALL</span> (2☕ — AoE in combat), <span class="cmd">AUDIT</span> (1☕ — reveal info), <span class="cmd">DOWNSIZING</span> (2☕ — execute <25%), <span class="cmd">MANDATORY-FUN</span> (2☕ — stun in combat), <span class="cmd">RESTRUCTURE</span> (2☕ — randomize in combat), <span class="cmd">GOLDEN-PARACHUTE</span> (3☕ — full heal, halve Hustle).</p>`;
            }
            return `<p>Unknown spell "${spell}". Cast without arguments to see available spells.</p>`;
        }

        function doResign() {
            if (!state.inventory.includes('pen') || !state.inventory.includes('paper')) {
                return `<p>You need <span class="item">PEN</span> and <span class="item">PAPER</span>. Quitting requires documentation. This is corporate hell, not anarchy.</p>`;
            }
            if (!state.flags.hasCourage) {
                return `<p>You have pen. Paper. But not the <span class="item">COURAGE</span>. Something holds you back. Maybe you need liquid assistance.</p>`;
            }
            return triggerEnding('resignation', `You write the letter. Three years of frustration flow through the pen.

"Dear Greg. I quit."

That's all it says. That's all it needs to say.

You walk to Greg's office. Place the letter on his desk. He looks up, confused.

"But... synergy?"

"No more synergy, Greg. Not for me."

The elevator opens immediately. For the first time in history. You step inside. The doors close.

You did it. You quit. With proper documentation. HR would be proud.`);
        }

        function doRead(args) { return doLook(args); }
        function doDrop(args) { return `<p>You can't drop ${args || 'things'}. What if you need them? What if that's the one item that saves you?</p>`; }

        // =====================================================
        // ENDING TRIGGERS
        // =====================================================
        function doSign(args) {
            // Henderson Binding — sign the report, become the building
            if (state.currentRoom === 'b2-synergy-font' && state.flags['boss_the-synergy-font_defeated']) {
                if (state.inventory.includes('f10-ceo-pen') || state.inventory.includes('pen')) {
                    return triggerEnding('henderson-binding', `You pick up the Henderson Report. You read it — every word. A contract between the building and reality.

"I, _____, do hereby bind myself to the structure known as THE OFFICE, to serve as its heart, its mind, its synergy..."

You sign.

The building shudders. The walls breathe in. The lights stop flickering — they shine, steady and warm. For the first time, the building feels... complete.

You are the building now. Every floor. Every room. Every cubicle. Every TPS report. You are the fluorescent lights and the carpet and the printer that never works.

You are Office Hell. And you will never, ever close.

Marge looks up from her desk. For the first time in decades. She smiles.

"Welcome home."`);
                }
                return `<p>You need a pen to sign. Every contract requires proper instruments.</p>`;
            }
            return `<p>There's nothing to sign here. Yet.</p>`;
        }

        function doDestroy(args) {
            const q = (args || '').toLowerCase();
            // Henderson Unbinding — destroy the report
            if (state.currentRoom === 'b2-synergy-font' && state.flags['boss_the-synergy-font_defeated']) {
                if (q.includes('report') || q.includes('henderson') || q.includes('contract')) {
                    return triggerEnding('henderson-unbinding', `You take the Henderson Report. You read it — every word of the contract that binds reality to corporate misery.

And then you tear it.

The paper screams. The building screams. The fluorescent lights explode in showers of sparks. The walls crack. The carpet curls.

Floor by floor, the building dissolves. Offices become open sky. Cubicles become meadows. The printer finally stops claiming it's out of toner — because there is no printer anymore.

People stumble out, blinking, into sunlight they forgot existed. Marge squints. Karen drops her clipboard. Greg says "synergy" one last time, then forgets the word entirely.

The building is gone. The contract is void. Everyone is free.

Aldric catches your eye from across the rubble. He tips his mop — his staff — and vanishes.

You stand in the empty lot where Office Hell used to be. The sun is warm. Your phone buzzes.

It's a job offer.`);
                }
            }
            // Signal Ending — destroy the antenna/transmitter
            if (state.currentRoom === 'roof-antenna' && state.flags['boss_signal-beast_defeated']) {
                if (q.includes('antenna') || q.includes('transmitter') || q.includes('signal')) {
                    return triggerEnding('signal', `You grab the main transmitter cable. The one that feeds the signal to every floor. Every mind.

You pull.

The cable resists. The building SCREAMS — not through speakers, but through every wall, every pipe, every flickering fluorescent light.

You pull harder.

SNAP.

Silence. Real silence. For the first time since you arrived.

And then — movement. On every floor, in every cubicle, people stop. They look up from their screens. They blink. They remember.

"Why am I here?" says someone on Floor 8.
"How long has it been?" whispers someone on Floor 9.
"I had a family," says someone on Floor 7. "I have a family."

The exodus begins. Hundreds of people streaming toward the elevator, the stairs, the exits. Running. Not walking professionally. Running. Running home.

The building empties. Floor by floor. The lights go dark. The printers stop. The servers cool.

On the roof, you watch them go. All of them. Free.

Marge is the last to leave. She looks up at you from the sidewalk. She waves.

The building stands empty. Just you and the wind and the dead transmitter.

You take the stairs down. You take the front door out.

The signal is gone. Everyone woke up.

Including you.`);
                }
            }
            return `<p>Destroy what? Be specific about what you want to unmake.</p>`;
        }

        function doPlant(args) {
            // True Ending — plant seeds of change in the well
            if (state.currentRoom === 'b2-well' && state.inventory.includes('seeds-of-change')) {
                return triggerEnding('true-ending', `You stand at the well — the deepest point of the building. The bottom of everything.

You open your hand. The Seeds of Change pulse with green light. Possibility. Growth. Change.

You drop them into the well.

For a moment, nothing. Then — a sound. Not a crash. Not a scream. A sigh. The building sighs.

Roots grow. From the well, from the bottom, green shoots spiral upward through concrete and carpet. They climb through B1, through Floor 6 where Diane laughs with surprise, through Floor 7 where Todd finds his lunch, through Marketing where Chad flexes at a flower, through Finance where even Phyllis blinks.

Up through Floor 10. Through the vault. Through the boardroom where spectral executives watch in wonder as vines replace PowerPoint slides.

Up through the roof, where The Gardener weeps with joy.

The building doesn't dissolve. It transforms. Office Hell becomes something new — a place where things grow. Where people grow.

The Henderson Report, deep in B2, crumbles to mulch. Good mulch. The kind things grow from.

Aldric raises his staff to the sky. "Well done," he says. "The hardest ending. The best one."

You take the elevator to the roof. The garden has spread across the entire building. The city below looks... greener.

You did it. You changed things. Not by destroying. Not by signing. By planting.`);
            }
            if (state.inventory.includes('seeds-of-change')) {
                return `<p class="magic">The Seeds of Change need to be planted in the Well. In B2. At the very bottom.</p>`;
            }
            return `<p>Plant what? You need seeds. The Gardener might know about seeds.</p>`;
        }

        function doStay(args) {
            // Floor 6 Ending — stay on F6 with Diane
            if (state.currentRoom.startsWith('f6-') && state.flags.metDiane) {
                return triggerEnding('floor6', `You look around Floor 6. The darkness. The ruins. The cobwebs.

And Diane, reading by candlelight. Building a life from nothing.

"Staying?" she asks, without looking up.

"Yeah," you say. "I think I am."

You build a camp next to hers. The abandoned cubicles become walls. The old supplies become furniture. The vending machine still works — 2015 prices.

Days pass. Weeks. You stop counting. Floor 6 becomes home. You and Diane trade stories. She teaches you how to survive on vending machine snacks and determination.

The floors above continue their corporate dance. The floors below keep their secrets. But here, on Floor 6, in the space between — you find something you never found in the cubicle farm.

Peace.

Diane hands you a book. "I've read all of mine twice," she says.

You read. The fluorescent emergency lights cast everything in warm red.

It's not perfect. But it's yours.`);
            }
            return `<p>Stay where? You can't stay here. Well, you can. You've been staying here for years. That's the problem.</p>`;
        }

        function checkHostileTakeover() {
            // Check if all bosses are defeated
            const bosses = ['printer-daemon', 'memo-swarm-queen', 'the-auditor', 'compliance-golem', 'the-board', 'vault-guardian', 'signal-beast', 'the-synergy-font'];
            const allDefeated = bosses.every(b => state.flags[`boss_${b}_defeated`]);
            if (allDefeated && !state.discoveredEndings.includes('hostile-takeover')) {
                return triggerEnding('hostile-takeover', `Every boss. Every guardian. Every spectral executive. Defeated.

You stand in the empty boardroom. The table is yours. The building is yours. Not through a contract — through conquest. Through percussive maintenance and aggressive synergy.

You sit at the head of the table. The chair fits perfectly. It always fit perfectly.

"Ladies and gentlemen," you say to the empty room, "there's going to be some restructuring."

The building shudders. Not in pain. In respect.

You are the CEO now. The real one. Not through Henderson's contract, but through sheer, stubborn, office-worker determination.

Your first order of business: Fix the printer.

Your second order: Rename "synergy" to something that actually means something.

Your third order: Give Todd a refrigerator with a lock.

The building obeys. For the first time in its history, things work.

You've taken over. Hostile-ly. And it feels... right.`);
            }
            return '';
        }

        function checkDragonEnding() {
            // Dragon egg hatches after 50 turns of carrying it
            if (state.flags.hasDragonEgg && state.flags.eggTurnsTaken) {
                const turnsSince = state.turns - state.flags.eggTurnsTaken;
                if (turnsSince >= 50 && !state.flags.dragonHatched) {
                    state.flags.dragonHatched = true;
                    return triggerEnding('dragon', `The egg in your inventory cracks.

Not a little crack. A BIG crack. The kind of crack that rewrites the laws of office safety.

A head emerges. Scales like server rack panels. Eyes like status lights. Wings like unfolded spreadsheets. It's a dragon. An actual, living, fire-breathing (well, toner-breathing) dragon.

It was DRAGON all along. Not a server. A dragon. An actual dragon.

It looks at you. You look at it. The office around you looks at both of you.

"WHAT," says Karen from HR, clipboard dropping, "IS THAT."

The dragon spreads its wings. Each wing is fifty feet of gleaming scales. The ceiling doesn't stop it — the ceiling gets out of the way.

You climb on. Of course you climb on. You've been stuck in this building for years. What's the worst that could happen?

The dragon punches through the roof. Through the antenna array. Through the clouds.

Below, the building shrinks. The city shrinks. The world spreads out beneath you, beautiful and free.

Dave from IT watches from the parking garage. He waves.

"I submitted a ticket about that dragon in 2017," he says to no one. "Still pending."`);
                }
            }
            return '';
        }

        function checkSignalEnding() {
            // Signal Ending — after defeating signal beast, destroy the transmitter
            if (state.currentRoom === 'roof-antenna' && state.flags['boss_signal-beast_defeated']) {
                // Can be triggered by "destroy transmitter" or "destroy antenna"
                // Already checked in doDestroy
            }
            return '';
        }

        function triggerEnding(type, text) {
            state.endings.push(type);
            if (!state.discoveredEndings.includes(type)) {
                state.discoveredEndings.push(type);
            }
            // Persist endings across saves
            try { localStorage.setItem('officeHell_endings', JSON.stringify(state.discoveredEndings)); } catch(e) {}
            const titles = {
                resignation: 'THE RESIGNATION', arcane: 'THE ARCANE EXIT', defenestration: 'THE DEFENESTRATION',
                'henderson-binding': 'THE HENDERSON BINDING', 'henderson-unbinding': 'THE HENDERSON UNBINDING',
                'true-ending': 'THE TRUE ENDING', 'hostile-takeover': 'THE HOSTILE TAKEOVER',
                'floor6': 'THE FLOOR 6 ENDING', dragon: 'THE DRAGON ENDING', signal: 'THE SIGNAL ENDING',
                overtime: 'THE OVERTIME ENDING', speedrun: 'THE SPEEDRUN ENDING',
            };
            setTimeout(() => {
                document.getElementById('ending-overlay').classList.add('visible');
                document.getElementById('ending-title').textContent = 'ENDING UNLOCKED';
                document.getElementById('ending-text').innerHTML = text.split('\n\n').map(p => `<p>${p}</p>`).join('');
                document.getElementById('ending-type').textContent = titles[type] || type.toUpperCase();
            }, 500);
            return `<p class="magic">${text.split('\n\n')[0]}</p>`;
        }

        // =====================================================
        // MAIN EXECUTE
        // =====================================================
        function execute(input) {
            state.turns++;
            const parsed = parse(input);
            const { cmd, args, verb, topic, action } = parsed;

            // Tick status effects each turn
            const expiredText = tickStatusEffects();

            let result = '';

            // Combat mode
            if (cmd === 'combat') {
                result = combatRound(action, args);
                if (expiredText) result = `<p>${expiredText}</p>` + result;
                return result;
            }

            if (cmd === 'snarky') result = `<p>${SNARKY[verb](args)}</p>`;
            else {
                switch (cmd) {
                    case 'look': result = doLook(args); break;
                    case 'go': result = doGo(args); break;
                    case 'take': result = doTake(args); break;
                    case 'use': result = doUse(args); break;
                    case 'talk': result = doTalk(args); break;
                    case 'ask': result = doAsk(args, topic); break;
                    case 'inventory': result = doInventory(); break;
                    case 'help': result = doHelp(); break;
                    case 'cast': result = doCast(args); break;
                    case 'resign': result = doResign(); break;
                    case 'read': result = doRead(args); break;
                    case 'drop': result = doDrop(args); break;
                    case 'equip': result = doEquip(args); break;
                    case 'unequip': result = doUnequip(args); break;
                    case 'stats': result = doStats(); break;
                    case 'quests': result = doQuests(); break;
                    case 'fight': result = doFight(args); break;
                    case 'levelup': result = doLevelUp(args); break;
                    case 'endings': result = doEndings(); break;
                    case 'skill': result = `<p>Skills are used in combat. Start a fight first, then use <span class="cmd">skill [name]</span>.</p>`; break;
                    case 'attack': result = `<p>Attack what? You're not in combat. Use <span class="cmd">/fight [enemy]</span> to start one.</p>`; break;
                    case 'flee': result = `<p>You can't flee from your job. Well, you CAN, but use <span class="cmd">/resign</span> for that.</p>`; break;
                    case 'sign': result = doSign(args); break;
                    case 'destroy': result = doDestroy(args); break;
                    case 'plant': result = doPlant(args); break;
                    case 'stay': result = doStay(args); break;
                    case 'elevator-select': result = doElevatorSelect(args); break;
                    default:
                        if (['north','south','east','west','n','s','e','w'].includes(cmd)) result = doGo(cmd);
                        else result = `<p class="error">I don't understand "${input}". Try <span class="cmd">/help</span>. Or don't. I'm a parser, not your therapist.</p>`;
                }
            }

            if (expiredText) result = `<p>${expiredText}</p>` + result;

            // Check speedrun ending
            if (state.turns <= 50 && state.endings.length > 0 && !state.discoveredEndings.includes('speedrun')) {
                result += '<hr>' + triggerEnding('speedrun', `${state.turns} turns. You finished in ${state.turns} turns.

The building stares in disbelief. Nobody has ever moved through corporate purgatory this fast.

"That's... that's not possible," whispers Marge, looking up for the first time in recorded history.

Speed. Efficiency. You are the ultimate office worker. And you're out.`);
            }

            // Check hostile takeover ending
            const htResult = checkHostileTakeover();
            if (htResult) result += '<hr>' + htResult;

            // Check dragon egg hatching
            const dragonResult = checkDragonEnding();
            if (dragonResult) result += '<hr>' + dragonResult;

            return result;
        }

        function getAvailableFloors() {
            return [
                { id: 'B2', name: 'Sub-Basement B2', available: !!state.flags.b2Unlocked, locked: 'Requires trapdoor discovery', target: 'b2-archives' },
                { id: 'B1', name: 'Basement B1 - Facilities', available: true, locked: null, target: 'b1-loading-dock' },
                { id: '6', name: 'Floor 6 - Abandoned', available: true, locked: null, target: 'f6-hallway' },
                { id: '7', name: 'Floor 7 - Your Floor', available: true, locked: null, target: 'elevator-lobby' },
                { id: '8', name: 'Floor 8 - Marketing & Sales', available: true, locked: null, target: 'f8-open-plan' },
                { id: '9', name: 'Floor 9 - Legal & Finance', available: !!state.flags.f9Unlocked, locked: 'Complete a quest on Floor 8', target: 'f9-law-library' },
                { id: '10', name: 'Floor 10 - Executive Suite', available: state.equipment.badge === 'executive-badge' || state.equipment.badge === 'all-access-badge', locked: 'Requires Executive Badge equipped', target: 'f10-lobby' },
                { id: 'R', name: 'Roof Access', available: !!state.flags.roofUnlocked, locked: 'Requires Roof Key', target: 'roof-access' },
            ];
        }

        function doElevatorSelect(args) {
            const input = (args || '').trim().toLowerCase();
            if (input === 'cancel' || input === 'back' || input === 'exit') {
                state.mode = 'explore';
                return `<p>You step back from the elevator. The doors close with a disappointed wheeze.</p>`;
            }
            const floors = getAvailableFloors();
            const match = floors.find(f => f.id.toLowerCase() === input || f.name.toLowerCase().includes(input));
            if (!match) {
                return `<p>Unknown floor. Type a floor number (B2, B1, 6, 7, 8, 9, 10, R) or "cancel".</p>`;
            }
            if (!match.available) {
                return `<p class="error">Floor ${match.id} is locked. ${match.locked}.</p>`;
            }
            if (!ROOMS[match.target]) {
                state.mode = 'explore';
                return `<p>The elevator hums but the doors won't open. That floor isn't accessible yet.</p>`;
            }
            state.mode = 'explore';
            state.currentRoom = match.target;
            autoSave();
            let text = `<p>The elevator shudders, groans, and deposits you on ${match.name}.</p><hr>`;
            const room = ROOMS[match.target];
            const enterText = room.onEnter?.();
            if (enterText) text += enterText;
            text += doLook('');
            const enc = checkRandomEncounter();
            if (enc) text += '<hr>' + enc;
            return text;
        }

        // =====================================================
        // UI
        // =====================================================
        const output = document.getElementById('output');
        const inputEl = document.getElementById('input');

        function print(html) {
            output.innerHTML += html;
            output.scrollTop = output.scrollHeight;
            updateStats();
        }

        function updateStats() {
            document.getElementById('stat-coffee').textContent = state.coffee;
            document.getElementById('stat-class').innerHTML = state.class
                ? `<span class="class-label">${state.class.toUpperCase()}</span>`
                : '';
            // Update stats bar
            const bar = document.getElementById('stats-bar');
            if (state.class) {
                bar.style.display = 'flex';
                const s = getEffectiveStats();
                document.getElementById('sb-morale').textContent = `${state.morale}/${state.moraleMax}`;
                document.getElementById('sb-coffee').textContent = `${state.coffee}/${getEffectiveCoffeeMax()}`;
                document.getElementById('sb-hustle').textContent = s.hustle;
                document.getElementById('sb-optics').textContent = s.optics;
                document.getElementById('sb-synergy').textContent = s.synergy;
                document.getElementById('sb-networking').textContent = s.networking;
                document.getElementById('sb-efficiency').textContent = s.efficiency;
                document.getElementById('sb-level').textContent = `Q${state.level}`;
            } else {
                bar.style.display = 'none';
            }
        }

        function restart() {
            const discoveredEndings = state.discoveredEndings || [];
            state = makeDefaultState();
            state.discoveredEndings = discoveredEndings; // preserve across restarts
            clearSave();
            output.innerHTML = '';
            document.getElementById('ending-overlay').classList.remove('visible');
            print(`<p class="system">New game. Same hell. Let's go.</p><hr>`);
            print(doLook(''));
        }

        inputEl.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const cmd = inputEl.value.trim();
            if (!cmd) return;
            print(`<p class="system">&gt; ${cmd}</p>`);
            inputEl.value = '';
            print(execute(cmd));
        });

        document.getElementById('btn-restart').addEventListener('click', restart);

        // Restore discovered endings from localStorage
        try {
            const savedEndings = localStorage.getItem('officeHell_endings');
            if (savedEndings) state.discoveredEndings = JSON.parse(savedEndings);
        } catch(e) {}

        // Try to load saved game
        const hasExistingSave = loadGame();

        // Start
        if (hasExistingSave) {
            print(`<p><em>Welcome back to <span style="color: var(--danger)">OFFICE HELL</span>.</em></p>
<p class="system">Save loaded. The nightmare continues. Turn ${state.turns}.</p><hr>`);
            print(doLook(''));
        } else {
            print(`<p><em>Welcome to <span style="color: var(--danger)">OFFICE HELL</span>.</em></p>
<p><em>A text adventure RPG for the gainfully employed and spiritually depleted.</em></p>
<p class="system">Type anything. The parser is patient. And snarky.</p><hr>`);
            print(doLook(''));
        }
        inputEl.focus();
    })();
    </script>
</body>
</html>
