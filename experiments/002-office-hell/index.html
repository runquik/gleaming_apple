<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Hell</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #08080c;
            --surface: #0e0e14;
            --border: #1a1a28;
            --text: #c8c8d0;
            --text-dim: #5a5a6e;
            --item: #fbbf24;
            --npc: #38bdf8;
            --exit: #4ade80;
            --command: #a78bfa;
            --danger: #f87171;
            --glow: rgba(167, 139, 250, 0.15);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(167, 139, 250, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(248, 113, 113, 0.02) 0%, transparent 50%);
        }

        .game-frame {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow:
                0 0 60px var(--glow),
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        header {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .back:hover { opacity: 1; color: var(--command); }

        header h1 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--danger);
            letter-spacing: 0.05em;
        }

        .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        .stats span { color: var(--text); }
        .stats .class-label { color: var(--command); }

        .commands-bar {
            padding: 0.4rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--text-dim);
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
        }
        .commands-bar code {
            color: var(--command);
        }

        #output {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            line-height: 1.75;
            font-size: 0.82rem;
            scroll-behavior: smooth;
        }

        #output::-webkit-scrollbar { width: 6px; }
        #output::-webkit-scrollbar-track { background: transparent; }
        #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        #output p { margin-bottom: 0.6rem; }
        #output hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

        .room-title {
            color: var(--exit);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.15rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .system { color: var(--text-dim); font-style: italic; }
        .error { color: var(--danger); }
        .magic { color: var(--command); text-shadow: 0 0 10px var(--command); }
        .item { color: var(--item); }
        .npc { color: var(--npc); }
        .exit { color: var(--exit); }
        .cmd { color: var(--command); }

        .input-area {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .input-area .prompt {
            color: var(--command);
            font-size: 0.85rem;
            user-select: none;
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 0.82rem;
            outline: none;
            caret-color: var(--command);
        }

        #input::placeholder { color: var(--text-dim); opacity: 0.5; }

        .ending-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 12, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        .ending-overlay.visible { opacity: 1; pointer-events: auto; }
        .ending-overlay h2 {
            font-size: 1.3rem;
            color: var(--item);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        .ending-overlay .ending-text {
            max-width: 50ch;
            line-height: 1.7;
            color: var(--text-dim);
        }
        .ending-overlay .ending-text p { margin-bottom: 0.75rem; }
        .ending-overlay .ending-type {
            color: var(--exit);
            font-size: 0.75rem;
            margin-top: 1.5rem;
            letter-spacing: 0.15em;
        }
        .ending-overlay button {
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .ending-overlay button:hover { border-color: var(--command); }

        .credits {
            position: fixed;
            bottom: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: var(--text-dim);
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="game-frame">
        <header>
            <div class="title-area">
                <a href="../../" class="back">← exit</a>
                <h1>OFFICE HELL</h1>
            </div>
            <div class="stats">
                <span id="stat-class"></span>
                <span>☕ <span id="stat-coffee">0</span></span>
            </div>
        </header>

        <div class="commands-bar">
            <code>/look</code>
            <code>/go</code>
            <code>/take</code>
            <code>/use</code>
            <code>/talk</code>
            <code>/open</code>
            <code>/read</code>
            <code>/inv</code>
            <code>/help</code>
        </div>

        <div id="output"></div>

        <div class="input-area">
            <span class="prompt">&gt;</span>
            <input type="text" id="input" placeholder="What do you do?" autocomplete="off" autofocus>
        </div>
    </div>

    <div class="ending-overlay" id="ending-overlay">
        <h2 id="ending-title">ENDING UNLOCKED</h2>
        <div class="ending-text" id="ending-text"></div>
        <p class="ending-type" id="ending-type"></p>
        <button id="btn-restart">Play Again</button>
    </div>

    <div class="credits">a human + ai experiment</div>

    <script>
    (function() {
        // =====================================================
        // ROOMS
        // =====================================================
        const ROOMS = {
            'elevator-lobby': {
                name: 'Elevator Lobby',
                description: `The elevator doors wheeze shut behind you with the enthusiasm of a dying accordion. You're on <span class="exit">FLOOR 7</span>. The <span class="item">FLUORESCENT LIGHTS</span> flicker in what you've come to recognize as their standard passive-aggressive greeting.

A <span class="item">MOTIVATIONAL POSTER</span> on the wall says "HANG IN THERE" with a picture of a cat. The cat has given up.

<span class="npc">MARGE</span> sits at the reception desk, aggressively not making eye contact. A <span class="item">SIGN-IN SHEET</span> sits in front of her. The <span class="item">ELEVATOR</span> behind you has a keyhole.`,
                exits: { south: 'cubicle-farm' },
                items: ['poster', 'lights', 'sign-in-sheet', 'elevator', 'floor', 'ceiling', 'walls'],
                npcs: ['marge'],
            },
            'cubicle-farm': {
                name: 'Cubicle Farm',
                description: `Rows upon rows of identical gray <span class="item">CUBICLES</span> stretch before you like a fabric-walled purgatory. The sound of <span class="item">KEYBOARDS</span> clicking mingles with passive-aggressive sighing. Someone is microwaving <span class="item">FISH</span> again.

A <span class="item">PRINTER</span> blinks menacingly in the corner, forever claiming it's out of toner. <span class="npc">KAREN</span> from HR patrols with her <span class="item">CLIPBOARD</span>. <span class="npc">DAVE</span> from IT shuffles past, muttering about tickets.

A <span class="item">WATER COOLER</span> gurgles near the <span class="exit">BREAK ROOM</span> to the east.`,
                exits: { north: 'elevator-lobby', south: 'your-cubicle', east: 'break-room', west: 'supply-closet' },
                items: ['printer', 'cubicles', 'keyboards', 'fish-smell', 'water-cooler', 'carpet', 'ceiling-tiles'],
                npcs: ['karen', 'dave'],
            },
            'your-cubicle': {
                name: 'Your Cubicle',
                description: `Ah, your kingdom. A 6x6 foot empire of beige. The <span class="item">WALLS</span> are covered in passive-aggressive notes and a <span class="item">CALENDAR</span> from 2019.

A <span class="item">DEAD PLANT</span> sits on your <span class="item">DESK</span>. Your <span class="item">COMPUTER</span> hums with 347 unread emails. A <span class="item">DRAWER</span> is slightly ajar. Your <span class="item">CHAIR</span> squeaks ominously.

A <span class="item">STICKY NOTE</span> peeks out from under the plant. A <span class="item">FAMILY PHOTO</span> faces the wall — you turned it around months ago. The <span class="item">BROOM CLOSET</span> is to the east.`,
                exits: { north: 'cubicle-farm', east: 'broom-closet', south: 'boss-hallway' },
                items: ['plant', 'computer', 'drawer', 'sticky-note', 'desk', 'chair', 'walls', 'calendar', 'photo', 'monitor', 'keyboard', 'mouse', 'pen-cup', 'stapler-normal'],
                npcs: [],
            },
            'break-room': {
                name: 'Break Room',
                description: `The break room smells of burnt <span class="item">POPCORN</span> and broken dreams. A <span class="item">MICROWAVE</span> hums with the souls of a thousand reheated lunches.

A <span class="item">FRIDGE</span> contains mysteries best left unexplored. Someone's <span class="item">LUNCH</span> has a passive-aggressive note. The <span class="item">COFFEE MACHINE</span> gurgles with dark promise.

<span class="npc">THE JANITOR</span> mops the same spot he's been mopping for three years. A <span class="item">VENDING MACHINE</span> offers <span class="item">SNACKS</span> at predatory prices. The <span class="item">BULLETIN BOARD</span> advertises a "Mandatory Fun Day."`,
                exits: { west: 'cubicle-farm', south: 'broom-closet' },
                items: ['coffee-machine', 'fridge', 'lunch', 'microwave', 'popcorn', 'vending-machine', 'snacks', 'bulletin-board', 'table', 'chairs', 'sink', 'mugs'],
                npcs: ['janitor'],
            },
            'supply-closet': {
                name: 'Supply Closet',
                description: `A cramped closet full of <span class="item">OFFICE SUPPLIES</span> that nobody is allowed to take without Form 27B-Stroke-6 in triplicate.

<span class="item">BOXES</span> of paperclips tower precariously. <span class="item">REAMS</span> of paper gather dust. Wait — in the back, behind the boxes... is that a <span class="item">GLOWING STAPLER</span>? No. Staplers don't glow.

A <span class="item">PEN</span> and some <span class="item">PAPER</span> sit within easy reach. A <span class="item">HOLE PUNCH</span> looks surprisingly threatening.`,
                exits: { east: 'cubicle-farm' },
                items: ['stapler', 'pen', 'paper', 'boxes', 'paperclips', 'tape', 'scissors', 'hole-punch', 'binders', 'post-its', 'rubber-bands', 'shelves'],
                npcs: [],
            },
            'broom-closet': {
                name: 'Broom Closet',
                get description() {
                    if (!state.flags.closetOpened) {
                        return `A door labeled "MAINTENANCE - AUTHORIZED PERSONNEL ONLY." It's slightly ajar. You smell cleaning products and... something else. Ozone? Old books?

The <span class="item">DOOR</span> beckons. A <span class="item">MOP BUCKET</span> sits outside, filled with gray water and existential despair.`;
                    }
                    if (!state.flags.magicDiscovered) {
                        return `The closet is... bigger on the inside. Much bigger. This is fine.

<span class="item">CANDLES</span> float in the air (fire code violation). <span class="item">BOOKSHELVES</span> line the walls. A <span class="item">DESK</span> holds a glowing <span class="item">SPELLBOOK</span>. <span class="item">RUNES</span> are carved into the floor.

A <span class="item">CRYSTAL BALL</span> shows your quarterly review. It's not going well.`;
                    }
                    return `The wizard's study. <span class="item">CANDLES</span> float lazily. The <span class="item">SPELLBOOK</span> pulses on the <span class="item">DESK</span>.

A shelf holds <span class="item">POTIONS</span> with labels like "LIQUID COURAGE" and "MEETINGS-B-GONE." An <span class="item">OWL</span> watches you. It works in Accounts Receivable.

<span class="item">ARCANE NOTES</span> cover the desk, mixed with tax forms.`;
                },
                exits: { west: 'your-cubicle', north: 'break-room' },
                get items() {
                    if (!state.flags.closetOpened) return ['door', 'mop-bucket'];
                    if (!state.flags.magicDiscovered) return ['spellbook', 'candles', 'desk-wizard', 'bookshelves', 'runes', 'crystal-ball'];
                    return ['spellbook', 'candles', 'desk-wizard', 'bookshelves', 'courage-potion', 'potions', 'owl', 'arcane-notes'];
                },
                npcs: [],
                onEnter() {
                    if (!state.flags.closetOpened) {
                        state.flags.closetOpened = true;
                        return `<p class="magic">You push open the door expecting mops. Cleaning supplies. Maybe that weird smell explained.</p>
<p class="magic">Instead, the closet is... bigger on the inside?</p>
<p>There's a desk. There are bookshelves. Candles float in the air, which is absolutely a fire code violation.</p>
<p><em>"What,"</em> you say aloud, to no one, <em>"the actual hell."</em></p>`;
                    }
                    return null;
                }
            },
            'boss-hallway': {
                name: 'Executive Hallway',
                description: `The carpet is noticeably nicer here. The <span class="item">WALLS</span> display <span class="item">MOTIVATIONAL ARTWORK</span> worth more than your salary. A <span class="item">FERN</span> thrives in conditions identical to where your desk plant died.

<span class="npc">THE INTERN</span> sits at a desk outside the corner office, looking terrified. A <span class="item">PLAQUE</span> on the wall lists "Employee of the Month" — the same person for 47 consecutive months.

The door to <span class="exit">GREG'S OFFICE</span> looms ahead. A <span class="item">SECURITY CAMERA</span> watches your every move.`,
                exits: { north: 'your-cubicle', south: 'boss-office' },
                items: ['walls', 'artwork', 'fern', 'plaque', 'camera', 'nice-carpet', 'fancy-lights'],
                npcs: ['intern'],
                get locked() { return !state.flags.bossOfficeUnlocked; },
                onEnter() {
                    if (this.locked) {
                        state.currentRoom = 'your-cubicle';
                        return `<p class="error">You take a step toward the executive hallway. <span class="npc">KAREN</span> materializes from nowhere.</p>
<p>"Do you have an <em>appointment</em>?" Her smile is a blade. You retreat to your cubicle.</p>`;
                    }
                    return null;
                }
            },
            'boss-office': {
                name: "Greg's Corner Office",
                description: `The corner office. Windows on two sides. <span class="npc">GREG</span> sits behind a <span class="item">DESK</span> roughly the size of a small aircraft carrier.

The <span class="item">WINDOW</span> offers a view of the city below. Very far below. It's the kind that opens, which seems like an OSHA violation.

<span class="item">MOTIVATIONAL POSTERS</span> line the walls — but these ones are framed. Fancy. A <span class="item">GOLF BAG</span> leans in the corner. A <span class="item">WORLD'S OKAYEST BOSS</span> mug sits on the desk.

Greg's <span class="item">NAMEPLATE</span> reads "GREG HENDERSON - REGIONAL MANAGER OF SYNERGY." Wait. Henderson?`,
                exits: { north: 'boss-hallway' },
                items: ['window', 'nameplate', 'greg-desk', 'golf-bag', 'mug', 'posters', 'view', 'chair-fancy', 'computer-greg', 'phone'],
                npcs: ['greg'],
                onEnter() {
                    if (!state.flags.metGreg) {
                        state.flags.metGreg = true;
                        return `<p>Greg looks up from his computer. "Ah! You! The Henderson Report. Very important. To synergy."</p>
<p>He has no idea what that means. Neither do you. Neither does anyone.</p>`;
                    }
                    return null;
                }
            },
            'server-room': {
                name: 'Server Room',
                get description() {
                    const base = `The server room hums with eldritch energy (or maybe that's just the cooling system). Rows of <span class="item">SERVER RACKS</span> blink with status lights like a thousand unblinking eyes.

One rack is labeled <span class="item">"DRAGON"</span>. It runs hot. Very hot. The <span class="item">CABLES</span> on the floor are a trip hazard and possibly sentient.`;
                    if (state.flags.magicDiscovered) {
                        return base + `\n\n<span class="magic">Now that you've seen real magic, DRAGON seems... different. It pulses. It breathes. Is that... a scale?</span>`;
                    }
                    return base + `\n\nA <span class="item">WHITEBOARD</span> shows the network topology. It's wrong. Everyone knows it's wrong. Nobody updates it.`;
                },
                exits: { north: 'cubicle-farm' },
                items: ['servers', 'dragon-server', 'cables', 'whiteboard', 'cooling', 'blinking-lights', 'fire-extinguisher'],
                npcs: [],
            }
        };

        // =====================================================
        // ITEMS (massively expanded)
        // =====================================================
        const ITEMS = {
            // LOBBY
            'poster': {
                name: 'Motivational Poster',
                description: `"HANG IN THERE" with a cat on a branch. The cat's eyes are dead. It has accepted its fate. There's a coffee stain in the corner that looks like a face screaming.`,
            },
            'lights': {
                name: 'Fluorescent Lights',
                description: `They flicker at exactly 7.83 Hz — the Schumann resonance. Either that's a coincidence or the building is trying to communicate with the Earth's magnetic field. You've been here too long.`,
            },
            'sign-in-sheet': {
                name: 'Sign-In Sheet',
                description: `The sheet asks for your name, time, and "Purpose of Visit." Previous entries include "meeting," "meeting," "crying in bathroom," and "meeting."`,
            },
            'elevator': {
                name: 'Elevator',
                description: `The elevator requires a key to operate after hours. Or during hours. It's temperamental. A sign says "Max Capacity: 8 persons or 1 person with a gym bag."`,
            },
            'floor': {
                name: 'Floor',
                description: `Industrial carpet, the color of despair. Thousands of footsteps have worn a path from the elevator to the cubicles. The carpet remembers them all. It remembers everything.`,
            },
            'ceiling': {
                name: 'Ceiling',
                description: `Acoustic tiles. One of them is slightly askew. You've thought about fixing it every day for two years. You never will.`,
            },
            'walls': {
                name: 'Walls',
                description: `Beige. Not warm beige. Not cool beige. Just... beige. The color of compromise. The color of giving up.`,
            },
            'ceiling-tiles': {
                name: 'Ceiling Tiles',
                description: `One is water-stained. That was from the "incident" in 2019. Nobody talks about it. The stain grows larger each month.`,
            },

            // CUBICLE FARM
            'printer': {
                name: 'Printer',
                description: `HP LaserJet Pro MFP M428fdw. It claims it's out of toner. It's been "out of toner" for six months. The IT guy says nothing's wrong. The printer knows what it did.`,
                onUse() {
                    state.flags.usedPrinter = true;
                    state.actions.push('printer-violence');
                    const responses = [
                        `You press PRINT. It makes a grinding sound, displays "PC LOAD LETTER," and goes silent. You feel your blood pressure rise.`,
                        `You kick the printer. It makes a sound like laughter. Nothing prints. But god, that felt good.`,
                        `You whisper threats to the printer. It prints a single page. It says "NO."`,
                    ];
                    return responses[Math.floor(Math.random() * responses.length)];
                }
            },
            'cubicles': {
                name: 'Cubicles',
                description: `Identical gray boxes stretching to infinity. Each contains a human slowly being converted into a spreadsheet. The walls are exactly 5'4" tall — short enough to see over if you stand, tall enough to hide in if you slouch.`,
            },
            'keyboards': {
                name: 'Keyboards',
                description: `The symphony of the damned. Click click click. Someone types aggressively. Someone types passive-aggressively. You can tell the difference.`,
            },
            'fish-smell': {
                name: 'Fish Smell',
                description: `Someone is microwaving fish. It's always someone. There's a sign in the break room that says "Please no fish." The sign has failed.`,
            },
            'water-cooler': {
                name: 'Water Cooler',
                description: `The sacred gathering place. Here, rumors are born and careers die. The water is lukewarm. It's always lukewarm. The bubbles sound like whispers.`,
                onUse() {
                    return `You take a cup of water. Someone approaches. You panic and pretend to read the safety poster. They leave. Crisis averted.`;
                }
            },
            'carpet': {
                name: 'Carpet',
                description: `Static electricity builds with every step. Touch a doorknob and you'll see God. Or at least a small spark.`,
            },

            // YOUR CUBICLE
            'plant': {
                name: 'Dead Plant',
                description: `A desiccated succulent. HR called it a "desk buddy" when they gave it to you. That was three years ago. The plant lasted two weeks. You've kept the corpse as a reminder. Of what, you're not sure anymore.`,
            },
            'computer': {
                name: 'Computer',
                description: `347 unread emails. 342 are reply-all chains about the microwave fish. 4 are meeting invites. 1 is from an address you don't recognize: "THEY KNOW."`,
                onUse() {
                    state.actions.push('checked-email');
                    return `You scroll through emails. Your soul temporarily leaves your body to get coffee. It's a normal Monday. Or Tuesday. The days blend together.`;
                }
            },
            'drawer': {
                name: 'Desk Drawer',
                get description() {
                    return state.flags.drawerOpened
                        ? `Empty now. You took the good stuff. Which was almost nothing.`
                        : `A drawer. The last frontier of privacy in this open-plan hellscape.`;
                },
                onUse() {
                    if (state.flags.drawerOpened) return `Empty. You've already plundered your own desk.`;
                    state.flags.drawerOpened = true;
                    state.inventory.push('elevator-key');
                    state.actions.push('opened-drawer');
                    return `Inside: a paper clip, a rubber band, an <span class="item">ELEVATOR KEY</span> (how did that get here?), and a photo of yourself looking happy. That last one must be from before.

You take the key. You leave the photo. Some things are better left in drawers.`;
                }
            },
            'sticky-note': {
                name: 'Sticky Note',
                description: `"THE KEY IS IN THE DRAWER. THE DRAWER IS IN YOUR HEART. - A"

Who is A? What does this mean? Why is your heart a drawer?`,
                takeable: true,
                onTake() {
                    state.actions.push('found-note');
                    return `You pocket the cryptic note. A for... Aldric? Accounting? Anxiety?`;
                }
            },
            'desk': {
                name: 'Desk',
                description: `Standard-issue corporate desk. Particle board veneer. Someone carved "HELP" into the underside. That was you. You don't remember doing it.`,
            },
            'chair': {
                name: 'Chair',
                description: `Ergonomic, supposedly. The lumbar support gave up in 2021. It squeaks with every move, announcing your existence to the entire floor.`,
                onUse() {
                    return `You sit. The chair squeaks. Karen looks over. You stop moving. This is your life now.`;
                }
            },

            lick: args => `Absolutely not. Do you know how many germs are on ${args || 'that'}? Do you know how many sad, corporate germs?`,
            touch: args => SNARKY.feel(args),
            feel: args => args ? `You reach out to touch the ${args}. It feels like ${['regret', 'disappointment', 'particle board', 'cold indifference'][Math.floor(Math.random()*4)]}.` : `You feel... nothing. That's normal. That's fine.`,

            // Physical actions
            jump: () => `You jump. The ceiling tiles are closer than you thought. You land. Nothing has changed. Nothing ever changes.`,
            dance: () => `You bust a move. Karen looks over. You stop. The dance is dead. Long live the dance.`,
            sing: () => `You hum softly. Someone tells you to stop. "This is a place of business." You stop. The song dies inside you.`,
            scream: () => `You want to scream. God, you want to scream. But this is a professional environment. You scream internally. It echoes.`,
            cry: () => `You want to cry. But the tears won't come. They dried up in Q3 of last year. You're all cried out.`,
            laugh: () => `You laugh. It echoes hollow in the fluorescent void. Someone asks if you're okay. You say yes. You're lying.`,
            sleep: () => `You can't sleep here. You've tried. Security wakes you up. They know your name now.`,
            nap: () => `You close your eyes for a moment. When you open them, it's 6pm. Three meetings have passed. You attended none.`,
            run: () => `You can't run. Running is unprofessional. You can walk with purpose. That's the corporate-approved equivalent.`,
            hide: () => `You crouch behind a cubicle wall. It's only 5'4" tall. Everyone can see you. Nobody acknowledges this.`,
            pray: () => `You pray to whatever deity handles office workers. You hear nothing back. But the coffee machine gurgles. That might be a sign.`,
            meditate: () => `You try to find inner peace. Karen interrupts. "Is that billable?" It is not. Nothing is billable except suffering.`,
            wait: () => { state.turns++; return `Time passes. The clock ticks. Nothing happens. Nothing ever happens. And yet, everything happens.`; },
            think: () => `You think. This is dangerous. Thinking leads to awareness. Awareness leads to despair. Better not to think.`,
            ponder: () => SNARKY.think(),
            die: () => `Not yet. You haven't finished the Henderson Report. Can't die until that's done. (It will never be done.)`,
            kill: args => args?.toLowerCase().includes('self') ? SNARKY.die() : `Violence in the workplace is against policy. Submit a ticket instead.`,
            attack: args => `You consider attacking ${args || 'something'}. HR would file so much paperwork. Is it worth it? (No. But the thought is nice.)`,
            punch: args => {
                if (args?.includes('printer')) return ITEMS.printer.onUse();
                state.actions.push('punched-thing');
                return `You punch ${args || 'the air'}. Your knuckles sting. The ${args || 'air'} is unimpressed.`;
            },
            kick: args => args?.includes('printer') ? ITEMS.printer.onUse() : `You kick ${args || 'nothing in particular'}. Therapeutic. Unprofessional. Worth it.`,
            slap: args => `You can't slap ${args || 'things'}. That's assault. This is a Fortune 500 company. We do passive-aggressive memos here.`,
            hug: args => `You can't hug ${args || 'anyone'}. Physical contact is against the COVID policy. Also the pre-COVID policy. Also the general vibe.`,
            kiss: args => `This is not that kind of game. Or that kind of office. Or that kind of ${args || 'interaction'}.`,

            // Inappropriate/desperate actions
            huff: args => `You cannot huff the ${args || 'office supplies'}. That's grounds for immediate termination. Also probably illegal. Also unwise.`,
            eat: args => args?.includes('lunch') ? ITEMS.lunch.onTake() : `You can't eat ${args || 'that'}. Even by office lunch standards, it's not food.`,
            drink: args => args?.includes('coffee') ? ITEMS['coffee-machine'].onUse() : `You can't drink ${args || 'that'}. The coffee machine is right there.`,
            throw: args => `You can't throw ${args || 'things'}. What is this, a startup? We're professionals here. Allegedly.`,
            break: args => `You can't break the ${args || 'office equipment'}. It's company property. Your soul, however, is free to break at any time.`,
            steal: args => args?.includes('lunch') ? ITEMS.lunch.onTake() : (args?.includes('stapler') ? doTake('stapler') : `Stealing ${args || 'things'}? In THIS economy? Actually, maybe.`),
            yell: () => SNARKY.scream(),
            shout: () => SNARKY.scream(),
            whisper: args => `You whisper ${args ? 'about ' + args : 'conspiratorially'}. Nobody hears. Nobody ever hears.`,
            flip: args => args?.includes('desk') || args?.includes('table') ? `You want to flip the ${args}. God, you want to flip it. But the paperwork...` : `You can't flip ${args || 'that'}. Not today.`,

            // Adventure game classics
            xyzzy: () => `<span class="magic">A hollow voice says "PLUGH."</span> Nothing happens. Some things transcend corporate boundaries. Other things don't.`,
            plugh: () => `<span class="magic">A hollow voice says "XYZZY."</span> You feel a brief nostalgia for a time before TPS reports.`,
            abracadabra: () => state.flags.magicDiscovered ? `<span class="magic">The spellbook in your bag vibrates briefly. That's not a real spell. It's judging you.</span>` : `Nothing happens. This isn't a magic word. This is an office.`,
            hello: () => `Hello. I'm a text parser, not your friend. But I appreciate the politeness.`,
            hi: () => SNARKY.hello(),
            bye: () => `You can't leave by saying bye. The elevator needs a key. Also conviction. Also purpose.`,
            goodbye: () => SNARKY.bye(),
            sorry: () => `Apology noted. Filed. Ignored. This is standard procedure.`,
            please: () => `"Please" doesn't work here. Neither does "thank you." This is corporate America.`,
            thanks: () => `You're welcome. I think. I'm a text parser. I don't really know how to feel.`,
            'thank you': () => SNARKY.thanks(),

            // Meta/silly
            win: () => `You can't just say "win." You have to earn it. Through bureaucracy. And suffering. And maybe magic.`,
            cheat: () => `There are no cheats. There are no shortcuts. There is only the eternal corporate grind.`,
            save: () => `Your progress exists only in the fleeting RAM of a browser tab. Like all things. Like all dreams.`,
            load: () => `There is nothing to load. There is only forward. Always forward. Into the void.`,
            quit: () => `Do you mean /resign? Because that requires paperwork. Everything requires paperwork.`,
            score: () => `Score: You've drunk ${state.coffee} coffee(s). You've made ${state.actions.length} significant choices. You are ${state.flags.magicDiscovered ? 'aware of the true nature of reality' : 'blissfully ignorant'}.`,
            hint: () => {
                const hints = [
                    `Have you checked your desk drawer?`,
                    `The janitor knows more than he lets on.`,
                    `Coffee is important. Very important.`,
                    `That broom closet seems... odd.`,
                    `Karen blocks the way until you have a reason to proceed.`,
                    state.flags.magicDiscovered ? `Three coffees. One spell. Freedom.` : `Some closets contain more than mops.`,
                ];
                return `<p class="system">Hint: ${hints[Math.floor(Math.random() * hints.length)]}</p>`;
            },
            help: () => doHelp(),
            about: () => `OFFICE HELL: A text adventure about escaping corporate purgatory. Made by a human and an AI who understand the suffering of fluorescent lighting.`,
            credits: () => SNARKY.about(),
        };

        // =====================================================
        // PARSER
        // =====================================================
        const ALIASES = {
            'l': 'look', 'look': 'look', 'examine': 'look', 'x': 'look', 'ex': 'look', 'inspect': 'look', 'check': 'look', 'describe': 'look',
            'go': 'go', 'move': 'go', 'walk': 'go', 'enter': 'go', 'head': 'go',
            'n': 'go north', 's': 'go south', 'e': 'go east', 'w': 'go west',
            'north': 'go north', 'south': 'go south', 'east': 'go east', 'west': 'go west',
            'take': 'take', 'get': 'take', 'grab': 'take', 'pick': 'take', 'acquire': 'take', 'obtain': 'take',
            'use': 'use', 'activate': 'use', 'open': 'use', 'operate': 'use',
            'talk': 'talk', 'speak': 'talk', 'chat': 'talk', 'ask': 'talk', 'greet': 'talk', 'say': 'talk',
            'inv': 'inventory', 'inventory': 'inventory', 'i': 'inventory', 'items': 'inventory',
            'help': 'help', 'commands': 'help', '?': 'help',
            'cast': 'cast', 'magic': 'cast', 'spell': 'cast',
            'quit': 'resign', 'resign': 'resign',
            'read': 'read', 'peruse': 'read',
            'write': 'write', 'compose': 'write',
            'drop': 'drop', 'discard': 'drop',
        };

        function parse(input) {
            input = input.trim().toLowerCase();
            if (input.startsWith('/')) input = input.slice(1);
            let parts = input.split(/\s+/);
            let cmd = parts[0];
            let args = parts.slice(1).join(' ');

            // Check snarky handlers first
            if (SNARKY[cmd]) return { cmd: 'snarky', verb: cmd, args };

            // Check aliases
            if (ALIASES[cmd]) {
                let expanded = ALIASES[cmd];
                if (expanded.includes(' ')) {
                    let [newCmd, ...rest] = expanded.split(' ');
                    cmd = newCmd;
                    args = rest.join(' ') + (args ? ' ' + args : '');
                } else {
                    cmd = expanded;
                }
            }
            return { cmd, args };
        }

        // =====================================================
        // COMMAND HANDLERS
        // =====================================================
        function findItem(query, room) {
            const q = query.toLowerCase().replace(/^(the|a|an)\s+/, '').trim();
            const roomData = ROOMS[room || state.currentRoom];
            const roomItems = typeof roomData.items === 'function' ? roomData.items() : roomData.items;

            // Check room items
            for (const id of roomItems || []) {
                const item = ITEMS[id];
                if (item && (id.includes(q) || item.name.toLowerCase().includes(q))) return { id, item };
            }
            // Check inventory
            for (const id of state.inventory) {
                const item = ITEMS[id];
                if (item && (id.includes(q) || item.name.toLowerCase().includes(q))) return { id, item };
            }
            return null;
        }

        function findNpc(query, room) {
            const q = query.toLowerCase().replace(/^(the|a|an|to)\s+/, '').trim();
            const roomData = ROOMS[room || state.currentRoom];
            for (const id of roomData.npcs || []) {
                const npc = NPCS[id];
                if (npc && (id.includes(q) || npc.name.toLowerCase().includes(q))) return { id, npc };
            }
            return null;
        }

        function doLook(args) {
            const room = ROOMS[state.currentRoom];
            if (!args) {
                let text = `<p class="room-title">${room.name}</p>`;
                text += `<p>${typeof room.description === 'function' ? room.description() : room.description}</p>`;
                const exits = Object.keys(room.exits || {});
                if (exits.length) text += `<p>Exits: ${exits.map(e => `<span class="exit">${e.toUpperCase()}</span>`).join(', ')}</p>`;
                return text;
            }
            const found = findItem(args) || findNpc(args);
            if (found) {
                const desc = typeof (found.item || found.npc).description === 'function'
                    ? (found.item || found.npc).description()
                    : (found.item || found.npc).description;
                return `<p>${desc}</p>`;
            }
            return `<p>You don't see "${args}" here. Not everything is interactive. But you tried, and that's what counts. (It's not. But still.)</p>`;
        }

        function doGo(args) {
            if (!args) return `<p>Go where? Be specific. Unlike your career path.</p>`;
            const room = ROOMS[state.currentRoom];
            const dir = args.toLowerCase();
            const exitDir = Object.keys(room.exits || {}).find(e => e.startsWith(dir) || dir.includes(e));

            if (dir === 'server' || dir === 'dragon') {
                if (state.flags.serverRoomHinted) {
                    state.currentRoom = 'server-room';
                    return doLook('');
                }
                return `<p>You don't know where the server room is. Maybe someone in IT could help.</p>`;
            }

            if (!exitDir) return `<p>You can't go "${args}" from here. Walls are real. More real than synergy, anyway.</p>`;

            const nextId = room.exits[exitDir];
            const nextRoom = ROOMS[nextId];
            if (nextRoom.locked) {
                const enterText = nextRoom.onEnter?.();
                if (enterText) return enterText;
                return `<p>That way is blocked. Probably by bureaucracy.</p>`;
            }
            state.currentRoom = nextId;
            let text = '';
            const enterText = nextRoom.onEnter?.();
            if (enterText) text += enterText;
            text += doLook('');
            return text;
        }

        function doTake(args) {
            if (!args) return `<p>Take what? Your future into your own hands? Bold.</p>`;
            const found = findItem(args);
            if (!found) return `<p>You don't see "${args}" here to take.</p>`;
            const { id, item } = found;
            if (state.inventory.includes(id)) return `<p>You already have that. Greedy.</p>`;
            if (item.takeable === false) return `<p>You can't take the ${item.name}. It's not meant to be taken. Like your dignity.`;
            state.inventory.push(id);
            if (item.onTake) return `<p>${item.onTake()}</p>`;
            return `<p>You take the ${item.name}. It's yours now. This is how ownership works.</p>`;
        }

        function doUse(args) {
            if (!args) return `<p>Use what? Words? You're already doing that. Poorly.</p>`;
            const found = findItem(args);
            if (!found) return `<p>You don't see "${args}" to use.</p>`;
            if (found.item.onUse) return `<p>${found.item.onUse()}</p>`;
            return `<p>You're not sure how to use the ${found.item.name}. It sits there. Judging you.</p>`;
        }

        function doTalk(args) {
            if (!args) return `<p>Talk to whom? Yourself? You do that enough already.</p>`;
            const found = findNpc(args);
            if (!found) return `<p>There's no "${args}" here to talk to. The walls don't count. (You've tried.)</p>`;
            const dialogue = typeof found.npc.dialogue === 'function' ? found.npc.dialogue : found.npc.dialogue;
            return `<p>${dialogue}</p>`;
        }

        function doInventory() {
            if (!state.inventory.length) return `<p>Your pockets are empty. Much like your soul. And your 401k.</p>`;
            const items = state.inventory.map(id => `<span class="item">${ITEMS[id]?.name || id}</span>`);
            return `<p>You are carrying: ${items.join(', ')}.</p>`;
        }

        function doHelp() {
            return `<p class="system">Commands (try anything — the parser is patient, if snarky):</p>
<p><span class="cmd">/look [thing]</span> — Examine. Anything. The walls. The ceiling. Your regrets.</p>
<p><span class="cmd">/go [direction]</span> — Move. North, south, east, west. Toward freedom.</p>
<p><span class="cmd">/take [item]</span> — Pick things up. If they let you.</p>
<p><span class="cmd">/use [item]</span> — Interact with things. Creatively.</p>
<p><span class="cmd">/talk [person]</span> — Converse with NPCs. They're suffering too.</p>
<p><span class="cmd">/read [thing]</span> — Same as look, but for words.</p>
<p><span class="cmd">/inv</span> — Check your pockets.</p>
${state.flags.magicDiscovered ? '<p><span class="cmd">/cast [spell]</span> — Teleport (3 coffee), Defenestrate (window + target)</p>' : ''}
<p><span class="cmd">/resign</span> — Quit your job. (Requires items.)</p>
<p class="system">You can also try: /smell, /listen, /dance, /scream, /think, /pray, /punch, /huff...</p>`;
        }

        function doCast(args) {
            if (!state.flags.magicDiscovered) {
                return `<p>Cast what? A line? A ballot? This is an office, not a wizard's tower.</p>
<p class="system">(Or is it?)</p>`;
            }
            if (!state.inventory.includes('spellbook')) return `<p>You need the spellbook. Magic requires tools. And caffeine.</p>`;
            const spell = args?.toLowerCase() || '';

            if (spell === 'teleport') {
                if (state.coffee < 3) return `<p class="magic">You begin TELEPORT... the spellbook crackles... fizzles.</p><p>Not enough mana. Need 3 coffee. You have ${state.coffee}.</p>`;
                return triggerEnding('arcane', `You speak the words of power. Reality bends. The office dissolves.

When you open your eyes, you're in a field. Birds sing. The sun is warm. There's no fluorescent lighting. No TPS reports.

Somewhere, Aldric smiles. Another one made it.`);
            }
            if (spell === 'defenestrate') {
                if (state.currentRoom !== 'boss-office') return `<p>DEFENESTRATE requires a window. And a target. And a certain lack of moral clarity.</p>`;
                return triggerEnding('defenestration', `You raise the spellbook. Greg looks up from his synergy metrics.

"Is that... that's against company policy—"

"DEFENESTRATE."

Greg exits through the window. Wilhelm scream. Distant splash into the dumpster full of shredded TPS reports.

You are now Regional Manager of Synergy. You still don't know what that means. But you're free from Greg.`);
            }
            if (spell === 'synergize') return `<p class="magic">You cast SYNERGIZE. Nothing happens. Nobody knows what synergy means. The spell doesn't either.</p>`;
            return `<p>Unknown spell. Try: TELEPORT (3 coffee), DEFENESTRATE (window + boss), SYNERGIZE (???)</p>`;
        }

        function doResign() {
            if (!state.inventory.includes('pen') || !state.inventory.includes('paper')) {
                return `<p>You need <span class="item">PEN</span> and <span class="item">PAPER</span>. Quitting requires documentation. This is corporate hell, not anarchy.</p>`;
            }
            if (!state.flags.hasCourage) {
                return `<p>You have pen. Paper. But not the <span class="item">COURAGE</span>. Something holds you back. Maybe you need liquid assistance.</p>`;
            }
            return triggerEnding('resignation', `You write the letter. Three years of frustration flow through the pen.

"Dear Greg. I quit."

That's all it says. That's all it needs to say.

You walk to Greg's office. Place the letter on his desk. He looks up, confused.

"But... synergy?"

"No more synergy, Greg. Not for me."

The elevator opens immediately. For the first time in history. You step inside. The doors close.

You did it. You quit. With proper documentation. HR would be proud.`);
        }

        function doRead(args) { return doLook(args); }
        function doDrop(args) { return `<p>You can't drop ${args || 'things'}. What if you need them? What if that's the one item that saves you?</p>`; }

        function triggerEnding(type, text) {
            state.endings.push(type);
            const titles = { resignation: 'THE RESIGNATION', arcane: 'THE ARCANE EXIT', defenestration: 'THE DEFENESTRATION' };
            setTimeout(() => {
                document.getElementById('ending-overlay').classList.add('visible');
                document.getElementById('ending-title').textContent = 'ENDING UNLOCKED';
                document.getElementById('ending-text').innerHTML = text.split('\n\n').map(p => `<p>${p}</p>`).join('');
                document.getElementById('ending-type').textContent = titles[type] || type.toUpperCase();
            }, 500);
            return `<p class="magic">${text.split('\n\n')[0]}</p>`;
        }

        // =====================================================
        // MAIN EXECUTE
        // =====================================================
        function execute(input) {
            state.turns++;
            const { cmd, args, verb } = parse(input);

            if (cmd === 'snarky') return `<p>${SNARKY[verb](args)}</p>`;

            switch (cmd) {
                case 'look': return doLook(args);
                case 'go': return doGo(args);
                case 'take': return doTake(args);
                case 'use': return doUse(args);
                case 'talk': return doTalk(args);
                case 'inventory': return doInventory();
                case 'help': return doHelp();
                case 'cast': return doCast(args);
                case 'resign': return doResign();
                case 'read': return doRead(args);
                case 'drop': return doDrop(args);
                default:
                    if (['north','south','east','west','n','s','e','w'].includes(cmd)) return doGo(cmd);
                    return `<p class="error">I don't understand "${input}". Try <span class="cmd">/help</span>. Or don't. I'm a parser, not your therapist.</p>`;
            }
        }

        // =====================================================
        // UI
        // =====================================================
        const output = document.getElementById('output');
        const inputEl = document.getElementById('input');

        function print(html) {
            output.innerHTML += html;
            output.scrollTop = output.scrollHeight;
            updateStats();
        }

        function updateStats() {
            document.getElementById('stat-coffee').textContent = state.coffee;
            document.getElementById('stat-class').innerHTML = state.class
                ? `<span class="class-label">${state.class.toUpperCase()}</span>`
                : '';
        }

        function restart() {
            state = { currentRoom: 'elevator-lobby', inventory: [], coffee: 0, class: null, flags: {}, actions: [], endings: state.endings, turns: 0 };
            output.innerHTML = '';
            document.getElementById('ending-overlay').classList.remove('visible');
            print(`<p class="system">New game. Same hell. Let's go.</p><hr>`);
            print(doLook(''));
        }

        inputEl.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const cmd = inputEl.value.trim();
            if (!cmd) return;
            print(`<p class="system">&gt; ${cmd}</p>`);
            inputEl.value = '';
            print(execute(cmd));
        });

        document.getElementById('btn-restart').addEventListener('click', restart);

        // Start
        print(`<p><em>Welcome to <span style="color: var(--danger)">OFFICE HELL</span>.</em></p>
<p><em>A text adventure for the gainfully employed and spiritually depleted.</em></p>
<p class="system">Type anything. The parser is patient. And snarky.</p><hr>`);
        print(doLook(''));
        inputEl.focus();
    })();
    </script>
</body>
</html>
